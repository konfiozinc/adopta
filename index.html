<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FF6B35">
  <meta name="description" content="Adopta — Tu próximo compañero te espera. Encuentra y adopta mascotas cerca de ti.">
  <title>Adopta · Tu próximo compañero te espera</title>
  <!-- Tipografías: Inter (cuerpo) + DM Serif Display (marca) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Pantalla de carga (Splash Screen) -->
  <div id="splash" class="splash" aria-hidden="true">
    <div class="splash-inner">
      <div class="brand-heart">♥</div>
      <h1 class="splash-logo">Adopta</h1>
      <p class="splash-slogan">Tu próximo compañero te espera</p>
      <div class="loader"><span></span></div>
    </div>
  </div>

  <!-- Notificaciones (toast) -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Contenedor raíz de la SPA -->
  <div id="app" class="app-shell"></div>

  <script src="app.js"></script>
</body>
</html>
