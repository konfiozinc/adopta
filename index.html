<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FF6B35" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#161311" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />

  <title>Adopta · Tu próximo compañero te espera</title>
  <meta name="description" content="Adopta conecta refugios y familias. Explora mascotas verificadas, revisa su estado de salud y envía tu solicitud de adopción en minutos." />
  <meta name="author" content="Adopta" />
  <link rel="canonical" href="https://konfiozinc.github.io/adopta/" />

  <!-- Open Graph / redes sociales -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="es_ES" />
  <meta property="og:site_name" content="Adopta" />
  <meta property="og:title" content="Adopta · Tu próximo compañero te espera" />
  <meta property="og:description" content="Encuentra perros, gatos y conejos en adopción responsable. Solicita en minutos y sigue el estado de tu solicitud." />
  <meta property="og:url" content="https://konfiozinc.github.io/adopta/" />
  <meta property="og:image" content="https://konfiozinc.github.io/adopta/images/mascota-01-luna.png" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Adopta · Tu próximo compañero te espera" />
  <meta name="twitter:description" content="Encuentra perros, gatos y conejos en adopción responsable. Solicita en minutos y sigue el estado de tu solicitud." />
  <meta name="twitter:image" content="https://konfiozinc.github.io/adopta/images/mascota-01-luna.png" />

  <!-- Favicon inline (funciona sin archivos extra) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23FF6B35'/%3E%3Cpath d='M16 24s-7-4.4-7-9.2A4 4 0 0 1 16 12a4 4 0 0 1 7 2.8C23 19.6 16 24 16 24z' fill='%23fff'/%3E%3C/svg%3E" />

  <!-- Tipografía: Outfit (títulos) + Inter (texto) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Hojas de estilo -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>

<body>
  <!-- ==========================================================
       Salto de accesibilidad para lectores de pantalla / teclado
       ========================================================== -->
  <a class="skip-link" href="#vista">Saltar al contenido principal</a>

  <!-- ==========================================================
       SPLASH SCREEN — pantalla de carga
       Se retira automáticamente (o al pulsar / con teclado).
       ========================================================== -->
  <div id="splash" class="splash" role="status" aria-live="polite" aria-label="Cargando Adopta">
    <div class="splash__glow" aria-hidden="true"></div>
    <div class="splash__inner">
      <div class="splash__logo" aria-hidden="true">
        <span class="splash__heart" data-icon="heart"></span>
        <span class="splash__paw splash__paw--1" data-icon="paw"></span>
        <span class="splash__paw splash__paw--2" data-icon="paw"></span>
        <span class="splash__paw splash__paw--3" data-icon="paw"></span>
      </div>

      <h1 class="splash__title">Adopta</h1>
      <p class="splash__slogan">Tu próximo compañero te espera</p>

      <div class="splash__bar" aria-hidden="true"><span></span></div>
      <p class="splash__hint">Preparando historias felices…</p>
    </div>
  </div>

  <!-- ==========================================================
       ENCABEZADO SUPERIOR
       Se oculta en móvil (allí manda la barra inferior) y se
       convierte en la navegación principal en tablet/escritorio.
       ========================================================== -->
  <header class="topbar" id="topbar">
    <div class="topbar__inner">
      <a class="brand" href="#/" aria-label="Adopta, ir al inicio">
        <span class="brand__mark" data-icon="heart"></span>
        <span class="brand__text">
          <strong>Adopta</strong>
          <small>Adopción responsable</small>
        </span>
      </a>

      <nav class="topnav" id="topnav" aria-label="Navegación principal">
        <!-- Se renderiza desde js/ui/topbar.js -->
      </nav>

      <div class="topbar__actions">
        <button class="icon-btn" id="btn-theme" type="button" aria-label="Cambiar tema claro u oscuro" title="Cambiar tema">
          <span data-icon="moon" aria-hidden="true"></span>
        </button>
        <a class="avatar-btn" href="#/cuenta" aria-label="Ir a mi cuenta">
          <span class="avatar avatar--sm" id="topbar-avatar" aria-hidden="true">D</span>
        </a>
      </div>
    </div>
  </header>

  <!-- ==========================================================
       CONTENEDOR PRINCIPAL DE VISTAS (SPA)
       Toda la app se pinta aquí desde el router.
       ========================================================== -->
  <main id="vista" class="vista" tabindex="-1" aria-live="polite"></main>

  <!-- ==========================================================
       BARRA DE NAVEGACIÓN INFERIOR (mobile-first)
       ========================================================== -->
  <nav class="tabbar" id="tabbar" aria-label="Navegación inferior">
    <!-- Se renderiza desde js/ui/tabbar.js -->
  </nav>

  <!-- ==========================================================
       RAÍCES DE MODALES, HOJAS INFERIORES Y NOTIFICACIONES
       ========================================================== -->
  <div id="modal-root"></div>
  <div id="sheet-root"></div>
  <div id="toast-root" class="toast-root" role="region" aria-label="Notificaciones" aria-live="polite"></div>

  <!-- ==========================================================
       NÚCLEO DE LA APLICACIÓN
       Orden de carga = orden de dependencias (sin bundler).
       ========================================================== -->
  <script src="js/utils/icons.js"></script>
  <script src="js/utils/format.js"></script>
  <script src="js/utils/dom.js"></script>
  <script src="js/utils/storage.js"></script>
  <script src="js/utils/a11y.js"></script>
  <script src="js/utils/media.js"></script>
  <script src="js/data/pets.data.js"></script>
  <script src="js/data/user.data.js"></script>
  <script src="js/data/repository.js"></script>
  <script src="js/state.js"></script>
  <script src="js/router.js"></script>
  <script src="js/ui/views.js"></script>
  <script src="js/ui/toast.js"></script>
  <script src="js/ui/modal.js"></script>
  <script src="js/ui/cards.js"></script>
  <script src="js/ui/search.js"></script>
  <script src="js/ui/pet-card.js"></script>
  <script src="js/ui/tabbar.js"></script>
  <script src="js/ui/topbar.js"></script>
  <script src="js/features/adoption-form.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/pets.js"></script>
  <script src="js/pages/pet-detail.js"></script>
  <script src="js/pages/requests.js"></script>
  <script src="js/pages/account.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
