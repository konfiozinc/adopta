/* ==== css/base.css ==== */
/* ============================================================================
 * base.css — Sistema de diseño de Adopta
 * ----------------------------------------------------------------------------
 * 1. Tokens de diseño (colores, tipografía, espaciado, sombras, radios)
 * 2. Reset moderno y estilos base
 * 3. Layout (topbar + vista + tabbar)
 * 4. Splash screen
 * 5. Animaciones globales y accesibilidad de movimiento reducido
 * ========================================================================== */

/* ==========================================================================
   1. TOKENS DE DISEÑO
   ========================================================================== */
:root {
  /* --- Marca: naranja coral cálido --- */
  --c-primary: #FF6B35;
  --c-primary-600: #F25A22;
  --c-primary-700: #D9481A;
  --c-primary-300: #FFA07A;
  --c-primary-100: #FFE9DF;
  --c-primary-50: #FFF4EE;
  --c-primary-soft: #FF8C42;

  /* --- Acentos --- */
  --c-heart: #E63946;          /* corazones y favoritos */
  --c-heart-soft: #FFE5E7;
  --c-success: #2A9D8F;        /* aprobado / saludable */
  --c-success-soft: #E4F5F2;
  --c-warning: #E9A23B;        /* en revisión */
  --c-warning-soft: #FDF2DF;
  --c-danger: #D64545;         /* rechazado */
  --c-danger-soft: #FCE9E9;
  --c-info: #4A7DBF;
  --c-info-soft: #E8F0FA;

  /* --- Neutros / superficies --- */
  --c-bg: #FFFBF8;             /* crema de fondo */
  --c-bg-alt: #FFF6F0;
  --c-surface: #FFFFFF;
  --c-surface-2: #FFF9F5;
  --c-surface-3: #F6EFE9;
  --c-border: #F0E4DC;
  --c-border-strong: #E2D2C7;
  --c-text: #2D2A28;
  --c-text-soft: #6E6660;
  --c-text-mute: #9A908A;
  --c-overlay: rgba(45, 42, 40, .5);

  /* --- Degradados --- */
  --g-primary: linear-gradient(135deg, #FF8C42 0%, #FF6B35 55%, #F2542D 100%);
  --g-warm: linear-gradient(180deg, #FFF4EE 0%, #FFFFFF 100%);
  --g-cream: linear-gradient(160deg, #FFFBF8 0%, #FFF1E8 100%);
  --g-heart: linear-gradient(135deg, #FF7A85 0%, #E63946 100%);
  --g-glass: linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.7));

  /* --- Tipografía --- */
  --f-display: 'Outfit', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-body: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --fs-xs: .75rem;    /* 12 */
  --fs-sm: .8125rem;  /* 13 */
  --fs-md: .9375rem;  /* 15 */
  --fs-base: 1rem;    /* 16 */
  --fs-lg: 1.125rem;  /* 18 */
  --fs-xl: 1.375rem;  /* 22 */
  --fs-2xl: 1.75rem;  /* 28 */
  --fs-3xl: 2.25rem;  /* 36 */
  --fs-4xl: 3rem;     /* 48 */

  /* --- Espaciado (escala de 4px) --- */
  --s-1: 4px;  --s-2: 8px;  --s-3: 12px; --s-4: 16px;
  --s-5: 20px; --s-6: 24px; --s-8: 32px; --s-10: 40px;
  --s-12: 48px; --s-16: 64px; --s-20: 80px;

  /* --- Radios --- */
  --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 26px; --r-2xl: 34px; --r-pill: 999px;

  /* --- Sombras --- */
  --sh-xs: 0 1px 2px rgba(45, 42, 40, .05);
  --sh-sm: 0 2px 8px rgba(45, 42, 40, .06);
  --sh-md: 0 8px 24px rgba(45, 42, 40, .08);
  --sh-lg: 0 18px 44px rgba(45, 42, 40, .12);
  --sh-primary: 0 10px 26px rgba(255, 107, 53, .32);
  --sh-heart: 0 10px 24px rgba(230, 57, 70, .28);

  /* --- Layout --- */
  --w-max: 1180px;
  --h-topbar: 68px;
  --h-tabbar: 66px;

  /* --- Movimiento --- */
  --t-fast: .16s cubic-bezier(.4, 0, .2, 1);
  --t-base: .28s cubic-bezier(.4, 0, .2, 1);
  --t-slow: .5s cubic-bezier(.22, 1, .36, 1);
}

/* ==========================================================================
   TEMA OSCURO — mantiene la calidez (marrones profundos, no negro puro)
   ========================================================================== */
html[data-theme='dark'] {
  --c-bg: #161311;
  --c-bg-alt: #1D1917;
  --c-surface: #211D1A;
  --c-surface-2: #262120;
  --c-surface-3: #2F2926;
  --c-border: #382F2B;
  --c-border-strong: #4A3E38;
  --c-text: #F7F1EC;
  --c-text-soft: #BEB2A9;
  --c-text-mute: #8C8079;
  --c-overlay: rgba(10, 8, 7, .66);
  --c-primary-50: #2B1E17;
  --c-primary-100: #3A2519;
  --c-heart-soft: #3A2124;
  --c-success-soft: #1B2E2B;
  --c-warning-soft: #33291A;
  --c-danger-soft: #331F1F;
  --c-info-soft: #1D2733;
  --g-warm: linear-gradient(180deg, #241E1A 0%, #1B1715 100%);
  --g-cream: linear-gradient(160deg, #1C1715 0%, #241D19 100%);
  --g-glass: linear-gradient(180deg, rgba(33,29,26,.94), rgba(33,29,26,.78));
  --sh-xs: 0 1px 2px rgba(0,0,0,.4);
  --sh-sm: 0 2px 10px rgba(0,0,0,.45);
  --sh-md: 0 10px 26px rgba(0,0,0,.5);
  --sh-lg: 0 20px 48px rgba(0,0,0,.6);
}

/* ==========================================================================
   2. RESET + BASE
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }

* { margin: 0; padding: 0; }

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
  scroll-padding-top: calc(var(--h-topbar) + var(--s-4));
}

body {
  font-family: var(--f-body);
  font-size: var(--fs-base);
  line-height: 1.6;
  color: var(--c-text);
  background: var(--c-bg);
  min-height: 100dvh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transition: background var(--t-base), color var(--t-base);
}

h1, h2, h3, h4, h5 {
  font-family: var(--f-display);
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -.02em;
  color: var(--c-text);
}

h1 { font-size: var(--fs-2xl); }
h2 { font-size: var(--fs-xl); }
h3 { font-size: var(--fs-lg); }
h4 { font-size: var(--fs-base); }

p { color: var(--c-text-soft); }

a { color: inherit; text-decoration: none; }

img { max-width: 100%; display: block; }

button, input, select, textarea {
  font: inherit;
  color: inherit;
  border: none;
  background: none;
}

button { cursor: pointer; -webkit-tap-highlight-color: transparent; }

ul, ol { list-style: none; }

svg.icon { width: 22px; height: 22px; flex: none; display: block; }

/* Foco visible y consistente para navegación por teclado */
:focus-visible {
  outline: 3px solid var(--c-primary);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

::selection { background: var(--c-primary-100); color: var(--c-primary-700); }

/* Barra de desplazamiento discreta (escritorio) */
::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--c-border-strong);
  border-radius: var(--r-pill);
  border: 3px solid var(--c-bg);
}
::-webkit-scrollbar-thumb:hover { background: var(--c-primary-300); }

/* Saltar al contenido */
.skip-link {
  position: fixed;
  top: -100px; left: var(--s-4);
  z-index: 300;
  padding: var(--s-3) var(--s-5);
  background: var(--c-primary);
  color: #fff;
  border-radius: 0 0 var(--r-md) var(--r-md);
  font-weight: 600;
  transition: top var(--t-base);
}
.skip-link:focus { top: 0; }

/* Utilidades de accesibilidad y layout */
.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}
.stack   { display: flex; flex-direction: column; }
.row     { display: flex; align-items: center; }
.between { display: flex; align-items: center; justify-content: space-between; }
.wrap    { flex-wrap: wrap; }
.grow    { flex: 1 1 auto; min-width: 0; }
.center  { display: flex; align-items: center; justify-content: center; }
.text-center { text-align: center; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clamp-2 {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.clamp-3 {
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}

/* ==========================================================================
   3. LAYOUT PRINCIPAL
   ========================================================================== */
.topbar {
  position: sticky;
  top: 0;
  z-index: 60;
  background: var(--g-glass);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid transparent;
  transition: border-color var(--t-base), box-shadow var(--t-base), background var(--t-base);
}
.topbar.is-scrolled {
  border-bottom-color: var(--c-border);
  box-shadow: var(--sh-xs);
}
.topbar__inner {
  max-width: var(--w-max);
  margin: 0 auto;
  padding: var(--s-3) var(--s-4);
  display: flex;
  align-items: center;
  gap: var(--s-4);
  min-height: var(--h-topbar);
}

.brand { display: flex; align-items: center; gap: var(--s-3); flex: none; }
.brand__mark {
  width: 42px; height: 42px;
  display: grid; place-items: center;
  border-radius: 14px;
  background: var(--g-primary);
  color: #fff;
  box-shadow: var(--sh-primary);
  transition: transform var(--t-base);
}
.brand__mark svg { width: 22px; height: 22px; }
.brand:hover .brand__mark { transform: rotate(-8deg) scale(1.06); }
.brand__text { display: flex; flex-direction: column; line-height: 1.15; }
.brand__text strong {
  font-family: var(--f-display);
  font-size: var(--fs-lg);
  font-weight: 800;
  letter-spacing: -.03em;
}
.brand__text small { font-size: var(--fs-xs); color: var(--c-text-mute); }

.topnav { display: none; }        /* visible desde tablet en components.css */
.topbar__actions { margin-left: auto; display: flex; align-items: center; gap: var(--s-2); }

.vista {
  max-width: var(--w-max);
  margin: 0 auto;
  padding: var(--s-4) var(--s-4) calc(var(--h-tabbar) + var(--s-10));
  outline: none;
  min-height: 60vh;
}

/* Barra inferior — patrón mobile-first, fija y segura en iOS */
.tabbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 70;
  height: calc(var(--h-tabbar) + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--g-glass);
  backdrop-filter: saturate(180%) blur(16px);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  border-top: 1px solid var(--c-border);
}

/* ==========================================================================
   4. SPLASH SCREEN
   ========================================================================== */
.splash {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: grid;
  place-items: center;
  background: var(--g-cream);
  transition: opacity .5s ease, visibility .5s ease, transform .5s ease;
}
.splash.is-hidden {
  opacity: 0;
  visibility: hidden;
  transform: scale(1.03);
  pointer-events: none;
}
.splash__glow {
  position: absolute;
  width: min(78vw, 460px); aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,140,66,.30) 0%, rgba(255,107,53,.10) 42%, transparent 70%);
  filter: blur(6px);
  animation: splashGlow 3.4s ease-in-out infinite;
}
.splash__inner {
  position: relative;
  display: flex; flex-direction: column; align-items: center;
  text-align: center;
  padding: var(--s-8);
  animation: splashRise .8s cubic-bezier(.22,1,.36,1) both;
}
.splash__logo {
  position: relative;
  width: 118px; height: 118px;
  display: grid; place-items: center;
  border-radius: 38px;
  background: var(--g-primary);
  box-shadow: var(--sh-primary);
  margin-bottom: var(--s-6);
}
.splash__heart { color: #fff; animation: heartBeat 1.5s ease-in-out infinite; }
.splash__heart svg { width: 52px; height: 52px; }
.splash__paw {
  position: absolute;
  color: rgba(255,255,255,.6);
  animation: pawFloat 3s ease-in-out infinite;
}
.splash__paw svg { width: 16px; height: 16px; }
.splash__paw--1 { top: -14px; right: -8px;  animation-delay: .1s; }
.splash__paw--2 { bottom: -12px; left: -12px; animation-delay: .7s; }
.splash__paw--3 { top: 26px; left: -22px; animation-delay: 1.3s; }

.splash__title {
  font-family: var(--f-display);
  font-size: clamp(2.6rem, 12vw, var(--fs-4xl));
  font-weight: 800;
  letter-spacing: -.045em;
  background: var(--g-primary);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
}
.splash__slogan {
  margin-top: var(--s-2);
  font-size: var(--fs-md);
  color: var(--c-text-soft);
  letter-spacing: .01em;
}
.splash__bar {
  margin-top: var(--s-8);
  width: min(200px, 58vw);
  height: 6px;
  border-radius: var(--r-pill);
  background: var(--c-primary-100);
  overflow: hidden;
}
.splash__bar span {
  display: block;
  height: 100%; width: 45%;
  border-radius: var(--r-pill);
  background: var(--g-primary);
  animation: splashLoad 1.4s cubic-bezier(.5,0,.5,1) infinite;
}
.splash__hint {
  margin-top: var(--s-3);
  font-size: var(--fs-xs);
  color: var(--c-text-mute);
  letter-spacing: .06em;
  text-transform: uppercase;
}

/* ==========================================================================
   5. ANIMACIONES
   ========================================================================== */
@keyframes splashLoad {
  0%   { transform: translateX(-100%); }
  100% { transform: translateX(320%); }
}
@keyframes splashGlow {
  0%, 100% { transform: scale(1); opacity: .85; }
  50%      { transform: scale(1.12); opacity: 1; }
}
@keyframes splashRise {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes heartBeat {
  0%, 100% { transform: scale(1); }
  14%      { transform: scale(1.18); }
  28%      { transform: scale(1); }
  42%      { transform: scale(1.12); }
}
@keyframes pawFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); opacity: .5; }
  50%      { transform: translateY(-7px) rotate(12deg); opacity: .9; }
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes popIn {
  0%   { transform: scale(.9); opacity: 0; }
  60%  { transform: scale(1.02); opacity: 1; }
  100% { transform: scale(1); }
}
@keyframes heartPop {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.38); }
  70%  { transform: scale(.92); }
  100% { transform: scale(1); }
}
@keyframes shimmer {
  0%   { background-position: -420px 0; }
  100% { background-position: 420px 0; }
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes toastIn {
  from { opacity: 0; transform: translateY(14px) scale(.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* Entrada escalonada de bloques de página (--i lo define cada página) */
.reveal { animation: fadeUp .5s cubic-bezier(.22,1,.36,1) both; animation-delay: calc(var(--i, 0) * 55ms); }

/* Respeta la preferencia del sistema de reducir movimiento */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
}

/* ==========================================================================
   PUNTOS DE RUPTURA DEL LAYOUT
   ========================================================================== */
@media (min-width: 768px) {
  :root { --h-topbar: 74px; }
  .vista { padding: var(--s-6) var(--s-6) var(--s-16); }
  h1 { font-size: var(--fs-3xl); }
  h2 { font-size: var(--fs-2xl); }
}

@media (min-width: 900px) {
  /* En escritorio la navegación vive arriba: la barra inferior desaparece */
  .tabbar { display: none; }
  .vista { padding-bottom: var(--s-16); }
  .topnav { display: flex; }
}

/* ==== css/components.css ==== */
/* ============================================================================
 * components.css — Componentes reutilizables de Adopta
 * ----------------------------------------------------------------------------
 * Buttons · Chips · Badges · Cards · Pet card · Nav (top + bottom) ·
 * Search · Modal · Bottom sheet · Forms · Toasts · Empty states · Skeletons
 * ========================================================================== */

/* ==========================================================================
   BOTONES
   ========================================================================== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s-2);
  padding: var(--s-3) var(--s-5);
  border-radius: var(--r-pill);
  font-family: var(--f-display);
  font-size: var(--fs-md);
  font-weight: 600;
  letter-spacing: -.01em;
  white-space: nowrap;
  transition: transform var(--t-fast), box-shadow var(--t-base), background var(--t-base),
              color var(--t-base), border-color var(--t-base), opacity var(--t-fast);
  user-select: none;
}
.btn svg.icon { width: 19px; height: 19px; }
.btn:active { transform: scale(.97); }
.btn:disabled, .btn[aria-disabled='true'] { opacity: .5; pointer-events: none; }

.btn--primary {
  background: var(--g-primary);
  color: #fff;
  box-shadow: var(--sh-primary);
}
.btn--primary:hover { transform: translateY(-2px); box-shadow: 0 14px 32px rgba(255,107,53,.4); }

.btn--ghost {
  background: var(--c-surface);
  color: var(--c-text);
  border: 1.5px solid var(--c-border);
  box-shadow: var(--sh-xs);
}
.btn--ghost:hover { border-color: var(--c-primary-300); color: var(--c-primary-700); background: var(--c-primary-50); }

.btn--soft { background: var(--c-primary-50); color: var(--c-primary-700); }
.btn--soft:hover { background: var(--c-primary-100); }

.btn--heart { background: var(--c-heart-soft); color: var(--c-heart); }
.btn--heart:hover { background: var(--c-heart); color: #fff; }

.btn--danger { background: var(--c-danger-soft); color: var(--c-danger); }
.btn--danger:hover { background: var(--c-danger); color: #fff; }

.btn--lg { padding: var(--s-4) var(--s-8); font-size: var(--fs-lg); }
.btn--sm { padding: var(--s-2) var(--s-4); font-size: var(--fs-sm); }
.btn--block { width: 100%; }
.btn--icon { padding: var(--s-3); aspect-ratio: 1; }

/* Botón de icono cuadrado (topbar, tarjetas) */
.icon-btn {
  width: 42px; height: 42px;
  display: grid; place-items: center;
  border-radius: var(--r-md);
  color: var(--c-text-soft);
  background: transparent;
  transition: background var(--t-base), color var(--t-base), transform var(--t-fast);
}
.icon-btn:hover { background: var(--c-primary-50); color: var(--c-primary-700); }
.icon-btn:active { transform: scale(.93); }

/* Botón flotante sobre imágenes (favorito) */
.fab {
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: rgba(255,255,255,.94);
  color: var(--c-text-soft);
  box-shadow: var(--sh-sm);
  backdrop-filter: blur(6px);
  transition: transform var(--t-base), color var(--t-base), background var(--t-base);
}
.fab:hover { transform: scale(1.1); color: var(--c-heart); }
.fab.is-active { color: #fff; background: var(--g-heart); box-shadow: var(--sh-heart); }
.fab.is-pop svg { animation: heartPop .45s cubic-bezier(.22,1,.36,1); }

/* ==========================================================================
   CHIPS (filtros) Y BADGES
   ========================================================================== */
.chips {
  display: flex;
  gap: var(--s-2);
  overflow-x: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
  padding: var(--s-1) 0;
  scroll-snap-type: x proximity;
}
.chips::-webkit-scrollbar { display: none; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: var(--s-2);
  padding: var(--s-2) var(--s-4);
  border-radius: var(--r-pill);
  background: var(--c-surface);
  border: 1.5px solid var(--c-border);
  color: var(--c-text-soft);
  font-size: var(--fs-sm);
  font-weight: 600;
  white-space: nowrap;
  scroll-snap-align: start;
  transition: all var(--t-base);
}
.chip svg.icon { width: 17px; height: 17px; }
.chip:hover { border-color: var(--c-primary-300); color: var(--c-primary-700); background: var(--c-primary-50); }
.chip.is-active {
  background: var(--g-primary);
  border-color: transparent;
  color: #fff;
  box-shadow: var(--sh-primary);
}
.chip__count {
  font-size: var(--fs-xs);
  padding: 1px 7px;
  border-radius: var(--r-pill);
  background: var(--c-surface-3);
  color: var(--c-text-mute);
}
.chip.is-active .chip__count { background: rgba(255,255,255,.24); color: #fff; }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px var(--s-3);
  border-radius: var(--r-pill);
  font-size: var(--fs-xs);
  font-weight: 700;
  letter-spacing: .01em;
  background: var(--c-surface-3);
  color: var(--c-text-soft);
}
.badge svg.icon { width: 14px; height: 14px; }
.badge--primary { background: var(--c-primary-100); color: var(--c-primary-700); }
.badge--warning { background: var(--c-warning-soft); color: #9A6A14; }
.badge--success { background: var(--c-success-soft); color: #1E7A6F; }
.badge--danger  { background: var(--c-danger-soft);  color: #B03636; }
.badge--info    { background: var(--c-info-soft);    color: #34618F; }
.badge--heart   { background: var(--c-heart-soft);   color: var(--c-heart); }
.badge--glass {
  background: rgba(255,255,255,.92);
  color: var(--c-text);
  box-shadow: var(--sh-xs);
  backdrop-filter: blur(6px);
}
.badge--float { position: absolute; top: var(--s-3); left: var(--s-3); z-index: 2; }

/* Píldora de dato (peso, edad) */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px var(--s-3);
  border-radius: var(--r-pill);
  background: var(--c-primary-50);
  color: var(--c-primary-700);
  font-size: var(--fs-xs);
  font-weight: 600;
}
.pill svg.icon { width: 14px; height: 14px; }
.pill--neutral { background: var(--c-surface-3); color: var(--c-text-soft); }

/* ==========================================================================
   AVATAR
   ========================================================================== */
.avatar {
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--g-primary);
  color: #fff;
  font-family: var(--f-display);
  font-weight: 700;
  letter-spacing: -.02em;
  flex: none;
  overflow: hidden;
  width: 46px; height: 46px;
  font-size: var(--fs-lg);
  box-shadow: var(--sh-sm);
  text-transform: uppercase;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar--sm { width: 36px; height: 36px; font-size: var(--fs-md); box-shadow: none; }
.avatar--lg { width: 76px; height: 76px; font-size: var(--fs-2xl); }
.avatar--xl { width: 104px; height: 104px; font-size: var(--fs-3xl); }
.avatar-ring { padding: 4px; border-radius: 50%; background: var(--g-primary); display: inline-block; }
.avatar-btn { border-radius: 50%; transition: transform var(--t-base); }
.avatar-btn:hover { transform: scale(1.08); }

/* ==========================================================================
   TARJETAS GENÉRICAS
   ========================================================================== */
.card {
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--r-lg);
  box-shadow: var(--sh-sm);
  transition: transform var(--t-base), box-shadow var(--t-base), border-color var(--t-base);
}
.card--pad { padding: var(--s-5); }
.card--hover:hover { transform: translateY(-3px); box-shadow: var(--sh-md); border-color: var(--c-primary-100); }
.card__head { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); margin-bottom: var(--s-4); }
.card__title { font-family: var(--f-display); font-size: var(--fs-lg); font-weight: 700; }
.card__sub { font-size: var(--fs-sm); color: var(--c-text-mute); }

/* Separador con título */
.section-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--s-4);
  margin-bottom: var(--s-4);
}
.section-head__title { display: flex; align-items: center; gap: var(--s-2); }
.section-head__title svg.icon { color: var(--c-primary); width: 20px; height: 20px; }
.section-head h2 { font-size: var(--fs-xl); }
.section-head p { font-size: var(--fs-sm); margin-top: 2px; }
.link-more {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: var(--fs-sm); font-weight: 600; color: var(--c-primary-700);
  transition: gap var(--t-base), color var(--t-base);
}
.link-more:hover { gap: 8px; color: var(--c-primary); }
.link-more svg.icon { width: 16px; height: 16px; }

/* ==========================================================================
   TARJETA DE MASCOTA
   ========================================================================== */
.pet-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--s-4);
}
@media (min-width: 640px) { .pet-grid { gap: var(--s-5); } }
@media (min-width: 768px) { .pet-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1080px) { .pet-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

.pet-card {
  position: relative;
  display: flex;
  flex-direction: column;
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--r-lg);
  overflow: hidden;
  box-shadow: var(--sh-sm);
  transition: transform var(--t-base), box-shadow var(--t-base), border-color var(--t-base);
  animation: fadeUp .5s cubic-bezier(.22,1,.36,1) both;
  animation-delay: calc(var(--i, 0) * 45ms);
}
.pet-card:hover {
  transform: translateY(-5px);
  box-shadow: var(--sh-lg);
  border-color: var(--c-primary-100);
}
.pet-card__media {
  position: relative;
  aspect-ratio: 1 / 1;
  overflow: hidden;
  background: var(--c-surface-3);
}
.pet-card__img {
  width: 100%; height: 100%;
  object-fit: cover;
  transition: transform var(--t-slow), opacity .4s ease;
  opacity: 0;
}
.pet-card__img.is-loaded { opacity: 1; }
.pet-card:hover .pet-card__img { transform: scale(1.07); }
.pet-card__fav { position: absolute; top: var(--s-3); right: var(--s-3); z-index: 3; }
.pet-card__body { padding: var(--s-3) var(--s-4) var(--s-4); display: flex; flex-direction: column; gap: var(--s-2); flex: 1; }
.pet-card__name {
  font-family: var(--f-display);
  font-size: var(--fs-lg);
  font-weight: 700;
  display: flex; align-items: center; gap: 6px;
}
.pet-card__name .sex { color: var(--c-text-mute); display: inline-flex; }
.pet-card__name .sex svg.icon { width: 15px; height: 15px; }
.pet-card__breed { font-size: var(--fs-sm); color: var(--c-text-mute); margin-top: -4px; }
.pet-card__meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
.pet-card__cta {
  position: absolute;
  left: var(--s-3); right: var(--s-3); bottom: var(--s-3);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity var(--t-base), transform var(--t-base);
  pointer-events: none;
}
@media (hover: none) {
  /* En táctil no hay hover: el CTA siempre visible sería ruidoso, así que
     se apoya en la tarjeta completa + botón "Conocer más" del detalle. */
  .pet-card__cta { display: none; }
}
@media (hover: hover) and (min-width: 640px) {
  .pet-card:hover .pet-card__cta { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .pet-card:hover .pet-card__media::after { opacity: 1; }
}
.pet-card__media::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(20,15,12,.45), transparent 55%);
  opacity: 0;
  transition: opacity var(--t-base);
  pointer-events: none;
}

/* Esqueleto de carga de imagen */
.img-skeleton {
  position: absolute; inset: 0;
  background: linear-gradient(90deg, var(--c-surface-3) 25%, var(--c-surface-2) 50%, var(--c-surface-3) 75%);
  background-size: 840px 100%;
  animation: shimmer 1.5s linear infinite;
}
/* Respaldo cuando la imagen remota falla: degradado cálido + inicial */
.img-fallback {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  color: rgba(255,255,255,.85);
}
.img-fallback__initial {
  font-family: var(--f-display);
  font-size: clamp(1.6rem, 8vw, 2.6rem);
  font-weight: 800;
  text-shadow: 0 2px 10px rgba(0,0,0,.18);
}
.img-fallback svg.icon { width: 34px; height: 34px; opacity: .9; margin-top: 4px; }

/* ==========================================================================
   BUSCADOR
   ========================================================================== */
.search {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--s-3);
  padding: var(--s-3) var(--s-4);
  background: var(--c-surface);
  border: 1.5px solid var(--c-border);
  border-radius: var(--r-pill);
  box-shadow: var(--sh-sm);
  transition: border-color var(--t-base), box-shadow var(--t-base);
}
.search:focus-within { border-color: var(--c-primary); box-shadow: 0 0 0 4px var(--c-primary-50); }
.search svg.icon { color: var(--c-text-mute); }
.search input {
  flex: 1;
  min-width: 0;
  font-size: var(--fs-md);
  background: transparent;
}
.search input::placeholder { color: var(--c-text-mute); }
.search__clear {
  width: 26px; height: 26px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--c-surface-3);
  color: var(--c-text-soft);
  opacity: 0; pointer-events: none;
  transition: opacity var(--t-base), background var(--t-base);
}
.search__clear svg.icon { width: 15px; height: 15px; }
.search.has-value .search__clear { opacity: 1; pointer-events: auto; }
.search__clear:hover { background: var(--c-danger-soft); color: var(--c-danger); }

/* Sugerencias de autocompletado */
.suggest {
  position: absolute;
  top: calc(100% + 8px);
  left: 0; right: 0;
  z-index: 40;
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--r-lg);
  box-shadow: var(--sh-lg);
  padding: var(--s-2);
  max-height: 340px;
  overflow-y: auto;
  animation: fadeUp .2s ease both;
}
.suggest__item {
  display: flex; align-items: center; gap: var(--s-3);
  width: 100%;
  padding: var(--s-2) var(--s-3);
  border-radius: var(--r-md);
  text-align: left;
  transition: background var(--t-fast);
}
.suggest__item:hover, .suggest__item.is-active { background: var(--c-primary-50); }
.suggest__thumb {
  width: 40px; height: 40px; border-radius: 12px;
  object-fit: cover; flex: none; background: var(--c-surface-3);
}
.suggest__item strong { font-weight: 600; font-size: var(--fs-md); display: block; }
.suggest__item small { font-size: var(--fs-xs); color: var(--c-text-mute); }
.suggest__empty { padding: var(--s-4); text-align: center; font-size: var(--fs-sm); color: var(--c-text-mute); }

/* ==========================================================================
   NAVEGACIÓN — superior (escritorio) e inferior (móvil)
   ========================================================================== */
.topnav { align-items: center; gap: var(--s-1); }
.topnav__link {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: var(--s-2);
  padding: var(--s-2) var(--s-4);
  border-radius: var(--r-pill);
  font-size: var(--fs-md);
  font-weight: 600;
  color: var(--c-text-soft);
  transition: background var(--t-base), color var(--t-base);
}
.topnav__link svg.icon { width: 19px; height: 19px; }
.topnav__link:hover { background: var(--c-primary-50); color: var(--c-primary-700); }
.topnav__link.is-active { background: var(--c-primary-50); color: var(--c-primary-700); }
.topnav__link.is-active::after {
  content: '';
  position: absolute;
  left: 50%; bottom: 2px;
  width: 18px; height: 3px;
  border-radius: var(--r-pill);
  background: var(--c-primary);
  transform: translateX(-50%);
}
.topnav__badge {
  min-width: 20px; height: 20px;
  padding: 0 6px;
  display: inline-grid; place-items: center;
  border-radius: var(--r-pill);
  background: var(--c-primary);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  line-height: 1;
}
.topnav__link.is-active .topnav__badge { background: var(--c-primary-700); }

.tabbar__inner {
  height: var(--h-tabbar);
  max-width: 560px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  align-items: center;
}
.tab {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  height: 100%;
  color: var(--c-text-mute);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .01em;
  transition: color var(--t-base);
}
.tab svg.icon { width: 23px; height: 23px; transition: transform var(--t-base); }
.tab:hover { color: var(--c-primary-700); }
.tab.is-active { color: var(--c-primary); }
.tab.is-active svg.icon { transform: translateY(-1px) scale(1.06); }
.tab.is-active::before {
  content: '';
  position: absolute;
  top: 6px;
  width: 34px; height: 34px;
  border-radius: 12px;
  background: var(--c-primary-50);
  z-index: -1;
  animation: popIn .28s ease both;
}
.tab__badge {
  position: absolute;
  top: 6px;
  left: 50%;
  transform: translateX(6px);
  min-width: 18px; height: 18px;
  padding: 0 5px;
  display: grid; place-items: center;
  border-radius: var(--r-pill);
  background: var(--c-heart);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  line-height: 1;
  border: 2px solid var(--c-surface);
}
.tab__badge[hidden] { display: none; }

/* ==========================================================================
   MODAL Y HOJA INFERIOR
   ========================================================================== */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: var(--c-overlay);
  backdrop-filter: blur(3px);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 0;
  animation: fadeIn .2s ease both;
  overflow-y: auto;
  overscroll-behavior: contain;
}
@media (min-width: 640px) {
  .overlay { align-items: center; padding: var(--s-6); }
}
.overlay.is-closing { animation: fadeIn .18s ease reverse both; }

.modal {
  position: relative;
  width: 100%;
  max-width: 560px;
  max-height: 92dvh;
  display: flex;
  flex-direction: column;
  background: var(--c-surface);
  border-radius: var(--r-2xl) var(--r-2xl) 0 0;
  box-shadow: var(--sh-lg);
  animation: sheetUp .34s cubic-bezier(.22,1,.36,1) both;
  margin-top: auto;
}
@media (min-width: 640px) {
  .modal { border-radius: var(--r-2xl); margin: auto; max-height: 88dvh; }
}
.modal--wide { max-width: 760px; }
@keyframes sheetUp {
  from { transform: translateY(26px); opacity: .6; }
  to   { transform: translateY(0); opacity: 1; }
}
.modal__grab { width: 42px; height: 4px; border-radius: var(--r-pill); background: var(--c-border-strong); margin: var(--s-3) auto 0; }
@media (min-width: 640px) { .modal__grab { display: none; } }
.modal__head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--s-4);
  padding: var(--s-5) var(--s-5) var(--s-3);
  border-bottom: 1px solid var(--c-border);
}
.modal__title { font-size: var(--fs-xl); }
.modal__sub { font-size: var(--fs-sm); color: var(--c-text-mute); margin-top: 2px; }
.modal__body { padding: var(--s-5); overflow-y: auto; flex: 1; }
.modal__foot {
  display: flex;
  gap: var(--s-3);
  padding: var(--s-4) var(--s-5) calc(var(--s-5) + env(safe-area-inset-bottom, 0px));
  border-top: 1px solid var(--c-border);
  background: var(--c-surface-2);
}
@media (min-width: 640px) { .modal__foot { border-radius: 0 0 var(--r-2xl) var(--r-2xl); } }
.modal__close { flex: none; }

/* ==========================================================================
   FORMULARIOS
   ========================================================================== */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: var(--s-4); }
.field__label {
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--c-text);
  display: flex;
  align-items: center;
  gap: var(--s-2);
}
.field__label .req { color: var(--c-heart); }
.field__hint { font-size: var(--fs-xs); color: var(--c-text-mute); }
.field__error {
  display: none;
  align-items: center;
  gap: 5px;
  font-size: var(--fs-xs);
  font-weight: 600;
  color: var(--c-danger);
}
.field.has-error .field__error { display: flex; }
.field.has-error .input,
.field.has-error .textarea,
.field.has-error .select { border-color: var(--c-danger); background: var(--c-danger-soft); }

.input, .textarea, .select {
  width: 100%;
  padding: var(--s-3) var(--s-4);
  background: var(--c-surface-2);
  border: 1.5px solid var(--c-border);
  border-radius: var(--r-md);
  font-size: var(--fs-md);
  transition: border-color var(--t-base), box-shadow var(--t-base), background var(--t-base);
}
.input:focus, .textarea:focus, .select:focus {
  outline: none;
  border-color: var(--c-primary);
  background: var(--c-surface);
  box-shadow: 0 0 0 4px var(--c-primary-50);
}
.input::placeholder, .textarea::placeholder { color: var(--c-text-mute); }
.textarea { min-height: 108px; resize: vertical; line-height: 1.55; }
.select { appearance: none; cursor: pointer; background-image: none; padding-right: var(--s-10); }
.select-wrap { position: relative; }
.select-wrap::after {
  content: '';
  position: absolute;
  right: var(--s-4); top: 50%;
  width: 9px; height: 9px;
  border-right: 2px solid var(--c-text-mute);
  border-bottom: 2px solid var(--c-text-mute);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}

/* Grupo de opciones tipo tarjeta (radio/checkbox accesible) */
.option-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--s-2); }
.option-grid--3 { grid-template-columns: repeat(3, 1fr); }
.option {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: var(--s-3) var(--s-2);
  border: 1.5px solid var(--c-border);
  border-radius: var(--r-md);
  background: var(--c-surface-2);
  font-size: var(--fs-sm);
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  transition: all var(--t-base);
}
.option svg.icon { width: 21px; height: 21px; color: var(--c-text-mute); transition: color var(--t-base); }
.option:hover { border-color: var(--c-primary-300); background: var(--c-primary-50); }
.option input { position: absolute; opacity: 0; pointer-events: none; }
.option:has(input:checked) {
  border-color: var(--c-primary);
  background: var(--c-primary-50);
  color: var(--c-primary-700);
  box-shadow: 0 0 0 3px var(--c-primary-100);
}
.option:has(input:checked) svg.icon { color: var(--c-primary); }
.option:has(input:focus-visible) { outline: 3px solid var(--c-primary); outline-offset: 2px; }

/* Interruptor (ajustes de cuenta) */
.switch { position: relative; width: 48px; height: 28px; flex: none; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch__track {
  position: absolute; inset: 0;
  border-radius: var(--r-pill);
  background: var(--c-border-strong);
  transition: background var(--t-base);
}
.switch__track::after {
  content: '';
  position: absolute;
  top: 3px; left: 3px;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: #fff;
  box-shadow: var(--sh-xs);
  transition: transform var(--t-base);
}
.switch input:checked + .switch__track { background: var(--c-primary); }
.switch input:checked + .switch__track::after { transform: translateX(20px); }
.switch input:focus-visible + .switch__track { outline: 3px solid var(--c-primary); outline-offset: 2px; }

/* ==========================================================================
   PROGRESO (flujo de adopción multi-paso)
   ========================================================================== */
.steps { display: flex; align-items: center; gap: var(--s-2); margin-bottom: var(--s-5); }
.steps__item { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.steps__bar { height: 5px; border-radius: var(--r-pill); background: var(--c-border); overflow: hidden; }
.steps__bar span { display: block; height: 100%; width: 0; background: var(--g-primary); border-radius: var(--r-pill); transition: width var(--t-slow); }
.steps__item.is-done .steps__bar span, .steps__item.is-current .steps__bar span { width: 100%; }
.steps__label { font-size: 11px; font-weight: 600; color: var(--c-text-mute); }
.steps__item.is-current .steps__label, .steps__item.is-done .steps__label { color: var(--c-primary-700); }

/* ==========================================================================
   TOASTS
   ========================================================================== */
.toast-root {
  position: fixed;
  left: 50%;
  bottom: calc(var(--h-tabbar) + var(--s-4) + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  z-index: 150;
  display: flex;
  flex-direction: column-reverse;
  gap: var(--s-2);
  width: min(440px, calc(100vw - var(--s-8)));
  pointer-events: none;
}
@media (min-width: 900px) { .toast-root { bottom: var(--s-6); } }
.toast {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  padding: var(--s-3) var(--s-4);
  border-radius: var(--r-lg);
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  box-shadow: var(--sh-lg);
  font-size: var(--fs-sm);
  font-weight: 500;
  animation: toastIn .3s cubic-bezier(.22,1,.36,1) both;
  pointer-events: auto;
}
.toast.is-out { animation: toastIn .22s ease reverse both; }
.toast__icon {
  width: 32px; height: 32px;
  display: grid; place-items: center;
  border-radius: 10px;
  flex: none;
}
.toast__icon svg.icon { width: 18px; height: 18px; }
.toast--success .toast__icon { background: var(--c-success-soft); color: var(--c-success); }
.toast--error   .toast__icon { background: var(--c-danger-soft);  color: var(--c-danger); }
.toast--info    .toast__icon { background: var(--c-info-soft);    color: var(--c-info); }
.toast--heart   .toast__icon { background: var(--c-heart-soft);   color: var(--c-heart); }
.toast__text { flex: 1; }
.toast__text strong { display: block; font-weight: 700; }
.toast__close { color: var(--c-text-mute); }

/* ==========================================================================
   EMPTY STATE / ESTADOS VACÍOS
   ========================================================================== */
.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--s-3);
  padding: var(--s-12) var(--s-6);
  text-align: center;
  background: var(--g-warm);
  border: 1px dashed var(--c-border-strong);
  border-radius: var(--r-xl);
}
.empty__art {
  width: 96px; height: 96px;
  display: grid; place-items: center;
  border-radius: 30px;
  background: var(--c-surface);
  color: var(--c-primary);
  box-shadow: var(--sh-sm);
  margin-bottom: var(--s-1);
}
.empty__art svg.icon { width: 44px; height: 44px; }
.empty h3 { font-size: var(--fs-lg); }
.empty p { font-size: var(--fs-md); max-width: 42ch; }
.empty__actions { display: flex; flex-wrap: wrap; gap: var(--s-2); justify-content: center; margin-top: var(--s-2); }

/* ==========================================================================
   ESQUELETOS DE CARGA
   ========================================================================== */
.skeleton {
  background: linear-gradient(90deg, var(--c-surface-3) 25%, var(--c-surface-2) 50%, var(--c-surface-3) 75%);
  background-size: 840px 100%;
  animation: shimmer 1.5s linear infinite;
  border-radius: var(--r-md);
}
.skeleton--card { height: 250px; border-radius: var(--r-lg); }
.skeleton--line { height: 14px; }
.skeleton--title { height: 22px; width: 60%; }

/* Aviso "demo" — aclara que los datos son locales */
.demo-note {
  display: flex;
  align-items: flex-start;
  gap: var(--s-3);
  padding: var(--s-3) var(--s-4);
  border-radius: var(--r-md);
  background: var(--c-info-soft);
  color: var(--c-text-soft);
  font-size: var(--fs-sm);
  border: 1px solid transparent;
}
.demo-note svg.icon { color: var(--c-info); width: 18px; height: 18px; flex: none; margin-top: 2px; }

/* ==== css/pages.css ==== */
/* ============================================================================
 * pages.css — Estilos específicos de cada vista
 * ----------------------------------------------------------------------------
 * Inicio · Mascotas (catálogo) · Detalle de mascota · Solicitudes · Cuenta
 * ========================================================================== */

/* ==========================================================================
   INICIO
   ========================================================================== */
.hero {
  position: relative;
  overflow: hidden;
  border-radius: var(--r-2xl);
  background: var(--g-primary);
  color: #fff;
  padding: var(--s-6) var(--s-5) var(--s-8);
  margin-bottom: var(--s-6);
  box-shadow: var(--sh-primary);
}
.hero::before,
.hero::after {
  content: '';
  position: absolute;
  border-radius: 50%;
  background: rgba(255,255,255,.14);
  pointer-events: none;
}
.hero::before { width: 190px; height: 190px; top: -78px; right: -54px; }
.hero::after  { width: 130px; height: 130px; bottom: -66px; left: -34px; background: rgba(255,255,255,.1); }
.hero__paw {
  position: absolute;
  color: rgba(255,255,255,.22);
  pointer-events: none;
  animation: pawFloat 4.5s ease-in-out infinite;
}
.hero__paw svg { width: 26px; height: 26px; }
.hero__paw--a { top: 18px; right: 96px; animation-delay: .2s; }
.hero__paw--b { bottom: 26px; right: 26px; animation-delay: 1.1s; }
.hero__paw--c { top: 62px; right: 30px; animation-delay: 2s; }

.hero__top {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-4);
  margin-bottom: var(--s-5);
}
.hero__greet { display: flex; flex-direction: column; }
.hero__greet small { font-size: var(--fs-sm); opacity: .9; font-weight: 500; }
.hero__greet h1 { color: #fff; font-size: var(--fs-2xl); letter-spacing: -.03em; }
.hero__greet p { color: rgba(255,255,255,.92); font-size: var(--fs-md); margin-top: 2px; }
.hero .avatar { box-shadow: 0 0 0 3px rgba(255,255,255,.4); }

.hero__cta {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  gap: var(--s-3);
  background: rgba(255,255,255,.16);
  border: 1px solid rgba(255,255,255,.26);
  border-radius: var(--r-xl);
  padding: var(--s-4);
  backdrop-filter: blur(6px);
  margin-top: var(--s-4);
}
.hero__cta p { color: rgba(255,255,255,.95); font-size: var(--fs-md); font-weight: 500; }
.hero__cta .btn--ghost {
  background: #fff;
  border-color: transparent;
  color: var(--c-primary-700);
  box-shadow: var(--sh-sm);
}
.hero__cta .btn--ghost:hover { background: #fff; color: var(--c-primary-700); }
.hero__stats {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--s-2);
  margin-top: var(--s-5);
  text-align: center;
}
.hero__stat {
  background: rgba(255,255,255,.15);
  border: 1px solid rgba(255,255,255,.22);
  border-radius: var(--r-md);
  padding: var(--s-3) var(--s-2);
}
.hero__stat strong {
  display: block;
  font-family: var(--f-display);
  font-size: var(--fs-xl);
  font-weight: 800;
  line-height: 1.1;
}
.hero__stat span { font-size: 11px; opacity: .92; }

@media (min-width: 768px) {
  .hero { padding: var(--s-8); border-radius: var(--r-2xl); }
  .hero__greet h1 { font-size: var(--fs-3xl); }
  .hero__cta { flex-direction: row; align-items: center; justify-content: space-between; }
  .hero__cta p { max-width: 52ch; }
  .hero__stats { max-width: 460px; }
}

/* Buscador de portada */
.home-search { position: relative; z-index: 5; margin: calc(var(--s-8) * -1) 0 var(--s-5); }
@media (min-width: 768px) { .home-search { margin-top: calc(var(--s-10) * -1); max-width: 620px; margin-left: auto; margin-right: auto; } }
.home-search .search { box-shadow: var(--sh-lg); border-color: transparent; padding: var(--s-4) var(--s-5); }
.home-search .search input { font-size: var(--fs-base); }

/* Barra de progreso de meta de adopciones (bloque cálido) */
.impact {
  display: grid;
  gap: var(--s-4);
  padding: var(--s-5);
  border-radius: var(--r-xl);
  background: var(--g-warm);
  border: 1px solid var(--c-border);
  margin-bottom: var(--s-8);
}
.impact__row { display: flex; align-items: center; justify-content: space-between; gap: var(--s-4); }
.impact__icon {
  width: 46px; height: 46px; flex: none;
  display: grid; place-items: center;
  border-radius: 14px;
  background: var(--c-primary-50);
  color: var(--c-primary);
}
.impact__bar { height: 9px; border-radius: var(--r-pill); background: var(--c-surface-3); overflow: hidden; }
.impact__bar span { display: block; height: 100%; border-radius: var(--r-pill); background: var(--g-primary); transition: width var(--t-slow); }
.impact__legend { display: flex; justify-content: space-between; font-size: var(--fs-xs); color: var(--c-text-mute); }

/* Carrusel horizontal de destacados */
.carousel {
  display: flex;
  gap: var(--s-4);
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  padding: var(--s-1) var(--s-1) var(--s-4);
  margin: 0 calc(var(--s-4) * -1);
  padding-left: var(--s-4);
  padding-right: var(--s-4);
  scrollbar-width: none;
}
.carousel::-webkit-scrollbar { display: none; }
.carousel > * { scroll-snap-align: start; flex: 0 0 82%; }
@media (min-width: 560px) { .carousel > * { flex-basis: 46%; } }
@media (min-width: 900px) { .carousel > * { flex-basis: 31%; } }
@media (min-width: 1100px) { .carousel > * { flex-basis: 23.5%; } }

/* Tarjeta destacada (más información que la tarjeta normal) */
.feature {
  position: relative;
  display: block;
  border-radius: var(--r-xl);
  overflow: hidden;
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  box-shadow: var(--sh-md);
  transition: transform var(--t-base), box-shadow var(--t-base);
}
.feature:hover { transform: translateY(-5px); box-shadow: var(--sh-lg); }
.feature__media { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: var(--c-surface-3); }
.feature__media img { width: 100%; height: 100%; object-fit: cover; transition: transform var(--t-slow); }
.feature:hover .feature__media img { transform: scale(1.06); }
.feature__body { padding: var(--s-4); }
.feature__name { font-family: var(--f-display); font-size: var(--fs-xl); font-weight: 700; }
.feature__breed { font-size: var(--fs-sm); color: var(--c-text-mute); }
.feature__desc { font-size: var(--fs-sm); color: var(--c-text-soft); margin-top: var(--s-2); }
.feature__foot { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); margin-top: var(--s-3); }
.feature__fav { position: absolute; top: var(--s-3); right: var(--s-3); z-index: 3; }

/* Cómo funciona */
.how { display: grid; gap: var(--s-4); }
@media (min-width: 768px) { .how { grid-template-columns: repeat(3, 1fr); } }
.how__step {
  position: relative;
  padding: var(--s-5);
  border-radius: var(--r-xl);
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  box-shadow: var(--sh-xs);
  transition: transform var(--t-base), box-shadow var(--t-base);
}
.how__step:hover { transform: translateY(-4px); box-shadow: var(--sh-md); }
.how__num {
  position: absolute;
  top: var(--s-4); right: var(--s-4);
  font-family: var(--f-display);
  font-size: var(--fs-3xl);
  font-weight: 800;
  color: var(--c-primary-100);
  line-height: 1;
}
.how__icon {
  width: 48px; height: 48px;
  display: grid; place-items: center;
  border-radius: 16px;
  background: var(--c-primary-50);
  color: var(--c-primary);
  margin-bottom: var(--s-3);
}
.how__step h3 { font-size: var(--fs-base); margin-bottom: 4px; }
.how__step p { font-size: var(--fs-sm); }

/* Bloque de descarga de la app */
.app-banner {
  display: flex;
  align-items: center;
  gap: var(--s-4);
  padding: var(--s-4) var(--s-5);
  border-radius: var(--r-xl);
  background: var(--g-cream);
  border: 1px solid var(--c-border);
  margin-bottom: var(--s-6);
}
.app-banner__icon {
  width: 46px; height: 46px; flex: none;
  display: grid; place-items: center;
  border-radius: 14px;
  background: var(--c-surface);
  color: var(--c-primary);
  box-shadow: var(--sh-xs);
}
.app-banner strong { display: block; font-family: var(--f-display); font-size: var(--fs-md); }
.app-banner p { font-size: var(--fs-xs); }

/* ==========================================================================
   CATÁLOGO DE MASCOTAS
   ========================================================================== */
.catalog__head { margin-bottom: var(--s-5); }
.catalog__title { display: flex; align-items: baseline; gap: var(--s-3); flex-wrap: wrap; }
.catalog__count { font-size: var(--fs-sm); color: var(--c-text-mute); font-weight: 500; }
.catalog__tools {
  display: flex;
  flex-direction: column;
  gap: var(--s-3);
  margin-bottom: var(--s-4);
}
.catalog__sort { display: flex; align-items: center; gap: var(--s-2); }
.catalog__sort .select-wrap { min-width: 190px; }
.catalog__active {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s-2);
  margin-bottom: var(--s-4);
}
.filter-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px var(--s-3);
  border-radius: var(--r-pill);
  background: var(--c-primary-50);
  color: var(--c-primary-700);
  font-size: var(--fs-xs);
  font-weight: 600;
}
.filter-tag button { display: grid; place-items: center; color: inherit; opacity: .7; }
.filter-tag button:hover { opacity: 1; }
.filter-tag svg.icon { width: 14px; height: 14px; }

.filters-panel {
  display: grid;
  gap: var(--s-4);
  padding: var(--s-4);
  border-radius: var(--r-lg);
  background: var(--c-surface);
  border: 1px solid var(--c-border);
}
@media (min-width: 768px) { .filters-panel { grid-template-columns: repeat(3, 1fr); } }
.filters-panel .field { margin-bottom: 0; }

/* ==========================================================================
   DETALLE DE LA MASCOTA
   ========================================================================== */
.detail { display: grid; gap: var(--s-6); }
@media (min-width: 980px) {
  .detail { grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); align-items: start; gap: var(--s-8); }
}

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: var(--s-2) var(--s-3) var(--s-2) var(--s-2);
  border-radius: var(--r-pill);
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--c-text-soft);
  margin-bottom: var(--s-4);
  transition: background var(--t-base), color var(--t-base), gap var(--t-base);
}
.back-link:hover { background: var(--c-primary-50); color: var(--c-primary-700); gap: 10px; }

.gallery { position: relative; }
.gallery__main {
  position: relative;
  aspect-ratio: 4 / 3;
  border-radius: var(--r-2xl);
  overflow: hidden;
  background: var(--c-surface-3);
  box-shadow: var(--sh-md);
}
.gallery__main img { width: 100%; height: 100%; object-fit: cover; }
.gallery__actions { position: absolute; top: var(--s-4); right: var(--s-4); display: flex; gap: var(--s-2); z-index: 3; }
.gallery__thumbs { display: flex; gap: var(--s-2); margin-top: var(--s-3); overflow-x: auto; scrollbar-width: none; }
.gallery__thumbs::-webkit-scrollbar { display: none; }
.gallery__thumb {
  flex: none;
  width: 74px; height: 74px;
  border-radius: var(--r-md);
  overflow: hidden;
  border: 2.5px solid transparent;
  opacity: .65;
  transition: all var(--t-base);
  background: var(--c-surface-3);
}
.gallery__thumb img { width: 100%; height: 100%; object-fit: cover; }
.gallery__thumb:hover { opacity: 1; }
.gallery__thumb.is-active { border-color: var(--c-primary); opacity: 1; }

.detail__panel {
  display: flex;
  flex-direction: column;
  gap: var(--s-5);
}
.detail__header h1 { font-size: var(--fs-3xl); letter-spacing: -.03em; }
.detail__sub { display: flex; align-items: center; gap: var(--s-2); font-size: var(--fs-md); color: var(--c-text-soft); margin-top: 4px; flex-wrap: wrap; }
.detail__badges { display: flex; flex-wrap: wrap; gap: var(--s-2); margin-top: var(--s-3); }

.facts {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--s-3);
}
@media (min-width: 560px) { .facts { grid-template-columns: repeat(4, 1fr); } }
.fact {
  padding: var(--s-3);
  border-radius: var(--r-md);
  background: var(--c-surface-2);
  border: 1px solid var(--c-border);
  text-align: center;
}
.fact svg.icon { color: var(--c-primary); margin: 0 auto 4px; width: 20px; height: 20px; }
.fact strong { display: block; font-family: var(--f-display); font-size: var(--fs-md); font-weight: 700; }
.fact span { font-size: 11px; color: var(--c-text-mute); text-transform: uppercase; letter-spacing: .04em; }

.block { padding: var(--s-5); border-radius: var(--r-xl); background: var(--c-surface); border: 1px solid var(--c-border); box-shadow: var(--sh-xs); }
.block__title { display: flex; align-items: center; gap: var(--s-2); font-family: var(--f-display); font-size: var(--fs-lg); font-weight: 700; margin-bottom: var(--s-3); }
.block__title svg.icon { color: var(--c-primary); width: 20px; height: 20px; }
.block p + p { margin-top: var(--s-3); }

.health { display: grid; gap: var(--s-2); }
@media (min-width: 560px) { .health { grid-template-columns: repeat(2, 1fr); } }
.health__item {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  padding: var(--s-3);
  border-radius: var(--r-md);
  background: var(--c-surface-2);
  font-size: var(--fs-sm);
  font-weight: 600;
}
.health__check {
  width: 26px; height: 26px; flex: none;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--c-success-soft);
  color: var(--c-success);
}
.health__check--no { background: var(--c-surface-3); color: var(--c-text-mute); }
.health__check svg.icon { width: 15px; height: 15px; }
.health small { display: block; font-weight: 500; color: var(--c-text-mute); font-size: var(--fs-xs); }

.traits { display: flex; flex-wrap: wrap; gap: var(--s-2); }
.trait {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: var(--s-2) var(--s-3);
  border-radius: var(--r-pill);
  background: var(--c-surface-2);
  border: 1px solid var(--c-border);
  font-size: var(--fs-sm);
  font-weight: 600;
}
.trait svg.icon { width: 15px; height: 15px; color: var(--c-primary); }

.shelter { display: flex; gap: var(--s-4); align-items: flex-start; }
.shelter__logo {
  width: 52px; height: 52px; flex: none;
  display: grid; place-items: center;
  border-radius: 16px;
  background: var(--g-primary);
  color: #fff;
  font-family: var(--f-display);
  font-weight: 800;
  font-size: var(--fs-lg);
}
.shelter__meta { font-size: var(--fs-sm); color: var(--c-text-mute); display: grid; gap: 4px; margin-top: 6px; }
.shelter__meta span { display: flex; align-items: center; gap: 6px; }
.shelter__meta svg.icon { width: 15px; height: 15px; color: var(--c-primary); }

/* Barra de acción fija en móvil (CTA siempre accesible) */
.action-bar {
  position: fixed;
  left: 0; right: 0;
  bottom: calc(var(--h-tabbar) + env(safe-area-inset-bottom, 0px));
  z-index: 65;
  display: flex;
  gap: var(--s-3);
  padding: var(--s-3) var(--s-4);
  background: var(--g-glass);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--c-border);
  animation: fadeUp .35s ease both;
}
.action-bar .btn { flex: 1; }
@media (min-width: 900px) {
  .action-bar { position: static; background: none; border: none; padding: 0; backdrop-filter: none; }
}

/* Aviso de estado de la solicitud para esta mascota */
.applied-note {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  padding: var(--s-3) var(--s-4);
  border-radius: var(--r-md);
  background: var(--c-success-soft);
  color: #1E7A6F;
  font-size: var(--fs-sm);
  font-weight: 600;
}
.applied-note svg.icon { flex: none; }

/* ==========================================================================
   SOLICITUDES
   ========================================================================== */
.req-list { display: grid; gap: var(--s-4); }
.req-card {
  display: grid;
  gap: var(--s-4);
  padding: var(--s-4);
  border-radius: var(--r-xl);
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  box-shadow: var(--sh-sm);

  color: var(--c-text-mute);

  border-radius: 50%;

  color: var(--c-text-mute);
}
.timeline__dot svg.icon { width: 12px; height: 12px; }
.timeline__step.is-done { color: var(--c-success); }

.timeline__step.is-current { color: var(--c-warning); }
.timeline__step.is-current .timeline__dot { background: var(--c-warning-soft); color: var(--c-warning); }
.timeline__step.is-rejected { color: var(--c-danger); }
.timeline__step.is-rejected .timeline__dot { background: var(--c-danger-soft); color: var(--c-danger); }

  gap: var(--s-3);

/* ==== js/utils/format.js ==== */
/* ============================================================================
 * format.js — Formateo de textos, fechas, edades y pesos (es-ES)
 * ========================================================================== */
(function () {
  'use strict';

  var MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

  /* Quita acentos y pasa a minúsculas: hace la búsqueda tolerante a tildes
   * ("milo" encuentra "Milo", "caniche" encuentra "Caniché"). */
  function normalize(text) {
    return String(text == null ? '' : text)
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .trim();
  }

  /* Primera letra en mayúscula (para nombres de especie, etc.) */
  function capitalize(text) {
    var s = String(text || '');
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  /* Pluraliza etiquetas sencillas: 1 mascota / 3 mascotas */
  function plural(count, singular, pluralForm) {
    var n = Number(count) || 0;
    return n + ' ' + (n === 1 ? singular : (pluralForm || singular + 's'));
  }

  /* --- Fechas ------------------------------------------------------------ */
  function toDate(value) {
    if (value instanceof Date) { return value; }
    var d = new Date(value);
    return isNaN(d.getTime()) ? null : d;
  }

  /* 12 mar 2025 */
  function shortDate(value) {
    var d = toDate(value);
    if (!d) { return '—'; }
    return d.getDate() + ' ' + MESES[d.getMonth()] + ' ' + d.getFullYear();
  }

  /* 12 de marzo de 2025 */
  function longDate(value) {
    var d = toDate(value);
    if (!d) { return '—'; }
    var meses = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio',
      'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
    return d.getDate() + ' de ' + meses[d.getMonth()] + ' de ' + d.getFullYear();
  }

  /* "Hace 3 días", "Hoy", "Hace 2 meses" */
  function relative(value) {
    var d = toDate(value);
    if (!d) { return '—'; }
    var diff = Date.now() - d.getTime();
    var mins = Math.round(diff / 60000);
    if (mins < 1) { return 'Hace un momento'; }
    if (mins < 60) { return 'Hace ' + plural(mins, 'minuto'); }
    var hours = Math.round(mins / 60);
    if (hours < 24) { return 'Hace ' + plural(hours, 'hora'); }
    var days = Math.round(hours / 24);
    if (days === 1) { return 'Ayer'; }
    if (days < 30) { return 'Hace ' + plural(days, 'día'); }
    var months = Math.round(days / 30);
    if (months < 12) { return 'Hace ' + plural(months, 'mes', 'meses'); }
    var years = Math.round(months / 12);
    return 'Hace ' + plural(years, 'año');
  }

  /* --- Edad -------------------------------------------------------------- */
  /* Convierte meses a una etiqueta legible: "3 meses", "1 año", "2 años y 6 meses".
   * Hasta los 11 meses se expresa en meses; a partir de ahí, en años. */
  function ageLabel(months) {
    var m = Math.max(0, Math.round(Number(months) || 0));
    if (m < 1) { return 'Recién nacido'; }
    if (m < 12) { return plural(m, 'mes', 'meses'); }
    var years = Math.floor(m / 12);
    var rest = m % 12;
    var base = plural(years, 'año');
    if (rest === 0) { return base; }
    return base + ' y ' + plural(rest, 'mes', 'meses');
  }

  /* --- Peso -------------------------------------------------------------- */
  function weightLabel(kg) {
    var n = Number(kg);
    if (!n || isNaN(n)) { return '—'; }
    var txt = n % 1 === 0 ? String(n) : n.toFixed(1).replace('.', ',');
    return txt + ' kg';
  }

  /* --- Sexo y especie ---------------------------------------------------- */
  var SEX_LABEL = { macho: 'Macho', hembra: 'Hembra' };
  var SPECIES_LABEL = { perro: 'Perro', gato: 'Gato', conejo: 'Conejo', otro: 'Otro' };
  var SPECIES_ICON = { perro: 'dog', gato: 'cat', conejo: 'rabbit', otro: 'other' };
  var SPECIES_PLURAL = { perro: 'Perros', gato: 'Gatos', conejo: 'Conejos', otro: 'Otros' };

  function sexLabel(sex) { return SEX_LABEL[normalize(sex)] || capitalize(sex || '—'); }
  function speciesLabel(species) { return SPECIES_LABEL[normalize(species)] || capitalize(species || '—'); }
  function speciesPlural(species) { return SPECIES_PLURAL[normalize(species)] || capitalize(species || '') + 's'; }
  function speciesIcon(species) { return SPECIES_ICON[normalize(species)] || 'other'; }

  /* Tamaño según peso, útil como filtro y como etiqueta informativa */
  function sizeLabel(size) {
    var map = { pequeno: 'Pequeño', mediano: 'Mediano', grande: 'Grande' };
    return map[normalize(size)] || 'Mediano';
  }

  var STATUS_LABEL = {
    pendiente: 'Pendiente',
    revision: 'En revisión',
    aprobada: 'Aprobada',
    rechazada: 'Rechazada',
    cancelada: 'Cancelada'
  };
  var STATUS_BADGE = {
    pendiente: 'badge--warning',
    revision: 'badge--info',
    aprobada: 'badge--success',
    rechazada: 'badge--danger',
    cancelada: ''
  };
  var STATUS_ICON = {
    pendiente: 'clock',
    revision: 'info',
    aprobada: 'checkCircle',
    rechazada: 'close',
    cancelada: 'close'
  };
  function statusLabel(status) { return STATUS_LABEL[normalize(status)] || capitalize(status || ''); }
  function statusBadge(status) { return STATUS_BADGE[normalize(status)] || ''; }
  function statusIcon(status) { return STATUS_ICON[normalize(status)] || 'info'; }

  /* --- Iniciales para avatares ------------------------------------------ */
  function initials(name) {
    var parts = String(name || '').trim().split(/\s+/).filter(Boolean);
    if (!parts.length) { return '?'; }
    if (parts.length === 1) { return parts[0].slice(0, 2).toUpperCase(); }
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }

  /* --- Correo y teléfono ------------------------------------------------- */
  function isEmail(value) {
    return /^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(String(value || '').trim());
  }
  function isPhone(value) {
    var digits = String(value || '').replace(/[^\d]/g, '');
    return digits.length >= 9 && digits.length <= 15;
  }

  /* Resalta el término buscado dentro de un texto (devuelve HTML seguro) */
  function highlight(text, term) {
    var safe = window.Dom.escape(text);
    var q = normalize(term);
    if (!q) { return safe; }
    var idx = normalize(text).indexOf(q);
    if (idx < 0) { return safe; }
    return safe.slice(0, idx) + '<mark>' + safe.slice(idx, idx + q.length) + '</mark>' + safe.slice(idx + q.length);
  }

  window.Format = {
    normalize: normalize,
    capitalize: capitalize,
    plural: plural,
    shortDate: shortDate,
    longDate: longDate,
    relative: relative,
    ageLabel: ageLabel,
    weightLabel: weightLabel,
    sexLabel: sexLabel,
    speciesLabel: speciesLabel,
    speciesPlural: speciesPlural,
    speciesIcon: speciesIcon,
    sizeLabel: sizeLabel,
    statusLabel: statusLabel,
    statusBadge: statusBadge,
    statusIcon: statusIcon,
    initials: initials,
    isEmail: isEmail,
    isPhone: isPhone,
    highlight: highlight
  };
})();

/* ==== js/utils/dom.js ==== */
/* ============================================================================
 * dom.js — Ayudas mínimas de DOM (sin dependencias)
 * ----------------------------------------------------------------------------
 * Decisión de seguridad: `Dom.h()` escapa TODO valor interpolado. Cuando hace
 * falta insertar marcado propio (por ejemplo un SVG de icono) se marca
 * explícitamente con `Dom.raw()`. Así evitamos inyecciones por datos remotos.
 * ========================================================================== */

      .replace(/&/g, '&amp;')

    if (Array.isArray(value)) { return value.map(valueToHtml).join(''); }
    return escape(value);

   *   h`<div class="x">${texto}</div>`

  }

    h: h,
    raw: raw,
    isRaw: isRaw,
    escape: escape,
    el: el,
    frag: frag,
    qs: qs,

/* ==== js/utils/storage.js ==== */
/* ============================================================================
 * storage.js — Persistencia local con espacio de nombres y recuperación
 * ----------------------------------------------------------------------------
 * Todo el estado de la demo vive en localStorage bajo la clave
 * `adopta:v1`. Si el navegador bloquea el almacenamiento (modo privado,
 * file:// restringido…), la app sigue funcionando en memoria.
 * ========================================================================== */
(function () {
  'use strict';

  var NAMESPACE = 'adopta:v1';
  var memory = {};          /* Respaldo cuando localStorage no está disponible */
  var available = null;     /* Se resuelve en la primera llamada */

  function canUseLocalStorage() {
    if (available !== null) { return available; }
    try {
      var probe = '__adopta_probe__';
      window.localStorage.setItem(probe, '1');
      window.localStorage.removeItem(probe);
      available = true;
    } catch (error) {
      available = false;
    }
    return available;
  }

  function key(name) { return NAMESPACE + ':' + name; }

  function get(name, fallback) {
    var raw;
    if (canUseLocalStorage()) {
      try { raw = window.localStorage.getItem(key(name)); }
      catch (error) { raw = null; }
    } else {
      raw = Object.prototype.hasOwnProperty.call(memory, name) ? memory[name] : null;
    }
    if (raw === null || raw === undefined) { return fallback; }
    try {
      return JSON.parse(raw);
    } catch (error) {
      /* Dato corrupto: se descarta en lugar de romper la app */
      remove(name);
      return fallback;
    }
  }

  function set(name, value) {
    var serialized = JSON.stringify(value);
    if (canUseLocalStorage()) {
      try {
        window.localStorage.setItem(key(name), serialized);
        return true;
      } catch (error) {
        /* Cuota superada: se degrada a memoria */
        memory[name] = serialized;
        return false;
      }
    }
    memory[name] = serialized;
    return false;
  }

  function remove(name) {
    if (canUseLocalStorage()) {
      try { window.localStorage.removeItem(key(name)); } catch (error) { /* noop */ }
    }
    delete memory[name];
  }

  /* Borra únicamente las claves de Adopta (no toca otros datos del sitio) */
  function clearAll() {
    if (canUseLocalStorage()) {
      try {
        var toRemove = [];
        for (var i = 0; i < window.localStorage.length; i++) {
          var k = window.localStorage.key(i);
          if (k && k.indexOf(NAMESPACE) === 0) { toRemove.push(k); }
        }
        toRemove.forEach(function (k) { window.localStorage.removeItem(k); });
      } catch (error) { /* noop */ }
    }
    memory = {};
  }

  /* Exportar / importar el estado completo (útil para migrar a backend) */
  function exportAll() {
    var dump = {};
    if (canUseLocalStorage()) {
      try {
        for (var i = 0; i < window.localStorage.length; i++) {
          var k = window.localStorage.key(i);
          if (k && k.indexOf(NAMESPACE + ':') === 0) {
            dump[k.slice(NAMESPACE.length + 1)] = JSON.parse(window.localStorage.getItem(k));
          }
        }
      } catch (error) { /* noop */ }
    } else {
      Object.keys(memory).forEach(function (name) { dump[name] = JSON.parse(memory[name]); });
    }
    return dump;
  }

  window.Storage = {
    get: get,
    set: set,
    remove: remove,
    clearAll: clearAll,
    exportAll: exportAll,
    isPersistent: canUseLocalStorage,
    namespace: NAMESPACE
  };
})();

/* ==== js/utils/a11y.js ==== */
/* ============================================================================
 * a11y.js — Accesibilidad: foco, trampas de foco, scroll bloqueado, títulos
 * ========================================================================== */

   * hojas inferiores). Devuelve una función para liberarla.
   * ------------------------------------------------------------------------ */

        event.preventDefault();
        last.focus();

        event.preventDefault();
        first.focus();

      ? (typeof opts.initialFocus === 'string' ? window.Dom.qs(opts.initialFocus, container) : opts.initialFocus)

    }, 60);

      document.removeEventListener('keydown', onKeydown, true);

  }

    if (!node) { return; }

  }

/* ==== js/utils/media.js ==== */
/* ============================================================================
 * media.js — Imágenes: carga diferida, esqueleto y respaldo sin conexión

    'linear-gradient(135deg,#FFC08A,#FF8C42)',
    'linear-gradient(135deg,#E9A23B,#D98324)',

    var cls = opts.className || 'pet-card__img';
    var eager = !!opts.eager;

    if (!id) {
      return window.Dom.raw(
        '<div class="img-fallback" style="background:' + gradientFor(name) + '">' +
        '<span class="img-fallback__initial">' + window.Dom.escape(window.Format.initials(name)) + '</span>' +
        '</div>'
      );
    }

    var loading = eager ? 'eager' : 'lazy';
    var priority = eager ? ' fetchpriority="high"' : '';

    return window.Dom.raw(
      '<span class="img-skeleton" aria-hidden="true"></span>' +
      '<img class="' + cls + '" src="' + photoUrl(id, width) + '"' +
      ' srcset="' + srcset(id, width) + '"' +
      ' sizes="' + (opts.sizes || '(max-width: 640px) 45vw, 300px') + '"' +
      ' alt="' + window.Dom.escape(alt) + '"' +
      ' loading="' + loading + '" decoding="async"' + priority + '>' +
      '<span class="img-fallback" hidden aria-hidden="true"' +
      ' style="background:' + gradientFor(name) + '">' +
      '<span class="img-fallback__initial">' + window.Dom.escape(window.Format.initials(name)) + '</span>' +
      '</span>'
    );
  }

  /* --------------------------------------------------------------------------
   * Conecta los eventos de carga/error de todas las imágenes pendientes.
   * Se llama después de cada render de vista.
   * ------------------------------------------------------------------------ */
  function hydrateImages(root) {
    var scope = root || document;
    var images = window.Dom.qsa('img[src]', scope);

    images.forEach(function (img) {
      if (img.getAttribute('data-media-ready') === '1') { return; }
      img.setAttribute('data-media-ready', '1');

      var fallback = img.parentElement ? window.Dom.qs('.img-fallback', img.parentElement) : null;
      var skeleton = img.parentElement ? window.Dom.qs('.img-skeleton', img.parentElement) : null;

      function showImage() {
        img.classList.add('is-loaded');
        img.style.opacity = '';
        if (skeleton) { skeleton.remove(); }
      }

      function showFallback() {
        if (skeleton) { skeleton.remove(); }
        img.style.display = 'none';
        if (fallback) { fallback.hidden = false; }
      }

      if (img.complete && img.naturalWidth > 0) {
        showImage();
      } else if (img.complete && img.naturalWidth === 0) {
        showFallback();
      } else {
        img.addEventListener('load', showImage, { once: true });
        img.addEventListener('error', showFallback, { once: true });
        /* Red lenta: si en 9 s no cargó, mostramos el respaldo cálido */
        window.setTimeout(function () {
          if (!img.classList.contains('is-loaded') && !img.complete) {
            /* Se deja el esqueleto: puede seguir cargando en segundo plano */
          }
        }, 9000);
      }
    });
  }

  /* Precarga las primeras N imágenes para que el listado se sienta instantáneo */
  function preload(ids, width) {
    (ids || []).slice(0, 6).forEach(function (id) {
      var img = new Image();
      img.decoding = 'async';
      img.src = photoUrl(id, width || 600);
    });
  }

  window.Media = {
    photoUrl: photoUrl,
    srcset: srcset,
    portrait: portrait,
    hydrateImages: hydrateImages,
    preload: preload,
    gradientFor: gradientFor
  };
})();

 * Cuando exista un backend real, este archivo desaparece: el perfil llega del

(function () {

  var DEFAULT_USER = {

  var SEED_REQUESTS = [

  /* Convierte `daysAgo` en una fecha ISO real respecto a hoy */
  function resolveSeedRequests(now) {
