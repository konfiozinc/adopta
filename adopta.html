/* ==== js/data/repository.js ==== */
/* ============================================================================
 * repository.js — Capa de acceso a datos
 * ----------------------------------------------------------------------------
 * Toda lectura/escritura de datos de dominio pasa por aquí. La interfaz nunca
 * conoce la fuente: hoy es un catálogo local en memoria, mañana puede ser
 * `fetch('/api/pets')`, Supabase o Firebase. Basta con reescribir los métodos
 * de `Repository` manteniendo las firmas (todas devuelven Promesas para que el
 * cambio a red no obligue a tocar las vistas).
 * ========================================================================== */
(function () {
  'use strict';

  var PETS = (window.PetsData && window.PetsData.pets) || [];
  var SHELTERS = (window.PetsData && window.PetsData.shelters) || [];

  /* --- Índices para búsquedas O(1) -------------------------------------- */
  var byId = {};
  var shelterById = {};
  PETS.forEach(function (pet) { byId[pet.id] = pet; });
  SHELTERS.forEach(function (shelter) { shelterById[shelter.id] = shelter; });

  /* --- Normalización ----------------------------------------------------- */
  function normalizePet(pet) {
    var health = pet.health || {};
    var photos = (pet.photos || []).slice();
    if (!photos.length) { photos = ['1552053831-71594a27632d']; }

    return {
      id: pet.id,
      name: pet.name,
      species: pet.species,
      breed: pet.breed,
      ageMonths: Number(pet.ageMonths) || 0,
      weightKg: Number(pet.weightKg) || 0,
      sex: pet.sex,
      size: pet.size,
      tags: pet.tags || [],
      photos: photos,
      cover: photos[0],
      description: pet.description || '',
      personality: pet.personality || [],
      health: {
        vaccinated: !!health.vaccinated,
        sterilized: !!health.sterilized,
        dewormed: !!health.dewormed,
        microchipped: !!health.microchipped,
        notes: health.notes || ''
      },
      shelterId: pet.shelterId,
      shelter: shelterById[pet.shelterId] || null,
      location: pet.location || (shelterById[pet.shelterId] ? shelterById[pet.shelterId].city : ''),
      featured: !!pet.featured,
      publishedAt: pet.publishedAt || null,
      /* Campos derivados que usan las vistas */
      ageLabel: window.Format.ageLabel(pet.ageMonths),
      weightLabel: window.Format.weightLabel(pet.weightKg),
      sexLabel: window.Format.sexLabel(pet.sex),
      speciesLabel: window.Format.speciesLabel(pet.species),
      speciesIcon: window.Format.speciesIcon(pet.species),
      sizeLabel: window.Format.sizeLabel(pet.size),
      /* Puntuación de salud: alimenta el indicador "salud verificada" */
      healthScore: ['vaccinated', 'sterilized', 'dewormed', 'microchipped']
        .filter(function (k) { return !!health[k]; }).length
    };
  }

  var NORMALIZED = PETS.map(normalizePet);
  NORMALIZED.forEach(function (pet) { byId[pet.id] = pet; });

  /* Texto indexado para búsqueda (nombre + raza + refugio + etiquetas) */
  function searchIndex(pet) {
    return window.Format.normalize([
      pet.name, pet.breed, pet.speciesLabel, pet.location,
      pet.shelter ? pet.shelter.name : '', (pet.tags || []).join(' ')
    ].join(' '));
  }

  var INDEX = {};
  NORMALIZED.forEach(function (pet) { INDEX[pet.id] = searchIndex(pet); });

  /* --- Consultas --------------------------------------------------------- */

  /* Lista de mascotas con filtros combinables.
   * filtros: { species, search, size, sex, age, shelterId, onlyFeatured } */
  function listPets(filters) {
    var f = filters || {};
    var species = window.Format.normalize(f.species || 'todos');
    var search = window.Format.normalize(f.search || '');
    var size = window.Format.normalize(f.size || '');
    var sex = window.Format.normalize(f.sex || '');
    var age = window.Format.normalize(f.age || '');
    var shelter = f.shelterId || '';

    var results = NORMALIZED.filter(function (pet) {
      if (species && species !== 'todos' && species !== 'all' && pet.species !== species) { return false; }
      if (size && pet.size !== size) { return false; }
      if (sex && pet.sex !== sex) { return false; }
      if (shelter && pet.shelterId !== shelter) { return false; }
      if (f.onlyFeatured && !pet.featured) { return false; }

      if (age) {
        var m = pet.ageMonths;
        if (age === 'cachorro' && m >= 12) { return false; }
        if (age === 'joven' && (m < 12 || m > 36)) { return false; }
        if (age === 'adulto' && (m < 36 || m > 84)) { return false; }
        if (age === 'senior' && m < 84) { return false; }
      }

      if (search && INDEX[pet.id].indexOf(search) === -1) { return false; }
      return true;
    });

    return sortPets(results, f.sort);
  }

  function sortPets(list, sort) {
    var mode = sort || 'recientes';
    var copy = list.slice();
    copy.sort(function (a, b) {
      switch (mode) {
        case 'nombre':
          return a.name.localeCompare(b.name, 'es');
        case 'edad_asc':
          return a.ageMonths - b.ageMonths;
        case 'edad_desc':
          return b.ageMonths - a.ageMonths;
        case 'destacados':
          if (a.featured !== b.featured) { return a.featured ? -1 : 1; }
          return String(b.publishedAt).localeCompare(String(a.publishedAt));
        case 'recientes':
        default:
          return String(b.publishedAt).localeCompare(String(a.publishedAt));
      }
    });
    return copy;
  }

  function getPet(id) { return byId[id] || null; }

  function featuredPets(limit) {
    var list = NORMALIZED.filter(function (pet) { return pet.featured; });
    if (list.length < (limit || 6)) {
      /* Completamos con las más recientes para que el carrusel nunca quede pobre */
      var extra = sortPets(NORMALIZED.filter(function (pet) { return !pet.featured; }), 'recientes');
      list = list.concat(extra);
    }
    return list.slice(0, limit || 6);
  }

  /* Recomendaciones: misma especie, distinta mascota, ordenadas por
     parecido de edad y tamaño. */
  function similarPets(pet, limit) {
    if (!pet) { return []; }
    return NORMALIZED
      .filter(function (candidate) { return candidate.id !== pet.id && candidate.species === pet.species; })
      .map(function (candidate) {
        var score = 0;
        if (candidate.size === pet.size) { score += 3; }
        score -= Math.abs(candidate.ageMonths - pet.ageMonths) / 12;
        return { pet: candidate, score: score };
      })
      .sort(function (a, b) { return b.score - a.score; })
      .slice(0, limit || 4)
      .map(function (entry) { return entry.pet; });
  }

  /* Conteos por especie para los chips de filtro */
  function speciesCounts() {
    var counts = { todos: NORMALIZED.length, perro: 0, gato: 0, conejo: 0, otro: 0 };
    NORMALIZED.forEach(function (pet) {
      counts[pet.species] = (counts[pet.species] || 0) + 1;
    });
    return counts;
  }

  /* Sugerencias de autocompletado para el buscador */
  function suggest(term, limit) {
    var q = window.Format.normalize(term);
    if (!q) { return []; }
    var seen = {};
    var results = [];

    NORMALIZED.forEach(function (pet) {
      var candidates = [pet.name, pet.breed, pet.shelter ? pet.shelter.name : ''];
      candidates.forEach(function (text) {
        var norm = window.Format.normalize(text);
        if (norm.indexOf(q) !== 0 && norm.indexOf(' ' + q) === -1) { return; }
        var key = norm;
        if (seen[key]) { return; }
        seen[key] = true;
        results.push({ text: text, pet: pet });
      });
    });

    return results.slice(0, limit || 6);
  }

  function listShelters() { return SHELTERS.slice(); }
  function getShelter(id) { return shelterById[id] || null; }

  /* --- Escrituras --------------------------------------------------------
   * En esta demo el catálogo es de solo lectura; las escrituras del usuario
   * (perfil, favoritos, solicitudes) viven en `state.js`. Estos métodos dejan
   * preparada la superficie para un backend real. */

  function createRequest(payload) {
    /* En el futuro: POST /api/requests */
    return Promise.resolve(payload);
  }

  /* Simula latencia de red, útil para probar los esqueletos de carga.
   * Se puede activar con `window.ADOPTA_FAKE_LATENCY = 600`. */
  function withLatency(value) {
    var delay = Number(window.ADOPTA_FAKE_LATENCY) || 0;
    if (!delay) { return Promise.resolve(value); }
    return new Promise(function (resolve) {
      window.setTimeout(function () { resolve(value); }, delay);
    });
  }

  window.Repository = {
    /* Catálogo */
    allPets: function () { return withLatency(NORMALIZED.slice()); },
    listPets: function (filters) { return withLatency(listPets(filters)); },
    getPet: function (id) { return withLatency(getPet(id)); },
    featuredPets: function (limit) { return withLatency(featuredPets(limit)); },
    similarPets: function (pet, limit) { return withLatency(similarPets(pet, limit)); },
    speciesCounts: speciesCounts,
    suggest: suggest,
    /* Refugios */
    listShelters: listShelters,
    getShelter: getShelter,
    /* Escrituras */
    createRequest: createRequest,
    /* Utilidades internas reutilizables (síncronas) */
    _sync: {
      listPets: listPets,
      getPet: getPet,
      featuredPets: featuredPets,
      similarPets: similarPets
    }
  };
})();

/* ==== js/state.js ==== */
/* ============================================================================
 * state.js — Estado global de la aplicación (reactivo y persistente)
 * ----------------------------------------------------------------------------
 * Patrón store + suscriptores. Cualquier cambio se guarda en localStorage y
 * notifica a quien esté escuchando (barra de navegación, vistas abiertas).
 *
 * Estructura del estado:
 *   user        → perfil del adoptante
 *   preferences → ajustes de notificaciones y privacidad
 *   favorites   → ids de mascotas guardadas
 *   requests    → solicitudes de adopción enviadas
 *   theme       → 'light' | 'dark'
 *   filters     → filtros activos del catálogo
 *   recentSearches, searchesCount, tips
 * ========================================================================== */
(function () {
  'use strict';

  var KEY = 'state';
  var STORAGE_AVAILABLE = window.Storage.isPersistent();

  /* --- Estado inicial ---------------------------------------------------- */
  function buildInitialState() {
    var now = Date.now();
    var seed = window.UserData;

    return {
      version: 1,
      user: Object.assign({}, seed.DEFAULT_USER, { joinedAt: new Date(now).toISOString() }),
      preferences: Object.assign({}, seed.DEFAULT_PREFERENCES),
      favorites: ['milo', 'nala', 'toby'],
      requests: seed.resolveSeedRequests(now),
      theme: detectTheme(),
      filters: { species: 'todos', search: '', sort: 'recientes', size: '', sex: '', age: '' },
      recentSearches: [],
      searchesCount: 0,
      tips: { dismissed: [] },
      startedAt: new Date(now).toISOString()
    };
  }

  function detectTheme() {
    var stored = window.Storage.get('theme', null);
    if (stored === 'light' || stored === 'dark') { return stored; }
    try {
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    } catch (error) {
      return 'light';
    }
  }

  /* --- Carga ------------------------------------------------------------- */
  var stored = window.Storage.get(KEY, null);
  var state = stored && typeof stored === 'object'
    ? mergeState(buildInitialState(), stored)
    : buildInitialState();

  /* Los datos guardados mandan, pero nunca deben dejar campos nuevos sin
   * definir cuando se evoluciona el esquema. */
  function mergeState(base, saved) {
    var merged = Object.assign({}, base, saved);
    merged.user = Object.assign({}, base.user, saved.user || {});
    merged.preferences = Object.assign({}, base.preferences, saved.preferences || {});
    merged.filters = Object.assign({}, base.filters, saved.filters || {});
    merged.tips = Object.assign({}, base.tips, saved.tips || {});
    merged.favorites = Array.isArray(saved.favorites) ? saved.favorites : base.favorites;
    merged.requests = Array.isArray(saved.requests) ? saved.requests : base.requests;
    merged.version = base.version;
    return merged;
  }

  if (!stored) { window.Storage.set(KEY, state); }

  /* --- Suscriptores ------------------------------------------------------ */
  var listeners = [];

  function subscribe(listener) {
    if (typeof listener !== 'function') { return function () {}; }
    listeners.push(listener);
    return function unsubscribe() {
      var index = listeners.indexOf(listener);
      if (index >= 0) { listeners.splice(index, 1); }
    };
  }

  function emit(event) {
    listeners.slice().forEach(function (listener) {
      try {
        listener(state, event);
      } catch (error) {
        if (window.console) { window.console.error('[Adopta] Error en suscriptor de estado', error); }
      }
    });
  }

  function persist() {
    window.Storage.set(KEY, state);
  }

  function commit(event) {
    persist();
    emit(event || { type: 'change' });
  }

  /* --- Acciones ---------------------------------------------------------- */

  /* Perfil ---------------------------------------------------------------- */
  function updateUser(patch) {
    state.user = Object.assign({}, state.user, patch || {});
    commit({ type: 'user:update', patch: patch });
    return state.user;
  }

  function updatePreferences(patch) {
    state.preferences = Object.assign({}, state.preferences, patch || {});
    commit({ type: 'preferences:update', patch: patch });
    return state.preferences;
  }

  /* Favoritos ------------------------------------------------------------- */
  function isFavorite(petId) { return state.favorites.indexOf(petId) !== -1; }

  function toggleFavorite(petId) {
    var index = state.favorites.indexOf(petId);
    var added;
    if (index === -1) {
      state.favorites = [petId].concat(state.favorites);
      added = true;
    } else {
      state.favorites = state.favorites.slice();
      state.favorites.splice(index, 1);
      added = false;
    }
    commit({ type: 'favorites:toggle', petId: petId, added: added });
    return added;
  }

  function clearFavorites() {
    state.favorites = [];
    commit({ type: 'favorites:clear' });
  }

  /* Solicitudes de adopción ---------------------------------------------- */
  function createRequest(petId, payload) {
    var now = new Date().toISOString();
    var request = {
      id: 'req-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7),
      petId: petId,
      status: 'pendiente',
      message: (payload && payload.message) || '',
      note: 'Recibimos tu solicitud. El refugio la revisará y te contactará en un plazo de 48 horas.',
      createdAt: now,
      updatedAt: now,
      timeline: [{ status: 'pendiente', at: now }],
      /* Datos del formulario: en un backend real viajarían al servidor */
      answers: (payload && payload.answers) || null,
      applicant: (payload && payload.applicant) || null
    };
    state.requests = [request].concat(state.requests);
    commit({ type: 'requests:create', request: request });
    return request;
  }

  function cancelRequest(requestId) {
    var request = state.requests.filter(function (item) { return item.id === requestId; })[0];
    if (!request) { return null; }
    var now = new Date().toISOString();
    request.status = 'cancelada';
    request.updatedAt = now;
    if (!request.timeline) { request.timeline = []; }
    request.timeline.push({ status: 'cancelada', at: now });
    request.note = 'Cancelaste esta solicitud. Puedes volver a enviarla cuando quieras.';
    state.requests = state.requests.slice();
    commit({ type: 'requests:cancel', request: request });
    return request;
  }

  function getRequestForPet(petId) {
    return state.requests.filter(function (request) {
      return request.petId === petId && request.status !== 'cancelada' && request.status !== 'rechazada';
    })[0] || null;
  }

  function requestsByStatus() {
    var groups = { todas: state.requests.length, pendiente: 0, revision: 0, aprobada: 0, rechazada: 0, cancelada: 0 };
    state.requests.forEach(function (request) {
      groups[request.status] = (groups[request.status] || 0) + 1;
    });
    return groups;
  }

  /* Solicitudes activas: alimentan el contador de la navegación */
  function activeRequestCount() {
    return state.requests.filter(function (request) {
      return request.status === 'pendiente' || request.status === 'revision';
    }).length;
  }

  /* Tema ------------------------------------------------------------------ */
  function setTheme(theme) {
    state.theme = theme === 'dark' ? 'dark' : 'light';
    window.Storage.set('theme', state.theme);
    applyTheme();
    commit({ type: 'theme:change', theme: state.theme });
    return state.theme;
  }

  function toggleTheme() {
    return setTheme(state.theme === 'dark' ? 'light' : 'dark');
  }

  function applyTheme() {
    document.documentElement.setAttribute('data-theme', state.theme);
  }

  /* Filtros y búsquedas --------------------------------------------------- */
  function setFilters(patch) {
    state.filters = Object.assign({}, state.filters, patch || {});
    persist();
    return state.filters;
  }

  function resetFilters() {
    state.filters = { species: 'todos', search: '', sort: 'recientes', size: '', sex: '', age: '' };
    persist();
    return state.filters;
  }

  function registerSearch(term) {
    var clean = String(term || '').trim();
    if (clean.length < 2) { return; }
    state.searchesCount = (state.searchesCount || 0) + 1;
    state.recentSearches = [clean]
      .concat((state.recentSearches || []).filter(function (item) {
        return window.Format.normalize(item) !== window.Format.normalize(clean);
      }))
      .slice(0, 6);
    persist();
  }

  function dismissTip(id) {
    if (state.tips.dismissed.indexOf(id) !== -1) { return; }
    state.tips.dismissed = state.tips.dismissed.concat([id]);
    commit({ type: 'tips:dismiss', id: id });
  }

  function isTipDismissed(id) { return state.tips.dismissed.indexOf(id) !== -1; }

  /* Reinicio de la demo --------------------------------------------------- */
  function resetDemo() {
    window.Storage.clearAll();
    state = buildInitialState();
    window.Storage.set(KEY, state);
    window.Storage.set('theme', state.theme);
    applyTheme();
    emit({ type: 'demo:reset' });
    return state;
  }

  /* Estadísticas derivadas para la página de Cuenta */
  function stats() {
    return {
      favorites: state.favorites.length,
      requests: state.requests.length,
      active: activeRequestCount(),
      approved: state.requests.filter(function (r) { return r.status === 'aprobada'; }).length,
      adopted: state.requests.filter(function (r) { return r.status === 'aprobada'; }).length
    };
  }

  applyTheme();

  window.State = {
    get: function () { return state; },
    subscribe: subscribe,
    isPersistent: function () { return STORAGE_AVAILABLE; },
    /* Acciones */
    updateUser: updateUser,
    updatePreferences: updatePreferences,
    toggleFavorite: toggleFavorite,
    isFavorite: isFavorite,
    clearFavorites: clearFavorites,
    createRequest: createRequest,
    cancelRequest: cancelRequest,
    getRequestForPet: getRequestForPet,
    requestsByStatus: requestsByStatus,
    activeRequestCount: activeRequestCount,
    setTheme: setTheme,

    setFilters: setFilters,
    resetFilters: resetFilters,
    registerSearch: registerSearch,
    dismissTip: dismissTip,
    isTipDismissed: isTipDismissed,
    resetDemo: resetDemo,
    stats: stats
  };
})();

/* ==== js/router.js ==== */
/* ============================================================================
 * router.js — Enrutador SPA basado en hash
 * ----------------------------------------------------------------------------
 * Se usa hash (#/ruta) a propósito: funciona en GitHub Pages, en cualquier
 * subcarpeta y abriendo el archivo con doble clic (file://), sin necesidad de
 * configuración de servidor ni reescrituras.
 *
 * Rutas registradas:
 *   #/                     Inicio
 *   #/mascotas             Catálogo con filtros
 *   #/mascotas/:id         Detalle de una mascota
 *   #/solicitudes          Historial de solicitudes
 *   #/cuenta               Cuenta y ajustes
 * ========================================================================== */
(function () {
  'use strict';

  var routes = [];
  var notFoundHandler = null;
  var currentRoute = null;
  var currentParams = null;
  var container = null;
  var navigationToken = 0;

  /* --------------------------------------------------------------------------
   * Registro de rutas
   * ------------------------------------------------------------------------ */
  function register(pattern, handler) {
    routes.push({
      pattern: pattern,
      parts: pattern.split('/').filter(Boolean),
      handler: handler
    });
  }

  function fallback(handler) { notFoundHandler = handler; }

  /* --------------------------------------------------------------------------
   * Parseo del hash
   * ------------------------------------------------------------------------ */
  function parseHash(hash) {
    var raw = String(hash == null ? window.location.hash : hash);
    raw = raw.replace(/^#/, '');
    if (!raw || raw === '/') { return { path: '/', query: {} }; }

    var queryIndex = raw.indexOf('?');
    var query = {};
    var path = raw;

    if (queryIndex !== -1) {
      path = raw.slice(0, queryIndex);
      raw.slice(queryIndex + 1).split('&').forEach(function (pair) {
        if (!pair) { return; }
        var bits = pair.split('=');
        query[decodeURIComponent(bits[0])] = decodeURIComponent(bits.slice(1).join('=') || '');
      });
    }

    path = '/' + path.split('/').filter(Boolean).join('/');
    return { path: path, query: query };
  }

  function match(path) {
    var segments = path.split('/').filter(Boolean);
    for (var i = 0; i < routes.length; i++) {
      var route = routes[i];
      if (route.parts.length !== segments.length) { continue; }
      var params = {};
      var ok = true;
      for (var j = 0; j < route.parts.length; j++) {
        var part = route.parts[j];
        if (part.charAt(0) === ':') {
          params[part.slice(1)] = decodeURIComponent(segments[j]);
        } else if (part !== segments[j]) {
          ok = false;
          break;
        }
      }
      if (ok) { return { route: route, params: params }; }
    }
    return null;
  }

  /* --------------------------------------------------------------------------
   * Navegación
   * ------------------------------------------------------------------------ */
  function navigate(path, options) {
    var opts = options || {};
    var target = String(path || '/');
    if (target.charAt(0) !== '/') { target = '/' + target; }
    var nextHash = '#' + target;

    if (window.location.hash === nextHash && !opts.force) {
      return resolve();
    }
    if (opts.replace) {
      window.location.replace(window.location.pathname + window.location.search + nextHash);
      /* `replace` no dispara hashchange en algunos navegadores: se resuelve a mano */
      window.setTimeout(resolve, 0);
    } else {
      window.location.hash = nextHash;
    }
    return Promise.resolve();
  }

  function back(fallbackPath) {
    if (window.history.length > 1) { window.history.back(); return; }
    navigate(fallbackPath || '/');
  }

  /* --------------------------------------------------------------------------
   * Resolución de la ruta actual: renderiza la vista y avisa del resultado
   * ------------------------------------------------------------------------ */
  function resolve() {
    var parsed = parseHash();
    var found = match(parsed.path);
    var token = ++navigationToken;

    var handler = found ? found.route.handler : notFoundHandler;
    var params = Object.assign({}, found ? found.params : {}, { query: parsed.query, path: parsed.path });

    currentRoute = parsed.path;
    currentParams = params;

    if (window.App && window.App.setLoading) { window.App.setLoading(true); }

    var result;
    try {
      result = handler ? handler(params) : null;
    } catch (error) {
      if (window.console) { window.console.error('[Adopta] Error al renderizar ' + parsed.path, error); }
      result = null;
    }

    /* Las vistas pueden ser síncronas (string) o asíncronas (Promise) */
    return Promise.resolve(result)
      .then(function (html) {
        if (token !== navigationToken) { return null; }   /* navegación superada */
        if (typeof html === 'string') { paint(html); }
        if (window.App && window.App.setLoading) { window.App.setLoading(false); }
        return html;
      })
      .catch(function (error) {
        if (window.console) { window.console.error('[Adopta] Vista con error', error); }
        if (window.App && window.App.setLoading) { window.App.setLoading(false); }
        paint(window.Views ? window.Views.error(error) : '<div class="empty"><h3>Ocurrió un error</h3></div>');
        return null;
      });
  }

  /* Pinta el HTML de la vista dentro del contenedor principal */
  function paint(html) {
    if (!container) { container = document.getElementById('vista'); }
    if (!container) { return; }
    container.innerHTML = html;
    container.setAttribute('tabindex', '-1');
    afterPaint();
  }

  /* Tareas posteriores al pintado: iconos, imágenes, foco y anuncio */
  function afterPaint() {
    window.Icon.inject(container);
    window.Media.hydrateImages(container);
    if (window.App && window.App.afterRender) { window.App.afterRender(); }
  }

  /* --------------------------------------------------------------------------
   * Arranque
   * ------------------------------------------------------------------------ */
  function start() {
    container = document.getElementById('vista');
    window.addEventListener('hashchange', resolve);
    if (!window.location.hash) {
      /* Sin hash inicial: se normaliza a #/ sin ensuciar el historial */
      window.history.replaceState(null, '', window.location.pathname + window.location.search + '#/');
    }
    return resolve();
  }

  /* Ruta activa (para marcar la navegación) */
  function current() { return currentRoute || '/'; }

  /* ¿La ruta actual es "mascotas" o su detalle? Útil para el estado activo */
  function isWithin(basePath) {
    var path = current();
    if (basePath === '/') { return path === '/'; }
    return path === basePath || path.indexOf(basePath + '/') === 0;
  }

  window.Router = {
    register: register,
    fallback: fallback,
    start: start,
    navigate: navigate,
    back: back,
    resolve: resolve,
    current: current,
    currentParams: function () { return currentParams; },
    isWithin: isWithin,
    parseHash: parseHash
  };
})();

/* ==== js/ui/views.js ==== */
/* ============================================================================
 * views.js — Registro de vistas y ciclo de vida
 * ----------------------------------------------------------------------------
 * Cada página registra aquí su render y su montaje (listeners de la vista).
 * El router avisa cuando una vista se reemplaza para poder liberar listeners,
 * temporizadores y suscripciones al estado (evita fugas de memoria).
 * ========================================================================== */
(function () {
  'use strict';

  var registry = {};
  var activeScope = null;   /* contenedor de limpiezas de la vista en curso */
  var currentName = null;

  /* Registra una vista: { render(params) -> html|Promise, mount(root, params) } */
  function define(name, handlers) {
    registry[name] = handlers || {};
  }

  function get(name) { return registry[name] || null; }

  /* El ciclo de vida de cada montaje vive en un contenedor aislado, de modo que
   * una re-renderización de la misma ruta no reutilice limpiezas antiguas. */
  function setScope(scope) {
    activeScope = scope || null;
    if (activeScope) { activeScope.teardown = null; }
    return activeScope;
  }

  function currentScope() { return activeScope; }

  /* Registra una limpieza que se ejecutará al salir de la vista actual */
  function onLeave(callback) {
    if (typeof callback !== 'function') { return; }
    if (!activeScope) { return; }   /* sin ámbito activo no hay nada que limpiar */

    var previous = activeScope.teardown;
    activeScope.teardown = function () {
      if (typeof previous === 'function') { previous(); }
      callback();
    };
  }

  /* Ejecuta y descarta las limpiezas registradas */
  function teardown(scope) {
    var target = scope || activeScope;
    if (!target || typeof target.teardown !== 'function') { return; }
    try {
      target.teardown();
    } catch (error) {
      if (window.console) { window.console.error('[Adopta] Error al limpiar la vista', error); }
    }
    target.teardown = null;
    if (target === activeScope) { activeScope = null; }
  }

  /* Página de error genérica (se muestra si una vista lanza una excepción) */
  function error(detail) {
    return window.Dom.h`
      <div class="empty" style="margin-top:var(--s-8)">
        <span class="empty__art">${window.Dom.raw(window.Icon.render('info'))}</span>
        <h3>Algo no salió como esperábamos</h3>
        <p>No pudimos cargar esta sección. Intenta de nuevo; si el problema continúa, vuelve al inicio.</p>
        ${detail ? window.Dom.raw('<p style="font-size:var(--fs-xs);color:var(--c-text-mute)">' + window.Dom.escape(String(detail)) + '</p>') : ''}
        <div class="empty__actions">
          <a class="btn btn--primary" href="#/">${window.Dom.raw(window.Icon.render('home'))} Ir al inicio</a>
          <button class="btn btn--ghost" type="button" onclick="location.reload()">Recargar</button>
        </div>
      </div>`;
  }

  window.Views = {
    define: define,
    get: get,
    onLeave: onLeave,
    setScope: setScope,
    currentScope: currentScope,
    teardown: teardown,
    error: error,
    setCurrent: function (name) { currentName = name; },
    current: function () { return currentName; }
  };
})();

/* ==== js/ui/toast.js ==== */
/* ============================================================================
 * toast.js — Notificaciones efímeras (no bloquean la interfaz)
 * Uso: Toast.show('Mensaje') · Toast.success('Guardado') · Toast.heart('Añadido a favoritos')
 * ========================================================================== */
(function () {
  'use strict';

  var DURATIONS = { success: 3200, info: 3600, error: 5000, heart: 2600 };
  var ICONS = { success: 'checkCircle', error: 'info', info: 'info', heart: 'heartSolid' };
  var active = [];

  function root() {
    var node = document.getElementById('toast-root');
    if (!node) {
      node = document.createElement('div');
      node.id = 'toast-root';
      node.className = 'toast-root';
      node.setAttribute('role', 'region');
      node.setAttribute('aria-live', 'polite');
      document.body.appendChild(node);
    }
    return node;
  }

  function dismiss(toast) {
    if (!toast || toast.getAttribute('data-closing') === '1') { return; }
    toast.setAttribute('data-closing', '1');
    toast.classList.add('is-out');
    window.setTimeout(function () {
      if (toast.parentNode) { toast.parentNode.removeChild(toast); }
      var index = active.indexOf(toast);
      if (index >= 0) { active.splice(index, 1); }
    }, 220);
  }

  /* variant: 'success' | 'error' | 'info' | 'heart'
   * title:   texto principal
   * message: línea secundaria opcional */
  function show(message, options) {
    var opts = options || {};
    var variant = opts.variant || 'info';
    var title = opts.title || '';
    var body = message || '';
    var duration = typeof opts.duration === 'number' ? opts.duration : (DURATIONS[variant] || 3200);

    /* Máximo 3 notificaciones simultáneas: se retira la más antigua */
    while (active.length >= 3) { dismiss(active[0]); }

    var html = window.Dom.h`
      <div class="toast toast--${variant}" role="status">
        <span class="toast__icon">${window.Dom.raw(window.Icon.render(ICONS[variant] || 'info', { solid: variant === 'heart' }))}</span>
        <span class="toast__text">
          ${title ? window.Dom.raw('<strong>' + window.Dom.escape(title) + '</strong>') : ''}
          ${body}
        </span>
        <button class="icon-btn toast__close" type="button" aria-label="Cerrar notificación">
          ${window.Dom.raw(window.Icon.render('close'))}
        </button>
      </div>`;

    var node = window.Dom.el(html);
    root().appendChild(node);
    active.push(node);

    node.querySelector('.toast__close').addEventListener('click', function () { dismiss(node); });

    var timer = window.setTimeout(function () { dismiss(node); }, duration);
    /* Pausa al pasar el cursor: el usuario puede leer sin prisa */
    node.addEventListener('mouseenter', function () { window.clearTimeout(timer); });
    node.addEventListener('mouseleave', function () {
      timer = window.setTimeout(function () { dismiss(node); }, 1400);
    });

    return node;
  }

  window.Toast = {
    show: function (message, options) { return show(message, options); },
    success: function (message, title) { return show(message, { variant: 'success', title: title }); },
    error: function (message, title) { return show(message, { variant: 'error', title: title }); },
    info: function (message, title) { return show(message, { variant: 'info', title: title }); },
    heart: function (message, title) { return show(message, { variant: 'heart', title: title }); },
    dismissAll: function () { active.slice().forEach(dismiss); }
  };
})();

/* ==== js/ui/modal.js ==== */
/* ============================================================================
 * modal.js — Modales y hojas inferiores accesibles
 * ----------------------------------------------------------------------------
 * Se usa el elemento nativo <dialog> con `showModal()`, que ya aporta:
 *   · foco atrapado dentro del diálogo
 *   · cierre con la tecla Escape
 *   · capa superior (::backdrop) y semántica ARIA correcta
 * Encima se añade: bloqueo de scroll, cierre al pulsar el fondo, animación de
 * salida y liberación de listeners.
 * ========================================================================== */
(function () {
  'use strict';

  var openDialogs = [];

  function root() {
    var node = document.getElementById('modal-root');
    if (!node) {
      node = document.createElement('div');
      node.id = 'modal-root';
      document.body.appendChild(node);
    }
    return node;
  }

  /* --------------------------------------------------------------------------
   * open({ title, subtitle, body, footer, size, onMount, onClose, initialFocus })
   * body y footer aceptan HTML ya construido con Dom.h (se marca como confiable
   * explícitamente porque proviene de nuestras plantillas).
   * ------------------------------------------------------------------------ */
  function open(options) {
    var opts = options || {};

    var html = window.Dom.h`
      <dialog class="overlay" aria-labelledby="modal-title">
        <div class="modal ${opts.size === 'wide' ? 'modal--wide' : ''}" role="document">
          <div class="modal__grab" aria-hidden="true"></div>
          <header class="modal__head">
            <div>
              <h2 class="modal__title" id="modal-title">${opts.title || ''}</h2>
              ${opts.subtitle ? window.Dom.raw('<p class="modal__sub">' + window.Dom.escape(opts.subtitle) + '</p>') : ''}
            </div>
            <button class="icon-btn modal__close" type="button" data-modal-close aria-label="Cerrar ventana">
              ${window.Dom.raw(window.Icon.render('close'))}
            </button>
          </header>
          <div class="modal__body">${window.Dom.raw(opts.body || '')}</div>
          ${opts.footer ? window.Dom.raw('<footer class="modal__foot">' + opts.footer + '</footer>') : ''}
        </div>
      </dialog>`;

    var dialog = window.Dom.el(html);
    root().appendChild(dialog);

    var released = false;
    var releaseTrap = null;

    function close(result) {
      if (released) { return; }
      released = true;

      if (releaseTrap) { releaseTrap(); }
      window.A11y.unlockScroll();
      dialog.classList.add('is-closing');

      window.setTimeout(function () {
        try { if (dialog.open) { dialog.close(); } } catch (error) { /* noop */ }
        if (dialog.parentNode) { dialog.parentNode.removeChild(dialog); }
        var index = openDialogs.indexOf(dialog);
        if (index >= 0) { openDialogs.splice(index, 1); }
        if (typeof opts.onClose === 'function') { opts.onClose(result); }
      }, 180);
    }

    /* Cierre al pulsar el fondo (fuera de la tarjeta del modal) */
    dialog.addEventListener('click', function (event) {
      if (event.target === dialog) { close(null); }
    });
    dialog.addEventListener('cancel', function (event) {
      event.preventDefault();     /* se gestiona con nuestra animación */
      close(null);
    });
    window.Dom.qs('[data-modal-close]', dialog).addEventListener('click', function () { close(null); });

    /* El contenido siempre puede pedir el cierre o la apertura de otro modal */
    dialog.addEventListener('adopta:close', function () { close(null); });

    try {
      dialog.showModal();
    } catch (error) {
      dialog.setAttribute('open', 'open');
    }

    window.A11y.lockScroll();
    releaseTrap = window.A11y.trapFocus(dialog, { initialFocus: opts.initialFocus || null });
    openDialogs.push(dialog);

    window.Icon.inject(dialog);
    window.Media.hydrateImages(dialog);

    if (typeof opts.onMount === 'function') { opts.onMount(dialog, close); }

    return { dialog: dialog, close: close };
  }

  function confirm(message, options) {
    var opts = options || {};
    return new Promise(function (resolve) {
      var settled = false;
      var handle = open({
        title: opts.title || '¿Confirmas la acción?',
        body: window.Dom.h`<p>${message}</p>`,
        footer: window.Dom.h`
          <button class="btn btn--ghost grow" type="button" data-confirm-no>${opts.cancelLabel || 'Cancelar'}</button>
          <button class="btn ${opts.danger ? 'btn--danger' : 'btn--primary'} grow" type="button" data-confirm-yes>
            ${opts.confirmLabel || 'Confirmar'}
          </button>`,
        onMount: function (dialog, close) {
          window.Dom.qs('[data-confirm-no]', dialog).addEventListener('click', function () {
            settled = true; close(false); resolve(false);
          });
          window.Dom.qs('[data-confirm-yes]', dialog).addEventListener('click', function () {
            settled = true; close(true); resolve(true);
          });
        },
        onClose: function () { if (!settled) { resolve(false); } }
      });
      return handle;
    });
  }

  function closeAll() {
    openDialogs.slice().forEach(function (dialog) {
      var event = new CustomEvent('adopta:close');
      dialog.dispatchEvent(event);
    });
  }

  window.Modal = {
    open: open,
    confirm: confirm,
    closeAll: closeAll,
    isOpen: function () { return openDialogs.length > 0; }
  };
})();

/* ==== js/ui/cards.js ==== */
/* ============================================================================
 * cards.js — Piezas de interfaz compartidas entre vistas
 * ----------------------------------------------------------------------------
 * Aquí viven los bloques que varias páginas necesitan: los chips de filtro, el
 * buscador, las tarjetas de solicitud y las filas de ajustes. Se mantiene en un
 * único archivo para que el aspecto sea consistente en toda la app.
 * ========================================================================== */
(function () {
  'use strict';

  /* --------------------------------------------------------------------------
   * Chips de especie con contador
   * ------------------------------------------------------------------------ */
  function speciesChips(counts, current) {
    counts = counts || window.Repository.speciesCounts();
    var options = [
      { value: 'todos', label: 'Todos', icon: 'pawSolid' },
      { value: 'perro', label: 'Perros', icon: 'dog' },
      { value: 'gato', label: 'Gatos', icon: 'cat' },
      { value: 'conejo', label: 'Conejos', icon: 'rabbit' }
    ];

    var html = options.map(function (option) {
      var isActive = (current || 'todos') === option.value;
      var count = counts[option.value] || 0;

      return window.Dom.h`
        <button class="chip ${isActive ? 'is-active' : ''}" type="button"
                data-filter-species="${option.value}"
                aria-pressed="${isActive ? 'true' : 'false'}">
          ${window.Dom.raw(window.Icon.render(option.icon))}
          <span>${option.label}</span>
          <span class="chip__count">${count}</span>
        </button>`;
    }).join('');

    return window.Dom.h`<div class="chips" role="group" aria-label="Filtrar por tipo de mascota">${window.Dom.raw(html)}</div>`;
  }

  /* --------------------------------------------------------------------------
   * Buscador con autocompletado
   * ------------------------------------------------------------------------ */
  function searchBox(options) {
    var opts = options || {};
    var value = opts.value || '';

    return window.Dom.h`
      <div class="search ${value ? 'has-value' : ''}" data-search-box>
        ${window.Dom.raw(window.Icon.render('search'))}
        <input type="search"
               data-search-input
               value="${value}"
               placeholder="${opts.placeholder || 'Buscar por nombre, raza o refugio'}"
               aria-label="${opts.placeholder || 'Buscar mascotas'}"
               autocomplete="off"
               enterkeyhint="search">
        <button class="search__clear" type="button" data-search-clear aria-label="Borrar búsqueda">
          ${window.Dom.raw(window.Icon.render('close'))}
        </button>
      </div>`;
  }

  /* --------------------------------------------------------------------------
   * Etiquetas de filtros activos (se pueden quitar una a una)
   * ------------------------------------------------------------------------ */
  function activeFilterTags(filters, options) {
    var opts = options || {};
    var tags = [];

    if (filters.search) { tags.push({ kind: 'search', label: '“' + filters.search + '”', icon: 'search' }); }
    if (filters.size && opts.showAdvanced) { tags.push({ kind: 'size', label: window.Format.sizeLabel(filters.size), icon: 'scale' }); }
    if (filters.sex && opts.showAdvanced) { tags.push({ kind: 'sex', label: window.Format.sexLabel(filters.sex), icon: 'user' }); }
    if (opts.ageLabel) { tags.push({ kind: 'age', label: opts.ageLabel, icon: 'cake' }); }

    if (!tags.length) { return ''; }

    var html = tags.map(function (tag) {
      return window.Dom.h`
        <span class="filter-tag">
          ${window.Dom.raw(window.Icon.render(tag.icon))}
          ${tag.label}
          <button type="button" data-remove-filter="${tag.kind}" aria-label="Quitar filtro ${tag.label}">
            ${window.Dom.raw(window.Icon.render('close'))}
          </button>
        </span>`;
    }).join('');

    return window.Dom.h`
      <div class="catalog__active">
        ${window.Dom.raw(html)}
        <button class="btn btn--sm btn--ghost" type="button" data-action="clear-filters">Limpiar todo</button>
      </div>`;
  }

  /* --------------------------------------------------------------------------
   * Tarjeta de solicitud de adopción
   * ------------------------------------------------------------------------ */
  var STATUS_FLOW = ['pendiente', 'revision', 'aprobada'];

  function timeline(request) {
    var done = {};
    (request.timeline || []).forEach(function (step) { done[step.status] = step.at; });

    if (request.status === 'rechazada' || request.status === 'cancelada') {
      var steps = STATUS_FLOW.slice(0, 2).map(function (status) {
        return window.Dom.h`
          <span class="timeline__step is-done">
            <span class="timeline__dot">${window.Dom.raw(window.Icon.render('check'))}</span>
            ${window.Format.statusLabel(status)}
          </span>`;
      }).join('');

      return window.Dom.h`
        <div class="timeline">
          ${window.Dom.raw(steps)}
          <span class="timeline__line" aria-hidden="true"></span>
          <span class="timeline__step is-rejected">
            <span class="timeline__dot">${window.Dom.raw(window.Icon.render(request.status === 'rechazada' ? 'close' : 'info'))}</span>
            ${window.Format.statusLabel(request.status)}
          </span>
        </div>`;
    }

    var index = STATUS_FLOW.indexOf(request.status);
    var parts = STATUS_FLOW.map(function (status, i) {
      var state = i < index ? 'is-done' : (i === index ? 'is-current' : '');
      var icon = i < index ? 'check' : (i === index ? window.Format.statusIcon(status) : 'chevronRight');
      return window.Dom.h`
        <span class="timeline__step ${state}">
          <span class="timeline__dot">${window.Dom.raw(window.Icon.render(icon))}</span>
          ${window.Format.statusLabel(status)}
        </span>`;
    });

    return window.Dom.h`
      <div class="timeline">
        ${window.Dom.raw(parts[0])}
        <span class="timeline__line" aria-hidden="true"></span>
        ${window.Dom.raw(parts[1])}
        <span class="timeline__line" aria-hidden="true"></span>
        ${window.Dom.raw(parts[2])}
      </div>`;
  }

  function requestCard(request) {
    var pet = window.Repository._sync.getPet(request.petId);
    var petName = pet ? pet.name : 'Mascota no disponible';
    var petBreed = pet ? pet.breed : 'Ficha retirada del catálogo';
    var canCancel = request.status === 'pendiente' || request.status === 'revision';

    var media = pet
      ? window.Dom.h`
          <a class="req-card__media" href="#/mascotas/${pet.id}" data-nav="${pet.id}" aria-label="Ver ficha de ${pet.name}">
            ${window.Media.portrait({
              id: pet.cover,
              name: pet.name,
              alt: pet.name,
              width: 400,
              className: 'req-card__img',

            })}
          </a>`

          <span class="req-card__media">
            <span class="img-fallback" style="background:${window.Media.gradientFor(request.petId)}">
              <span class="img-fallback__initial">?</span>
            </span>
          </span>`;

    return window.Dom.h`
      <article class="req-card" data-request="${request.id}">
        ${window.Dom.raw(media)}

        <div>
          <div class="row between" style="gap:var(--s-3);align-items:flex-start">
            <div>
              <h3 class="req-card__title">${petName}</h3>
              <p class="req-card__breed" style="font-size:var(--fs-sm);color:var(--c-text-mute)">${petBreed}</p>
            </div>
            <span class="badge ${window.Format.statusBadge(request.status)}">
              ${window.Dom.raw(window.Icon.render(window.Format.statusIcon(request.status)))}
              ${window.Format.statusLabel(request.status)}
            </span>
          </div>

          <div class="req-card__meta">
            <span>${window.Dom.raw(window.Icon.render('calendar'))} Enviada el ${window.Format.shortDate(request.createdAt)}</span>
            <span>${window.Dom.raw(window.Icon.render('clock'))} Actualizada ${window.Format.relative(request.updatedAt || request.createdAt)}</span>
            <span>${window.Dom.raw(window.Icon.render('clipboard'))} Folio ${request.id.toUpperCase()}</span>
          </div>

          ${window.Dom.raw(timeline(request))}

          ${request.note ? window.Dom.raw(window.Dom.h`
            <p class="req-note">
              ${window.Dom.raw(window.Icon.render('info'))}
              <span>${request.note}</span>
            </p>`) : ''}
        </div>

        <div class="req-card__actions">
          ${pet ? window.Dom.raw(window.Dom.h`
            <a class="btn btn--ghost btn--sm" href="#/mascotas/${pet.id}" data-nav="${pet.id}">
              ${window.Dom.raw(window.Icon.render('paw'))} Ver ficha
            </a>`) : ''}
          ${canCancel ? window.Dom.raw(window.Dom.h`
            <button class="btn btn--sm btn--danger" type="button" data-cancel-request="${request.id}">
              ${window.Dom.raw(window.Icon.render('close'))} Cancelar
            </button>`) : ''}
        </div>
      </article>`;
  }

  /* --------------------------------------------------------------------------
   * Chips de estado de solicitud
   * ------------------------------------------------------------------------ */
  function statusChips(groups, current) {
    var options = [
      { value: 'todas', label: 'Todas' },
      { value: 'pendiente', label: 'Pendientes' },
      { value: 'revision', label: 'En revisión' },
      { value: 'aprobada', label: 'Aprobadas' },
      { value: 'rechazada', label: 'Rechazadas' }
    ];

    var html = options.map(function (option) {
      var count = groups[option.value] || 0;
      var isActive = (current || 'todas') === option.value;
      return window.Dom.h`
        <button class="chip ${isActive ? 'is-active' : ''}" type="button"
