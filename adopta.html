                aria-pressed="${isActive ? 'true' : 'false'}">
          <span>${option.label}</span>
          <span class="chip__count">${count}</span>
        </button>`;
    }).join('');

    return window.Dom.h`<div class="chips" role="group" aria-label="Filtrar solicitudes por estado">${window.Dom.raw(html)}</div>`;
  }

  /* --------------------------------------------------------------------------
   * Fila de menú / ajuste
   * ------------------------------------------------------------------------ */
  function menuItem(options) {
    var opts = options || {};
    var tag = opts.href ? 'a' : 'button';
    var attrs = opts.href
      ? window.Dom.raw('href="' + opts.href + '"')
      : window.Dom.raw('type="button"');

    return window.Dom.h`
      <${window.Dom.raw(tag)} class="menu__item ${opts.danger ? 'menu__item--danger' : ''}" ${attrs}
        ${opts.action ? window.Dom.raw('data-action="' + opts.action + '"') : ''}>
        <span class="menu__icon">${window.Dom.raw(window.Icon.render(opts.icon || 'info'))}</span>
        <span class="menu__text">
          ${opts.label}
          ${opts.hint ? window.Dom.raw('<small>' + window.Dom.escape(opts.hint) + '</small>') : ''}
        </span>
        ${window.Dom.raw(window.Icon.render(opts.href ? 'chevronRight' : (opts.trailingIcon || 'chevronRight')))}
      </${window.Dom.raw(tag)}>`;
  }

  /* Fila con interruptor (ajustes) */
  function prefRow(options) {
    var opts = options || {};
    return window.Dom.h`
      <div class="pref">
        <span class="menu__icon">${window.Dom.raw(window.Icon.render(opts.icon || 'bell'))}</span>
        <span class="pref__text">
          <strong>${opts.label}</strong>
          <small>${opts.hint || ''}</small>
        </span>
        <label class="switch">
          <input type="checkbox" data-pref="${opts.key}" ${opts.checked ? window.Dom.raw('checked') : ''}
                 aria-label="${opts.label}">
          <span class="switch__track" aria-hidden="true"></span>
        </label>
      </div>`;
  }

  /* --------------------------------------------------------------------------
   * Bloque con título
   * ------------------------------------------------------------------------ */
  function block(title, icon, content) {
    return window.Dom.h`
      <section class="block">
        <h2 class="block__title">${window.Dom.raw(window.Icon.render(icon))} ${title}</h2>
        ${window.Dom.raw(content)}
      </section>`;
  }

  /* Aviso informativo reutilizable */
  function demoNote(text, icon) {
    return window.Dom.h`
      <p class="demo-note">
        ${window.Dom.raw(window.Icon.render(icon || 'info'))}
        <span>${text}</span>
      </p>`;
  }

  /* Tarjeta de estadística */
  function statCard(value, label, icon) {
    return window.Dom.h`
      <div class="stat">
        <strong>${value}</strong>
        <span>${label}</span>
      </div>`;
  }

  window.Cards = {
    speciesChips: speciesChips,
    searchBox: searchBox,
    activeFilterTags: activeFilterTags,
    requestCard: requestCard,
    statusChips: statusChips,
    menuItem: menuItem,
    prefRow: prefRow,
    block: block,
    demoNote: demoNote,
    statCard: statCard
  };
})();

/* ==== js/ui/search.js ==== */
/* ============================================================================
 * search.js — Comportamiento del buscador (debounce + autocompletado)
 * ----------------------------------------------------------------------------
 * Centraliza la lógica de búsqueda para Inicio y Catálogo: escritura con
 * retardo, sugerencias navegables con el teclado, historial de búsquedas y
 * limpieza del campo.
 * ========================================================================== */
(function () {
  'use strict';

  var DEBOUNCE_MS = 220;

  /* Conecta un buscador ya presente en el DOM.
   * options: { onInput(value), onSubmit(value), suggestions(bool) } */
  function wire(root, options) {
    var opts = options || {};
    var box = window.Dom.qs('[data-search-box]', root);
    if (!box) { return null; }

    var input = window.Dom.qs('[data-search-input]', box);
    var clearButton = window.Dom.qs('[data-search-clear]', box);
    var timer = null;
    var suggestBox = null;
    var activeIndex = -1;
    var suggestions = [];

    function closeSuggestions() {
      if (suggestBox && suggestBox.parentNode) { suggestBox.parentNode.removeChild(suggestBox); }
      suggestBox = null;
      activeIndex = -1;
      suggestions = [];
    }

    function openSuggestions(term) {
      suggestions = window.Repository.suggest(term, 6);
      closeSuggestions();

      if (!suggestions.length) {
        return;
      }

      suggestBox = window.Dom.el(window.Dom.h`
        <div class="suggest" role="listbox" aria-label="Sugerencias de búsqueda">
          ${window.Dom.raw(suggestions.map(function (item, index) {
            var pet = item.pet;
            return window.Dom.h`
              <button class="suggest__item" type="button" role="option" data-suggest-index="${index}">
                <span class="suggest__thumb" style="position:relative;overflow:hidden;display:block">
                  ${window.Media.portrait({
                    id: pet.cover, name: pet.name, alt: '', width: 160,
                    className: 'suggest__thumb'
                  })}
                </span>
                <span class="grow">
                  <strong>${item.text}</strong>
                  <small>${pet.speciesLabel} · ${pet.ageLabel} · ${pet.location}</small>
                </span>
                ${window.Dom.raw(window.Icon.render('arrowRight'))}
              </button>`;
          }))}
        </div>`);

      box.appendChild(suggestBox);
      window.Icon.inject(suggestBox);
      window.Media.hydrateImages(suggestBox);

      suggestBox.addEventListener('mousedown', function (event) {
        var button = event.target.closest('[data-suggest-index]');
        if (!button) { return; }
        event.preventDefault();
        var item = suggestions[Number(button.getAttribute('data-suggest-index'))];
        if (!item) { return; }
        input.value = item.text;
        updateClearState();
        closeSuggestions();
        commit(item.text);
        goToResults(item.text);
      });
    }

    function updateClearState() {
      box.classList.toggle('has-value', !!input.value);
    }

    function commit(value) {
      if (typeof opts.onInput === 'function') { opts.onInput(value); }
    }

    function goToResults(value) {
      if (typeof opts.onSubmit === 'function') { opts.onSubmit(value); }
    }

    function highlight(index) {
      if (!suggestBox) { return; }
      var items = window.Dom.qsa('.suggest__item', suggestBox);
      items.forEach(function (item, i) {
        item.classList.toggle('is-active', i === index);
      });
      activeIndex = index;
    }

    input.addEventListener('input', function () {
      updateClearState();
      var value = input.value;
      window.clearTimeout(timer);
      timer = window.setTimeout(function () {
        commit(value);
        if (opts.suggestions === false) { return; }
        if (value.trim().length >= 2) {
          openSuggestions(value);
        } else {
          closeSuggestions();
        }
      }, DEBOUNCE_MS);
    });

    input.addEventListener('keydown', function (event) {
      if (event.key === 'ArrowDown' && suggestBox) {
        event.preventDefault();
        highlight(Math.min(activeIndex + 1, suggestions.length - 1));
        return;
      }
      if (event.key === 'ArrowUp' && suggestBox) {
        event.preventDefault();
        highlight(Math.max(activeIndex - 1, 0));
        return;
      }
      if (event.key === 'Enter') {
        event.preventDefault();
        window.clearTimeout(timer);
        if (activeIndex >= 0 && suggestions[activeIndex]) {
          var chosen = suggestions[activeIndex];
          input.value = chosen.text;
          updateClearState();
          closeSuggestions();
          commit(chosen.text);
          goToResults(chosen.text);
          return;
        }
        commit(input.value);
        goToResults(input.value);
        return;
      }
      if (event.key === 'Escape') {
        if (suggestBox) {
          closeSuggestions();
        } else {
          input.value = '';
          updateClearState();
          commit('');
        }
      }
    });

    input.addEventListener('focus', function () {
      if (input.value.trim().length >= 2 && opts.suggestions !== false) {
        openSuggestions(input.value);
      }
    });

    input.addEventListener('blur', function () {
      window.setTimeout(closeSuggestions, 130);
    });

    if (clearButton) {
      clearButton.addEventListener('click', function () {
        input.value = '';
        updateClearState();
        closeSuggestions();
        commit('');
        input.focus();
      });
    }

    updateClearState();

    /* Vista previa del historial de búsquedas al enfocar un campo vacío */
    if (opts.showHistory !== false) {
      input.addEventListener('focus', function () {
        var history = window.State.get().recentSearches || [];
        if (input.value || !history.length || suggestBox) { return; }
        suggestions = history.map(function (term) {
          return { text: term, pet: null };
        });
        suggestBox = window.Dom.el(window.Dom.h`
          <div class="suggest" role="listbox" aria-label="Búsquedas recientes">
            <p class="suggest__empty" style="text-align:left;padding:var(--s-2) var(--s-3)">
              Búsquedas recientes
            </p>
            ${window.Dom.raw(history.map(function (term, index) {
              return window.Dom.h`
                <button class="suggest__item" type="button" role="option" data-suggest-index="${index}">
                  ${window.Dom.raw(window.Icon.render('clock'))}
                  <span class="grow"><strong>${term}</strong></span>
                </button>`;
            }).join(''))}
          </div>`);
        box.appendChild(suggestBox);
        window.Icon.inject(suggestBox);
        suggestBox.addEventListener('mousedown', function (event) {
          var button = event.target.closest('[data-suggest-index]');
          if (!button) { return; }
          event.preventDefault();
          var chosen = suggestions[Number(button.getAttribute('data-suggest-index'))];
          if (!chosen) { return; }
          input.value = chosen.text;
          updateClearState();
          closeSuggestions();
          commit(chosen.text);
          goToResults(chosen.text);
        });
      });
    }

    return {
      input: input,
      value: function () { return input.value; },
      setValue: function (value) {
        input.value = value || '';
        updateClearState();
      },
      close: closeSuggestions
    };
  }

  window.Search = { wire: wire };
})();

/* ==== js/ui/pet-card.js ==== */
/* ============================================================================
 * pet-card.js — Tarjetas de mascota (catálogo, destacados, miniaturas)
 * ----------------------------------------------------------------------------
 * Un único lugar para construir tarjetas garantiza que el catálogo, el
 * carrusel de destacados y las recomendaciones se vean coherentes y compartan
 * el mismo comportamiento (favoritos, navegación por teclado, respaldo de
 * imágenes).
 * ========================================================================== */
(function () {
  'use strict';

  /* --- Tarjeta estándar del catálogo ------------------------------------ */
  function card(pet, options) {
    var opts = options || {};
    var favorite = window.State.isFavorite(pet.id);
    var index = typeof opts.index === 'number' ? opts.index : 0;

    var tag = (pet.tags && pet.tags[0]) || pet.speciesLabel;

    return window.Dom.h`
      <article class="pet-card" style="--i:${index}">
        <a class="pet-card__media" href="#/mascotas/${pet.id}"
           data-nav="${pet.id}"
           aria-label="${pet.name}, ${pet.breed} — ver ficha completa de adopción">
          ${window.Media.portrait({
            id: pet.cover,
            name: pet.name,
            alt: pet.name + ', ' + pet.breed + ' en adopción',
            width: opts.imageWidth || 700,
            className: 'pet-card__img',
            sizes: opts.sizes || '(max-width: 640px) 46vw, (max-width: 1080px) 30vw, 260px'
          })}
          <span class="badge badge--glass badge--float">${tag}</span>
        </a>

        <button class="fab pet-card__fav ${favorite ? 'is-active' : ''}"
                type="button"
                data-fav="${pet.id}"
                aria-pressed="${favorite ? 'true' : 'false'}"
                aria-label="${favorite ? 'Quitar ' + pet.name + ' de favoritos' : 'Guardar ' + pet.name + ' en favoritos'}"
                title="${favorite ? 'Quitar de favoritos' : 'Guardar en favoritos'}">
          ${window.Dom.raw(window.Icon.render(favorite ? 'heartSolid' : 'heart'))}
        </button>

        <div class="pet-card__body">
          <h3 class="pet-card__name">
            ${pet.name}
            <span class="sex" title="${pet.sexLabel}">${window.Dom.raw(window.Icon.render(pet.sex === 'hembra' ? 'heart' : 'paw'))}</span>
          </h3>
          <p class="pet-card__breed truncate">${pet.breed}</p>
          <div class="pet-card__meta">
            <span class="pill">${window.Dom.raw(window.Icon.render('cake'))}${pet.ageLabel}</span>
            <span class="pill pill--neutral">${window.Dom.raw(window.Icon.render('scale'))}${pet.weightLabel}</span>
          </div>
        </div>

        <span class="pet-card__cta">
          <span class="btn btn--primary btn--block btn--sm">Conocer más ${window.Dom.raw(window.Icon.render('arrowRight'))}</span>
        </span>
      </article>`;
  }

  /* --- Tarjeta grande para el carrusel de destacados -------------------- */
  function feature(pet, options) {
    var opts = options || {};
    var favorite = window.State.isFavorite(pet.id);
    var short = pet.description ? pet.description.split('. ')[0] + '.' : '';

    return window.Dom.h`
      <article class="feature" style="--i:${opts.index || 0}">
        <a class="feature__media" href="#/mascotas/${pet.id}" data-nav="${pet.id}"
           aria-label="${pet.name} — ver ficha completa">
          ${window.Media.portrait({
            id: pet.cover,
            name: pet.name,
            alt: pet.name + ', ' + pet.breed,
            width: 800,
            className: 'pet-card__img',
            sizes: '(max-width: 560px) 82vw, (max-width: 1100px) 46vw, 300px'
          })}
          <span class="badge badge--primary badge--float">${window.Dom.raw(window.Icon.render('sparkles'))} Destacado</span>
        </a>

        <button class="fab feature__fav ${favorite ? 'is-active' : ''}"
                type="button"
                data-fav="${pet.id}"
                aria-pressed="${favorite ? 'true' : 'false'}"
                aria-label="${favorite ? 'Quitar ' + pet.name + ' de favoritos' : 'Guardar ' + pet.name + ' en favoritos'}">
          ${window.Dom.raw(window.Icon.render(favorite ? 'heartSolid' : 'heart'))}
        </button>

        <a class="feature__body" href="#/mascotas/${pet.id}" data-nav="${pet.id}">
          <h3 class="feature__name">${pet.name}</h3>
          <p class="feature__breed">${pet.breed} · ${pet.speciesLabel}</p>
          <p class="feature__desc clamp-2">${short}</p>
          <div class="feature__foot">
            <span class="pill">${window.Dom.raw(window.Icon.render('cake'))}${pet.ageLabel}</span>
            <span class="link-more">Ver ficha ${window.Dom.raw(window.Icon.render('arrowRight'))}</span>
          </div>
        </a>
      </article>`;
  }

  /* --- Fila compacta (favoritos, adopciones, recomendaciones) ----------- */
  function mini(pet, options) {
    var opts = options || {};
    var right = opts.right || window.Dom.h`<span class="badge badge--primary">${pet.speciesLabel}</span>`;

    return window.Dom.h`
      <a class="mini" href="#/mascotas/${pet.id}" data-nav="${pet.id}">
        <span class="mini__thumb" style="position:relative;overflow:hidden;display:block">
          ${window.Media.portrait({
            id: pet.cover,
            name: pet.name,
            alt: pet.name,
            width: 200,
            className: 'mini__thumb',
            eager: false
          })}
        </span>
        <span class="mini__text">
          <strong>${pet.name}</strong>
          <small>${pet.breed} · ${pet.ageLabel}</small>
        </span>
        <span class="mini__action">${window.Dom.raw(right)}</span>
      </a>`;
  }

  /* --- Rejilla de tarjetas con contador de resultados ------------------- */
  function grid(list, options) {
    var opts = options || {};
    if (!list.length) { return emptyState(opts.emptyOptions || {}); }

    var cards = list.map(function (pet, index) {
      return card(pet, { index: index, imageWidth: opts.imageWidth });
    }).join('');

    return window.Dom.h`<div class="pet-grid">${window.Dom.raw(cards)}</div>`;
  }

  /* --- Estado vacío reutilizable ---------------------------------------- */
  function emptyState(options) {
    var opts = options || {};
    return window.Dom.h`
      <div class="empty">
        <span class="empty__art">${window.Dom.raw(window.Icon.render(opts.icon || 'empty'))}</span>
        <h3>${opts.title || 'No encontramos mascotas'}</h3>
        <p>${opts.message || 'Prueba con otros filtros o revisa el catálogo completo: siempre hay alguien esperando.'}</p>
        <div class="empty__actions">
          <button class="btn btn--primary" type="button" data-action="${opts.action || 'clear-filters'}">
            ${window.Dom.raw(window.Icon.render('filter'))} ${opts.actionLabel || 'Limpiar filtros'}
          </button>
        </div>
      </div>`;
  }

  window.PetCard = {
    card: card,
    feature: feature,
    mini: mini,
    grid: grid,
    emptyState: emptyState
  };
})();

/* ==== js/ui/tabbar.js ==== */
/* ============================================================================
 * tabbar.js + topbar.js — Navegación compartida (se exportan juntas porque
 * ambas leen la misma definición de secciones y el mismo contador).
 * ========================================================================== */
(function () {
  'use strict';

  /* Secciones de la aplicación. El icono de "Solicitudes" es un portapapeles
   * (documento) en lugar de una chispa: comunica mejor "trámite enviado". */
  var SECTIONS = [
    { path: '/', label: 'Inicio', icon: 'home' },
    { path: '/mascotas', label: 'Mascotas', icon: 'heart' },
    { path: '/solicitudes', label: 'Solicitudes', icon: 'clipboard', badge: 'requests' },
    { path: '/cuenta', label: 'Cuenta', icon: 'user' }
  ];

  function badgeValue(kind) {
    if (kind === 'requests') {
      var count = window.State.activeRequestCount();
      return count > 0 ? String(count) : '';
    }
    return '';
  }

  /* --- Barra inferior (móvil) -------------------------------------------- */
  function renderTabbar() {
    var active = window.Router.current();

    var items = SECTIONS.map(function (section) {
      var isActive = section.path === '/' ? active === '/' : window.Router.isWithin(section.path);
      var badge = badgeValue(section.badge);

      return window.Dom.h`
        <a class="tab ${isActive ? 'is-active' : ''}"
           href="#${section.path}"
           data-tab="${section.path}"
           ${isActive ? window.Dom.raw('aria-current="page"') : ''}>
          ${window.Dom.raw(window.Icon.render(isActive && section.icon === 'heart' ? 'heartSolid' : section.icon))}
          <span>${section.label}</span>
          ${badge ? window.Dom.raw('<span class="tab__badge" data-badge="requests">' + badge + '</span>') : ''}
        </a>`;
    }).join('');

    var bar = document.getElementById('tabbar');
    if (bar) {
      bar.innerHTML = window.Dom.h`<div class="tabbar__inner">${window.Dom.raw(items)}</div>`;
    }
  }

  /* --- Navegación superior (tablet y escritorio) ------------------------ */
  function renderTopnav() {
    var active = window.Router.current();

    var links = SECTIONS.map(function (section) {
      var isActive = section.path === '/' ? active === '/' : window.Router.isWithin(section.path);
      var badge = badgeValue(section.badge);

      return window.Dom.h`
        <a class="topnav__link ${isActive ? 'is-active' : ''}"
           href="#${section.path}"
           data-topnav="${section.path}"
           ${isActive ? window.Dom.raw('aria-current="page"') : ''}>
          ${window.Dom.raw(window.Icon.render(section.icon))}
          <span>${section.label}</span>
          ${badge ? window.Dom.raw('<span class="topnav__badge" data-badge="requests">' + badge + '</span>') : ''}
        </a>`;
    }).join('');

    var nav = document.getElementById('topnav');
    if (nav) { nav.innerHTML = links; }
  }

  /* Refresca el contador de solicitudes sin repintar toda la navegación */
  function refreshBadges() {
    var value = badgeValue('requests');
    window.Dom.qsa('[data-badge="requests"]').forEach(function (node) {
      if (value) {
        node.textContent = value;
        node.hidden = false;
      } else {
        node.remove();
      }
    });
  }

  /* Refresca el avatar del encabezado cuando cambia el perfil */
  function refreshAvatar() {
    var user = window.State.get().user;
    var node = document.getElementById('topbar-avatar');
    if (!node) { return; }
    if (user && user.avatar) {
      node.innerHTML = window.Dom.h`<img src="${user.avatar}" alt="">`;
    } else {
      node.textContent = window.Format.initials(user ? user.name : '');
    }
    node.setAttribute('aria-label', user ? 'Cuenta de ' + user.name : 'Mi cuenta');
  }

  function renderAll() {
    renderTopnav();
    renderTabbar();
    refreshAvatar();
  }

  window.Nav = {
    sections: SECTIONS,
    render: renderAll,
    renderTopnav: renderTopnav,
    renderTabbar: renderTabbar,
    refreshBadges: refreshBadges,
    refreshAvatar: refreshAvatar
  };
})();

/* ==== js/ui/topbar.js ==== */
/* ============================================================================
 * topbar.js — Comportamiento del encabezado superior
 * ----------------------------------------------------------------------------
 * La navegación de escritorio se renderiza desde `Nav` (ver tabbar.js); aquí
 * solo vive el estado visual del encabezado: sombra al hacer scroll, botón de
 * tema y sincronización de su icono.
 * ========================================================================== */
(function () {
  'use strict';

  var topbar = null;

  function updateScrolledState() {
    if (!topbar) { return; }
    topbar.classList.toggle('is-scrolled', window.scrollY > 8);
  }

  function updateThemeButton() {
    var button = document.getElementById('btn-theme');
    if (!button) { return; }
    var dark = window.State.get().theme === 'dark';
    button.innerHTML = window.Icon.render(dark ? 'sun' : 'moon');
    button.setAttribute('aria-label', dark ? 'Activar tema claro' : 'Activar tema oscuro');
    button.setAttribute('title', dark ? 'Tema claro' : 'Tema oscuro');
    button.setAttribute('aria-pressed', dark ? 'true' : 'false');
  }

  function init() {
    topbar = document.getElementById('topbar');
    var button = document.getElementById('btn-theme');

    if (button) {
      button.addEventListener('click', function () {
        var theme = window.State.toggleTheme();
        window.Toast.show(theme === 'dark' ? 'Tema oscuro activado' : 'Tema claro activado', {
          variant: 'info',
          duration: 1800
        });
      });
    }

    window.addEventListener('scroll', updateScrolledState, { passive: true });
    updateScrolledState();
    updateThemeButton();
  }

  window.Topbar = {
    init: init,
    updateScrolledState: updateScrolledState,
    updateThemeButton: updateThemeButton
  };
})();

/* ==== js/features/adoption-form.js ==== */
/* ============================================================================
 * adoption-form.js — Flujo de solicitud de adopción en 3 pasos
 * ----------------------------------------------------------------------------
 * Paso 1 · Datos de contacto (prellenados con el perfil, editables)
 * Paso 2 · Tu hogar y tu experiencia (preguntas que los refugios valoran)
 * Paso 3 · Mensaje para el refugio + resumen y confirmación
 *
 * Incluye validación en español, navegación con teclado, bloqueo del botón de
 * envío mientras se procesa y confirmación con folio de seguimiento.
 * ========================================================================== */
(function () {
  'use strict';

  var TOTAL_STEPS = 3;

  /* --------------------------------------------------------------------------
   * Estado local del formulario (se reinicia en cada apertura)
   * ------------------------------------------------------------------------ */
  function buildDraft() {
    var user = window.State.get().user;
    return {
      step: 1,
      applicant: {
        name: user.name || '',
        email: user.email || '',
        phone: user.phone || '',
        city: user.city || ''
      },
      answers: {
        housing: '',
        companions: [],
        experience: '',
        outdoor: '',
        aloneHours: '4'
      },
      message: '',
      acceptTerms: false
    };
  }

  /* Validaciones por paso: devuelven un objeto { campo: mensaje } */
  function validateStep(step, draft) {
    var errors = {};

    if (step === 1) {
      if (!draft.applicant.name || draft.applicant.name.trim().length < 3) {
        errors.name = 'Escribe tu nombre completo.';
      }
      if (!window.Format.isEmail(draft.applicant.email)) {
        errors.email = 'Necesitamos un correo válido para avisarte del estado.';
      }
      if (!window.Format.isPhone(draft.applicant.phone)) {
        errors.phone = 'Escribe un teléfono de contacto (al menos 9 dígitos).';
      }
      if (!draft.applicant.city || draft.applicant.city.trim().length < 2) {
        errors.city = 'Indica tu ciudad para valorar la distancia al refugio.';
      }
    }

    if (step === 2) {
      if (!draft.answers.housing) {
        errors.housing = 'Selecciona dónde vivirías con la mascota.';
      }
      if (!draft.answers.companions.length) {
        errors.companions = 'Cuéntanos con quién compartirías el hogar.';
      }
      if (!draft.answers.experience) {
        errors.experience = 'Indica tu experiencia previa con animales.';
      }
      if (!draft.answers.outdoor) {
        errors.outdoor = 'Indica cuánto tiempo podría salir la mascota al día.';
      }
    }

    if (step === 3) {
      if (!draft.acceptTerms) {
        errors.acceptTerms = 'Debes aceptar el compromiso de adopción responsable.';
      }
    }

    return errors;
  }

  /* --------------------------------------------------------------------------
   * Plantillas de cada paso
   * ------------------------------------------------------------------------ */
  function stepsBar(step) {
    var labels = ['Contacto', 'Tu hogar', 'Mensaje'];
    var items = labels.map(function (label, index) {
      var state = index + 1 < step ? 'is-done' : (index + 1 === step ? 'is-current' : '');
      return window.Dom.h`
        <div class="steps__item ${state}">
          <span class="steps__bar"><span></span></span>
          <span class="steps__label">${index + 1}. ${label}</span>
        </div>`;
    }).join('');

    return window.Dom.h`<div class="steps" role="group" aria-label="Progreso de la solicitud">${window.Dom.raw(items)}</div>`;
  }

  function optionCards(name, options, selected, type) {
    var inputType = type || 'radio';
    return options.map(function (option) {
      var checked = inputType === 'checkbox'
        ? (selected || []).indexOf(option.value) !== -1
        : selected === option.value;

      return window.Dom.h`
        <label class="option">
          <input type="${inputType}" name="${name}" value="${option.value}" ${checked ? window.Dom.raw('checked') : ''}>
          ${option.icon ? window.Dom.raw(window.Icon.render(option.icon)) : ''}
          <span>${option.label}</span>
          ${option.hint ? window.Dom.raw('<small style="font-weight:500;opacity:.75">' + window.Dom.escape(option.hint) + '</small>') : ''}
        </label>`;
    }).join('');
  }

  var OUTDOOR_OPTIONS = [
    { value: 'poco', label: 'Menos de 1 hora' },
    { value: 'medio', label: '1 a 2 horas' },
    { value: 'mucho', label: 'Más de 2 horas' }
  ];

  function stepOne(draft) {
    var a = draft.applicant;
    return window.Dom.h`
      <form id="adoption-form" novalidate>
        <p class="field__hint" style="margin-bottom:var(--s-4)">
          Usamos estos datos solo para gestionar tu adopción. El refugio te contactará por teléfono o correo.
        </p>

        <div class="field" data-field="name">
          <label class="field__label" for="f-name">Nombre completo <span class="req">*</span></label>
          <input class="input" id="f-name" name="name" type="text" autocomplete="name"
                 placeholder="Ej. Darwin Ramírez" value="${a.name}">
          <span class="field__error">${window.Dom.raw(window.Icon.render('info'))}<span data-error-text></span></span>
        </div>

        <div class="field" data-field="email">
          <label class="field__label" for="f-email">Correo electrónico <span class="req">*</span></label>
          <input class="input" id="f-email" name="email" type="email" autocomplete="email"
                 placeholder="tucorreo@ejemplo.com" value="${a.email}">
          <span class="field__error">${window.Dom.raw(window.Icon.render('info'))}<span data-error-text></span></span>
        </div>

        <div class="field" data-field="phone">
          <label class="field__label" for="f-phone">Teléfono <span class="req">*</span></label>
          <input class="input" id="f-phone" name="phone" type="tel" autocomplete="tel"
                 placeholder="+52 55 0000 0000" value="${a.phone}">
          <span class="field__error">${window.Dom.raw(window.Icon.render('info'))}<span data-error-text></span></span>
        </div>

        <div class="field" data-field="city">
          <label class="field__label" for="f-city">Ciudad <span class="req">*</span></label>
          <input class="input" id="f-city" name="city" type="text" autocomplete="address-level2"
                 placeholder="Ciudad de México" value="${a.city}">
          <span class="field__error">${window.Dom.raw(window.Icon.render('info'))}<span data-error-text></span></span>
        </div>
      </form>`;
  }

  function stepTwo(draft) {
    var answers = draft.answers;
    return window.Dom.h`
      <form id="adoption-form" novalidate>
        <div class="field" data-field="housing">
          <span class="field__label">¿Dónde vivirías con tu nueva mascota? <span class="req">*</span></span>
          <div class="option-grid">${window.Dom.raw(optionCards('housing', window.UserData.HOUSING_OPTIONS, answers.housing))}</div>
          <span class="field__error">${window.Dom.raw(window.Icon.render('info'))}<span data-error-text></span></span>
        </div>

        <div class="field" data-field="companions">
          <span class="field__label">¿Con quién compartes el hogar? <span class="req">*</span></span>
          <p class="field__hint">Puedes elegir varias opciones.</p>
          <div class="option-grid">${window.Dom.raw(optionCards('companions', window.UserData.COMPANIONS_OPTIONS, answers.companions, 'checkbox'))}</div>
          <span class="field__error">${window.Dom.raw(window.Icon.render('info'))}<span data-error-text></span></span>
        </div>

        <div class="field" data-field="experience">
          <span class="field__label">Tu experiencia con animales <span class="req">*</span></span>
          <div class="option-grid option-grid--3">${window.Dom.raw(optionCards('experience', window.UserData.EXPERIENCE_OPTIONS, answers.experience))}</div>
          <span class="field__error">${window.Dom.raw(window.Icon.render('info'))}<span data-error-text></span></span>
        </div>

        <div class="field" data-field="outdoor">
          <span class="field__label">Tiempo de paseo o juego al día <span class="req">*</span></span>
          <div class="option-grid option-grid--3">${window.Dom.raw(optionCards('outdoor', OUTDOOR_OPTIONS, answers.outdoor))}</div>
          <span class="field__error">${window.Dom.raw(window.Icon.render('info'))}<span data-error-text></span></span>
        </div>

        <div class="field" data-field="aloneHours">
          <label class="field__label" for="f-alone">Horas que la mascota estaría sola</label>
          <div class="select-wrap">
            <select class="select" id="f-alone" name="aloneHours">
              <option value="2" ${answers.aloneHours === '2' ? window.Dom.raw('selected') : ''}>Menos de 2 horas</option>
              <option value="4" ${answers.aloneHours === '4' ? window.Dom.raw('selected') : ''}>Entre 2 y 5 horas</option>
              <option value="7" ${answers.aloneHours === '7' ? window.Dom.raw('selected') : ''}>Entre 5 y 8 horas</option>
              <option value="10" ${answers.aloneHours === '10' ? window.Dom.raw('selected') : ''}>Más de 8 horas</option>
            </select>
          </div>
        </div>
      </form>`;
  }

  function summaryRow(label, value) {
    if (!value) { return ''; }
    return window.Dom.h`
      <div class="row between" style="gap:var(--s-4);padding:6px 0;border-bottom:1px dashed var(--c-border)">
        <span style="font-size:var(--fs-sm);color:var(--c-text-mute)">${label}</span>
        <strong style="font-size:var(--fs-sm);text-align:right">${value}</strong>
      </div>`;
  }

  function labelFor(options, value) {
    var found = options.filter(function (option) { return option.value === value; })[0];
    return found ? found.label : '';
  }

  function stepThree(draft, pet) {
    var answers = draft.answers;
    var companions = answers.companions.map(function (value) {
      return labelFor(window.UserData.COMPANIONS_OPTIONS, value);
    }).join(', ');

    return window.Dom.h`
      <form id="adoption-form" novalidate>
        <div class="field">
          <label class="field__label" for="f-message">Mensaje para el refugio</label>
          <p class="field__hint">Cuéntales por qué quieres adoptar a ${pet.name}. Un mensaje sincero ayuda mucho en la valoración.</p>
          <textarea class="textarea" id="f-message" name="message" maxlength="600"
                    placeholder="Ej. Vivo con mi pareja en un departamento con parque cerca. Buscamos un compañero tranquilo…">${draft.message}</textarea>
          <span class="field__hint"><span id="message-count">0</span>/600 caracteres</span>
        </div>

        <div class="block" style="background:var(--c-surface-2);box-shadow:none">
          <h3 class="block__title">${window.Dom.raw(window.Icon.render('clipboard'))} Resumen de tu solicitud</h3>
          ${window.Dom.raw([
            summaryRow('Mascota', pet.name + ' · ' + pet.breed),
            summaryRow('Refugio', pet.shelter ? pet.shelter.name : '—'),
            summaryRow('Contacto', draft.applicant.name + ' · ' + draft.applicant.email),
            summaryRow('Teléfono', draft.applicant.phone),
            summaryRow('Ciudad', draft.applicant.city),
            summaryRow('Vivienda', labelFor(window.UserData.HOUSING_OPTIONS, answers.housing)),
            summaryRow('Convivencia', companions),
            summaryRow('Experiencia', labelFor(window.UserData.EXPERIENCE_OPTIONS, answers.experience)),
            summaryRow('Tiempo de juego', labelFor(OUTDOOR_OPTIONS, answers.outdoor)),
            summaryRow('Horas solo', answers.aloneHours ? answers.aloneHours + ' h' : '')
          ].join(''))}
        </div>

        <div class="field" data-field="acceptTerms" style="margin-top:var(--s-4)">
          <label class="option" style="flex-direction:row;align-items:flex-start;text-align:left;gap:var(--s-3)">
            <input type="checkbox" name="acceptTerms" ${draft.acceptTerms ? window.Dom.raw('checked') : ''}>
            <span style="font-weight:500;font-size:var(--fs-sm);line-height:1.5">
              Me comprometo a cuidar, esterilizar y mantener al día la salud de la mascota,
              y acepto el seguimiento del refugio durante el primer año.
            </span>
          </label>
          <span class="field__error">${window.Dom.raw(window.Icon.render('info'))}<span data-error-text></span></span>
        </div>
      </form>`;
  }

  /* --------------------------------------------------------------------------
   * Confirmación final
   * ------------------------------------------------------------------------ */
  function successView(pet, request) {
    return window.Dom.h`
      <div class="text-center" style="padding:var(--s-2) 0">
        <span class="empty__art" style="margin:0 auto var(--s-4);background:var(--c-success-soft);color:var(--c-success)">
          ${window.Dom.raw(window.Icon.render('checkCircle'))}
        </span>
        <h3 style="font-size:var(--fs-xl)">¡Solicitud enviada!</h3>
        <p style="margin-top:var(--s-2)">
          Tu solicitud para adoptar a <strong>${pet.name}</strong> ya está con
          ${pet.shelter ? pet.shelter.name : 'el refugio'}. Recibirás novedades por correo.
        </p>
        <p class="pill" style="margin-top:var(--s-4)">Folio ${request.id.toUpperCase()}</p>

        <div class="steps" style="margin-top:var(--s-5);text-align:left">
          <div class="steps__item is-current">
            <span class="steps__bar"><span></span></span>
            <span class="steps__label">1. Recibida</span>
          </div>
          <div class="steps__item">
            <span class="steps__bar"><span></span></span>
            <span class="steps__label">2. En revisión</span>
          </div>
          <div class="steps__item">
            <span class="steps__bar"><span></span></span>
            <span class="steps__label">3. Entrevista</span>
          </div>
        </div>

        <div class="empty__actions" style="margin-top:var(--s-5)">
          <button class="btn btn--primary" type="button" data-go-requests>
            ${window.Dom.raw(window.Icon.render('clipboard'))} Ver mis solicitudes
          </button>
          <a class="btn btn--ghost" href="#/mascotas">Seguir explorando</a>
        </div>
      </div>`;
  }

  /* --------------------------------------------------------------------------
   * Apertura del flujo completo
   * ------------------------------------------------------------------------ */
  function open(pet) {
    if (!pet) { return null; }
    var draft = buildDraft();
    var submitting = false;

    function bodyFor(step) {
      if (step === 1) { return stepsBar(1) + stepOne(draft); }
      if (step === 2) { return stepsBar(2) + stepTwo(draft); }
      return stepsBar(3) + stepThree(draft, pet);
    }

    function footerFor(step) {
      var backButton = step > 1
        ? window.Dom.h`<button class="btn btn--ghost" type="button" data-step="back">
             ${window.Dom.raw(window.Icon.render('chevronLeft'))} Atrás
           </button>`
        : window.Dom.h`<button class="btn btn--ghost" type="button" data-modal-close>Cancelar</button>`;

      var nextButton = step < TOTAL_STEPS
        ? window.Dom.h`<button class="btn btn--primary grow" type="button" data-step="next">
             Continuar ${window.Dom.raw(window.Icon.render('arrowRight'))}
           </button>`
        : window.Dom.h`<button class="btn btn--primary grow" type="button" data-step="submit">
             ${window.Dom.raw(window.Icon.render('heartSolid'))} Enviar solicitud
           </button>`;

      return backButton + nextButton;
    }

    var modal = window.Modal.open({
      title: 'Solicitar adopción',
      subtitle: pet.name + ' · ' + pet.breed + (pet.shelter ? ' · ' + pet.shelter.name : ''),
      body: bodyFor(1),
      footer: footerFor(1),
      initialFocus: '#f-name',
      onMount: function (dialog, close) {
        var body = window.Dom.qs('.modal__body', dialog);
        var foot = window.Dom.qs('.modal__foot', dialog);

        /* --- Lectura de datos del formulario ---------------------------- */
        function collect() {
          var form = window.Dom.qs('#adoption-form', dialog);
          if (!form) { return; }

          if (draft.step === 1) {
            draft.applicant.name = form.querySelector('[name="name"]').value.trim();
            draft.applicant.email = form.querySelector('[name="email"]').value.trim();
            draft.applicant.phone = form.querySelector('[name="phone"]').value.trim();
            draft.applicant.city = form.querySelector('[name="city"]').value.trim();
          }

          if (draft.step === 2) {
            var housing = form.querySelector('[name="housing"]:checked');
            draft.answers.housing = housing ? housing.value : '';
            draft.answers.companions = window.Dom.qsa('[name="companions"]:checked', form).map(function (input) { return input.value; });
            var experience = form.querySelector('[name="experience"]:checked');
            draft.answers.experience = experience ? experience.value : '';
            var outdoor = form.querySelector('[name="outdoor"]:checked');
            draft.answers.outdoor = outdoor ? outdoor.value : '';
            var alone = form.querySelector('[name="aloneHours"]');
            draft.answers.aloneHours = alone ? alone.value : '4';
          }

          if (draft.step === 3) {
            var message = form.querySelector('[name="message"]');
            draft.message = message ? message.value.trim() : '';
            var terms = form.querySelector('[name="acceptTerms"]');
            draft.acceptTerms = !!(terms && terms.checked);
          }
        }

        /* --- Pintado de errores ---------------------------------------- */
        function paintErrors(errors) {
          window.Dom.qsa('.field', dialog).forEach(function (field) {
            field.classList.remove('has-error');
          });
          var firstKey = null;
          Object.keys(errors).forEach(function (key) {
            if (!firstKey) { firstKey = key; }
            var field = window.Dom.qs('[data-field="' + key + '"]', dialog);
            if (!field) { return; }
            field.classList.add('has-error');
            var text = window.Dom.qs('[data-error-text]', field);
            if (text) { text.textContent = errors[key]; }
          });

          if (firstKey) {
            var firstField = window.Dom.qs('[data-field="' + firstKey + '"]', dialog);
            var focusTarget = firstField ? firstField.querySelector('input, select, textarea') : null;
            window.A11y.focus(focusTarget || firstField);
            window.A11y.announce('Revisa los campos marcados en rojo.');
          }
        }

        /* --- Repintado del modal en cada paso -------------------------- */
        function renderStep() {
          body.innerHTML = bodyFor(draft.step);
          foot.innerHTML = footerFor(draft.step);
          window.Icon.inject(dialog);
          body.scrollTop = 0;

          var message = window.Dom.qs('#f-message', dialog);
          var counter = window.Dom.qs('#message-count', dialog);
          if (message && counter) {
            counter.textContent = String(message.value.length);
            message.addEventListener('input', function () {
              counter.textContent = String(message.value.length);
            });
          }

          var firstInput = body.querySelector('input, select, textarea');
          if (firstInput && draft.step !== 1) { window.A11y.focus(firstInput); }
        }

        /* --- Guardado -------------------------------------------------- */
        function submit() {
          if (submitting) { return; }
          submitting = true;

          var submitButton = window.Dom.qs('[data-step="submit"]', foot);
          if (submitButton) {
            submitButton.setAttribute('aria-disabled', 'true');
            submitButton.innerHTML = window.Dom.h`
              <span style="display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.45);
                           border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite"></span>
              Enviando…`;
          }

          /* Espacio para una llamada real: Repository.createRequest(...) */
          window.setTimeout(function () {
            var request = window.State.createRequest(pet.id, {
              message: draft.message,
              applicant: Object.assign({}, draft.applicant),
              answers: Object.assign({}, draft.answers)
            });

            /* Actualizamos el perfil con los datos confirmados */
            window.State.updateUser({
              name: draft.applicant.name,
              email: draft.applicant.email,
              phone: draft.applicant.phone,
              city: draft.applicant.city
            });

            if (window.App) { window.App.refreshNavigation(); }

            body.innerHTML = successView(pet, request);
            foot.innerHTML = window.Dom.h`
              <button class="btn btn--ghost btn--block" type="button" data-modal-close>Cerrar</button>`;
            window.Icon.inject(dialog);

            window.Toast.success(
              'Tu solicitud para ' + pet.name + ' quedó registrada',
              '¡Solicitud enviada!'
            );

            var goRequests = window.Dom.qs('[data-go-requests]', dialog);
            if (goRequests) {
              goRequests.addEventListener('click', function () {
                close();
                window.Router.navigate('/solicitudes');
              });
            }
            submitting = false;
          }, 620);
        }

        /* --- Interacción ---------------------------------------------- */
        dialog.addEventListener('click', function (event) {
          var next = event.target.closest('[data-step="next"]');
          var back = event.target.closest('[data-step="back"]');
          var send = event.target.closest('[data-step="submit"]');
          if (!next && !back && !send) { return; }

          collect();

          if (back) {
            draft.step = Math.max(1, draft.step - 1);
            renderStep();
            return;
          }

          if (next) {
            var errors = validateStep(draft.step, draft);
            if (Object.keys(errors).length) { paintErrors(errors); return; }
            draft.step = Math.min(TOTAL_STEPS, draft.step + 1);
            renderStep();
            return;
          }

          if (send) {
            var finalErrors = validateStep(3, draft);
            if (Object.keys(finalErrors).length) { paintErrors(finalErrors); return; }
            submit();
          }
        });

        /* La tecla Enter avanza de paso en lugar de enviar prematuramente */
        dialog.addEventListener('keydown', function (event) {
          if (event.key === 'Enter' && event.target.tagName !== 'TEXTAREA') {
            if (draft.step < TOTAL_STEPS) {
              event.preventDefault();
              var nextButton = window.Dom.qs('[data-step="next"]', foot);
              if (nextButton) { nextButton.click(); }
            }
          }
        });

        /* Contador inicial del mensaje */
        var initialMessage = window.Dom.qs('#f-message', dialog);
        var initialCounter = window.Dom.qs('#message-count', dialog);
        if (initialMessage && initialCounter) { initialCounter.textContent = String(initialMessage.value.length); }
      }
    });

    return modal;
  }

  window.AdoptionForm = {
    open: open,
    validateStep: validateStep,
    buildDraft: buildDraft
  };
})();

/* ==== js/pages/home.js ==== */
/* ============================================================================
 * home.js — Página de Inicio
 * ----------------------------------------------------------------------------
 * Encabezado personalizado, buscador con sugerencias, filtros rápidos,
 * carrusel de destacados, meta de adopciones (progreso mensual), catálogo
 * resumido y explicación del proceso en tres pasos.
 * ========================================================================== */
(function () {
  'use strict';

  /* Saludo según la hora del dispositivo: personalización real, no texto fijo */
  function greeting() {
    var hour = new Date().getHours();
    if (hour < 6) { return 'Buenas noches'; }
    if (hour < 13) { return 'Buenos días'; }
    if (hour < 20) { return 'Buenas tardes'; }
    return 'Buenas noches';
  }

  /* --------------------------------------------------------------------------
   * Bloques de la vista
   * ------------------------------------------------------------------------ */
  function hero(user, stats) {
    return window.Dom.h`
      <section class="hero reveal" style="--i:0">
        <span class="hero__paw hero__paw--a">${window.Dom.raw(window.Icon.render('pawSolid'))}</span>
        <span class="hero__paw hero__paw--b">${window.Dom.raw(window.Icon.render('pawSolid'))}</span>
        <span class="hero__paw hero__paw--c">${window.Dom.raw(window.Icon.render('pawSolid'))}</span>

        <div class="hero__top">
          <div class="hero__greet">
            <small>${greeting()} 👋</small>
            <h1>Hola, ${user.name}</h1>
            <p>Encuentra a quien te está esperando</p>
          </div>
          <a class="avatar-btn" href="#/cuenta" aria-label="Ir a mi cuenta">
            <span class="avatar avatar--lg" style="background:rgba(255,255,255,.25);box-shadow:0 0 0 3px rgba(255,255,255,.4)">
              ${user.avatar
                ? window.Dom.raw('<img src="' + user.avatar + '" alt="">')
                : window.Format.initials(user.name)}
            </span>
          </a>
        </div>

        <div class="hero__cta">
          <p><strong>Adoptar cambia dos vidas:</strong> la suya y la tuya. Empieza hoy con una búsqueda.</p>
          <a class="btn btn--ghost" href="#/mascotas">
            ${window.Dom.raw(window.Icon.render('search'))} Explorar mascotas
          </a>
        </div>

        <div class="hero__stats">
          <div class="hero__stat">
            <strong>${stats.available}</strong>
            <span>en adopción</span>
          </div>
          <div class="hero__stat">
            <strong>${stats.shelters}</strong>
            <span>refugios aliados</span>
          </div>
          <div class="hero__stat">
            <strong>${stats.saved}</strong>
            <span>guardadas por ti</span>
          </div>
        </div>
      </section>`;
  }

  function searchBlock(filters) {
    return window.Dom.h`
      <div class="home-search reveal" style="--i:1">
        ${window.Dom.raw(window.Cards.searchBox({
          value: filters.search,
          placeholder: 'Buscar por nombre, raza o refugio'
        }))}
      </div>`;
  }

  function impactBlock(pets, requests) {
    var goal = 12;
    var adopted = requests.filter(function (request) { return request.status === 'aprobada'; }).length + 18;
    var percent = Math.min(100, Math.round((adopted / (goal + 18)) * 100));

    return window.Dom.h`
      <section class="impact reveal" style="--i:2" aria-label="Meta mensual de adopciones">
        <div class="impact__row">
          <span class="impact__icon">${window.Dom.raw(window.Icon.render('heartSolid'))}</span>
          <div class="grow">
            <h2 style="font-size:var(--fs-lg)">Historias felices este mes</h2>
            <p style="font-size:var(--fs-sm)">Cada adopción libera un lugar en el refugio para otro rescate.</p>
          </div>
          <strong style="font-family:var(--f-display);font-size:var(--fs-xl);color:var(--c-primary-700)">${adopted}</strong>
        </div>
        <div>
          <div class="impact__bar" role="progressbar" aria-valuenow="${percent}" aria-valuemin="0" aria-valuemax="100">
            <span style="width:${percent}%"></span>
          </div>
          <div class="impact__legend">
            <span>${percent}% de la meta mensual</span>
            <span>${pets.length} mascotas publicadas</span>
          </div>
        </div>
      </section>`;
  }

  function howItWorks() {
    var steps = [
      { icon: 'search', title: '1. Explora y filtra', text: 'Revisa fichas completas con salud verificada, edad, tamaño y refugio de origen.' },
      { icon: 'clipboard', title: '2. Envía tu solicitud', text: 'Un formulario corto de tres pasos. El refugio recibe tu perfil al instante.' },
      { icon: 'heartHand', title: '3. Conoce y adopta', text: 'Coordinan una visita, firman el compromiso y tu nuevo compañero llega a casa.' }
    ];

    var html = steps.map(function (step, index) {
      return window.Dom.h`
        <article class="how__step reveal" style="--i:${index + 3}">
          <span class="how__num">0${index + 1}</span>
          <span class="how__icon">${window.Dom.raw(window.Icon.render(step.icon))}</span>
          <h3>${step.title}</h3>
          <p>${step.text}</p>
        </article>`;
    }).join('');

    return window.Dom.h`
      <section style="margin-bottom:var(--s-10)">
        <div class="section-head">
          <div class="section-head__title">
            ${window.Dom.raw(window.Icon.render('info'))}
            <div>
              <h2>Cómo funciona</h2>
              <p>Adopción responsable en tres pasos claros</p>
            </div>
          </div>
        </div>
        <div class="how">${window.Dom.raw(html)}</div>
      </section>`;
  }

  function appBanner() {
    return window.Dom.h`
      <section class="app-banner reveal" style="--i:7">
        <span class="app-banner__icon">${window.Dom.raw(window.Icon.render('pawSolid'))}</span>
        <div class="grow">
          <strong>Descarga la app de Adopta</strong>
          <p>Recibe avisos cuando aparezca una mascota compatible contigo.</p>
        </div>
        <button class="btn btn--sm btn--soft" type="button" data-action="coming-soon" data-label="La app móvil">
          ${window.Dom.raw(window.Icon.render('external'))} Android
        </button>
      </section>`;
  }

  /* --------------------------------------------------------------------------
   * Vista
   * ------------------------------------------------------------------------ */
  function view() {
    var state = window.State.get();
    var user = state.user;
    var filters = state.filters;

    /* La vista se entrega con esqueletos: los datos llegan en `mount()`, cuando
       el HTML ya forma parte del documento (ver nota en pages/pets.js). */
    return window.Dom.h`
      <div id="home-root">
        ${window.Dom.raw(hero(user, {
          available: window.Repository.speciesCounts().todos,
          shelters: window.Repository.listShelters().length,
          saved: state.favorites.length
        }))}
        ${window.Dom.raw(searchBlock(filters))}
        ${window.Dom.raw(impactBlock(window.Repository._sync.listPets({}), state.requests))}
        <div id="home-featured"></div>
        <div id="home-catalog">
          <div class="section-head">
            <div class="section-head__title">
              ${window.Dom.raw(window.Icon.render('pawSolid'))}
              <div>
                <h2>Para adoptar</h2>
                <p>Cargando mascotas disponibles…</p>
              </div>
            </div>
          </div>
          ${window.Dom.raw(window.Dom.skeletonGrid(4))}
        </div>
        ${window.Dom.raw(howItWorks())}
        ${window.Dom.raw(appBanner())}
      </div>`;
  }

  /* Carga inicial de destacados y catálogo resumido */
  function loadInitial() {
    var featuredRoot = document.getElementById('home-featured');
    var catalogRoot = document.getElementById('home-catalog');
    if (!featuredRoot || !catalogRoot) { return Promise.resolve(); }

    var filters = window.State.get().filters;

    return Promise.all([
      window.Repository.featuredPets(6),
      window.Repository.listPets(filters)
    ]).then(function (results) {
      /* La vista pudo haber cambiado mientras cargaban los datos */
      if (!document.getElementById('home-featured') || !document.getElementById('home-catalog')) { return; }

      var featured = results[0];
      var list = results[1];

      featuredRoot.innerHTML = featuredSection(featured);
      catalogRoot.innerHTML = catalogSection(list, window.State.get().filters);

      window.Icon.inject(featuredRoot);
      window.Icon.inject(catalogRoot);
      window.Media.hydrateImages(featuredRoot);
      window.Media.hydrateImages(catalogRoot);
      window.Media.preload(featured.map(function (pet) { return pet.cover; }), 600);
    }).catch(function (error) {
      if (window.console) { window.console.error('[Adopta] Inicio: error al cargar datos', error); }
      if (catalogRoot) { catalogRoot.innerHTML = window.PetCard.emptyState({ icon: 'info', title: 'No pudimos cargar las mascotas' }); }
    });
  }

  function featuredSection(pets) {
    if (!pets.length) { return ''; }

    var cards = pets.map(function (pet, index) {
      return window.PetCard.feature(pet, { index: index });
    }).join('');

    return window.Dom.h`
      <section style="margin-bottom:var(--s-10)">
        <div class="section-head">
          <div class="section-head__title">
            ${window.Dom.raw(window.Icon.render('sparkles'))}
            <div>
              <h2>Destacados</h2>
              <p>Con salud verificada y listos para conocer a su familia</p>
            </div>
          </div>
          <a class="link-more" href="#/mascotas">
            Ver todos ${window.Dom.raw(window.Icon.render('arrowRight'))}
          </a>
        </div>
        <div class="carousel" role="list" aria-label="Mascotas destacadas">
          ${window.Dom.raw(cards)}
        </div>
      </section>`;
  }

  function catalogSection(pets, filters) {
    var counts = window.Repository.speciesCounts();
    var shown = pets.slice(0, 8);

    return window.Dom.h`
      <section style="margin-bottom:var(--s-10)">
        <div id="home-section-head" class="section-head">
          <div class="section-head__title">
            ${window.Dom.raw(window.Icon.render('pawSolid'))}
            <div>
              <h2>Para adoptar</h2>
              <p id="home-result-count">${window.Format.plural(pets.length, 'mascota')} disponible${pets.length === 1 ? '' : 's'}</p>
            </div>
          </div>
          <a class="link-more" href="#/mascotas">
            Catálogo completo ${window.Dom.raw(window.Icon.render('arrowRight'))}
          </a>
        </div>

        <div style="margin-bottom:var(--s-5)">
          ${window.Dom.raw(window.Cards.speciesChips(counts, filters.species))}
        </div>

        <div id="home-grid">
          ${window.Dom.raw(window.PetCard.grid(shown, {
            emptyOptions: {
              title: 'Sin resultados en destacados',
              message: 'Prueba con otra categoría o revisa el catálogo completo.'
            }
          }))}
        </div>

        ${pets.length > 8 ? window.Dom.raw(window.Dom.h`
          <div class="text-center" style="margin-top:var(--s-6)">
            <a class="btn btn--ghost" href="#/mascotas">
              Ver las ${pets.length} mascotas ${window.Dom.raw(window.Icon.render('arrowRight'))}
            </a>
          </div>`) : ''}
      </section>`;
  }

  /* --------------------------------------------------------------------------
   * Interacción posterior al pintado
   * ------------------------------------------------------------------------ */
  function mount(root) {
    if (!root || !document.getElementById('home-root')) { return; }

    /* Primera carga de datos (el DOM de la vista ya existe) */
    loadInitial();

    function refreshGrid() {
      var gridRoot = document.getElementById('home-grid');
      var countRoot = document.getElementById('home-result-count');
      if (!gridRoot) { return; }

      var filters = window.State.get().filters;
      window.Repository.listPets(filters).then(function (pets) {
        /* La vista pudo haber cambiado mientras se resolvía la consulta */
        if (!document.getElementById('home-grid')) { return; }

        var shown = pets.slice(0, 8);
        gridRoot.innerHTML = window.PetCard.grid(shown, {
          emptyOptions: {
            title: 'No encontramos mascotas con ese filtro',
            message: 'Puedes limpiar los filtros o buscar en todo el catálogo.',
            action: 'clear-filters-home',
            actionLabel: 'Limpiar búsqueda'
          }
        });
        window.Icon.inject(gridRoot);
        window.Media.hydrateImages(gridRoot);

        if (countRoot) {
          countRoot.textContent = window.Format.plural(pets.length, 'mascota') +
            ' disponible' + (pets.length === 1 ? '' : 's');
        }
      }).catch(function (error) {
        if (window.console) { window.console.error('[Adopta] Inicio: error al filtrar', error); }
      });
    }

    /* Búsqueda con retardo (debounce) para no filtrar en cada tecla */
    var timer = null;
    window.Search.wire(root, {
      onInput: function (value) {
        window.clearTimeout(timer);
        timer = window.setTimeout(function () {
          window.State.setFilters({ search: value });
          refreshGrid();
        }, 220);
      },
      onSubmit: function (value) {
        window.clearTimeout(timer);
        if (value && value.length > 1) { window.State.registerSearch(value); }
        window.State.setFilters({ search: value });
        window.Router.navigate('/mascotas');
      }
    });

    /* Filtros por especie */
    root.addEventListener('click', function (event) {
      var chip = event.target.closest('[data-filter-species]');
      if (!chip) { return; }
      var species = chip.getAttribute('data-filter-species');
      window.State.setFilters({ species: species });
      window.Dom.qsa('[data-filter-species]', root).forEach(function (node) {
        var active = node.getAttribute('data-filter-species') === species;
        node.classList.toggle('is-active', active);
        node.setAttribute('aria-pressed', active ? 'true' : 'false');
      });
      refreshGrid();
    });

    /* El grid se repinta cuando cambian los favoritos u otros filtros */
    var unsubscribe = window.State.subscribe(function (state, event) {
      if (!event) { return; }
      if (event.type === 'favorites:toggle') { refreshGrid(); }
      if (event.type === 'demo:reset') { window.Router.resolve(); }
    });

    /* Limpieza al abandonar la vista */
    window.Views.onLeave(function () {
      unsubscribe();
      window.clearTimeout(timer);
    });
  }

  window.Views = window.Views || {};
  window.Views.home = { render: view, mount: mount };
})();

/* ==== js/pages/pets.js ==== */
/* ============================================================================
 * pets.js — Catálogo de mascotas
 * ----------------------------------------------------------------------------
 * Búsqueda combinada con filtros avanzados (tamaño, sexo, edad), ordenación,
 * etiquetas de filtros activos y estados vacíos accionables.
 * ========================================================================== */
(function () {
  'use strict';

  var AGE_OPTIONS = [
    { value: '', label: 'Cualquier edad' },
    { value: 'cachorro', label: 'Cachorro (menos de 1 año)' },
    { value: 'joven', label: 'Joven (1 a 3 años)' },
    { value: 'adulto', label: 'Adulto (3 a 7 años)' },
    { value: 'senior', label: 'Senior (más de 7 años)' }
  ];

  var SORT_OPTIONS = [
    { value: 'recientes', label: 'Más recientes' },
    { value: 'destacados', label: 'Destacados primero' },
    { value: 'nombre', label: 'Nombre (A–Z)' },
    { value: 'edad_asc', label: 'Menor edad primero' },
    { value: 'edad_desc', label: 'Mayor edad primero' }
  ];

  var SIZE_OPTIONS = [
    { value: '', label: 'Todos los tamaños' },
    { value: 'pequeno', label: 'Pequeño (hasta 10 kg)' },
    { value: 'mediano', label: 'Mediano (10 a 20 kg)' },
    { value: 'grande', label: 'Grande (más de 20 kg)' }
  ];

  var SEX_OPTIONS = [
    { value: '', label: 'Ambos sexos' },
    { value: 'hembra', label: 'Hembra' },
    { value: 'macho', label: 'Macho' }
  ];

  function ageOptionLabel(value) {
    var found = AGE_OPTIONS.filter(function (option) { return option.value === value; })[0];
    return found ? found.label : '';
  }

  function selectField(label, name, options, current, hint) {
    var html = options.map(function (option) {
      return window.Dom.h`
        <option value="${option.value}" ${option.value === current ? window.Dom.raw('selected') : ''}>${option.label}</option>`;
    }).join('');

    return window.Dom.h`
      <div class="field">
        <label class="field__label" for="filter-${name}">${label}</label>
        <div class="select-wrap">
          <select class="select" id="filter-${name}" data-filter="${name}">
            ${window.Dom.raw(html)}
          </select>
        </div>
        ${hint ? window.Dom.raw('<span class="field__hint">' + window.Dom.escape(hint) + '</span>') : ''}
      </div>`;
  }

  /* --------------------------------------------------------------------------
   * Bloques
   * ------------------------------------------------------------------------ */
  function header(total, shelters) {
    return window.Dom.h`
      <div class="catalog__head reveal" style="--i:0">
        <div class="catalog__title">
          <h1>Mascotas en adopción</h1>
          <span class="catalog__count" id="catalog-count">${window.Format.plural(total, 'mascota')}</span>
        </div>
        <p style="margin-top:var(--s-2);font-size:var(--fs-md)">
          ${shelters} refugios verificados publican aquí. Todas las fichas incluyen estado de salud y contacto directo.
        </p>
      </div>`;
  }

  function results(pets, filters, counts) {
    var advancedActive = !!(filters.size || filters.sex || filters.age);

    return window.Dom.h`
      <div id="catalog-results">
        <div class="catalog__tools">
          <div class="mobile-tools">
            <button class="chip ${advancedActive ? 'is-active' : ''}" type="button" data-action="toggle-filters"
                    aria-expanded="${advancedActive ? 'true' : 'false'}" aria-controls="catalog-filters">
              ${window.Dom.raw(window.Icon.render('filter'))}
              <span>Filtros${advancedActive ? ' activos' : ''}</span>
            </button>
            <div class="select-wrap grow">
              <select class="select" data-filter="sort" aria-label="Ordenar resultados">
                ${window.Dom.raw(SORT_OPTIONS.map(function (option) {
                  return window.Dom.h`
                    <option value="${option.value}" ${option.value === filters.sort ? window.Dom.raw('selected') : ''}>${option.label}</option>`;
                }).join(''))}
              </select>
            </div>
          </div>

          <div class="catalog__sort" style="display:none" data-desktop-sort>
            <span style="font-size:var(--fs-sm);color:var(--c-text-mute);font-weight:600">Ordenar por</span>
            <div class="select-wrap">
              <select class="select" data-filter="sort" aria-label="Ordenar resultados">
                ${window.Dom.raw(SORT_OPTIONS.map(function (option) {
                  return window.Dom.h`
                    <option value="${option.value}" ${option.value === filters.sort ? window.Dom.raw('selected') : ''}>${option.label}</option>`;
                }).join(''))}
              </select>
            </div>
          </div>
        </div>

        <div id="catalog-filters" ${advancedActive ? '' : 'hidden'}>
          <div class="filters-panel" style="margin-bottom:var(--s-5)">
            ${window.Dom.raw(selectField('Tamaño', 'size', SIZE_OPTIONS, filters.size))}
            ${window.Dom.raw(selectField('Sexo', 'sex', SEX_OPTIONS, filters.sex))}
            ${window.Dom.raw(selectField('Edad', 'age', AGE_OPTIONS, filters.age))}
          </div>
        </div>

        ${window.Dom.raw(window.Cards.activeFilterTags(filters, {
          showAdvanced: true,
          ageLabel: filters.age ? ageOptionLabel(filters.age) : ''
        }))}

        <div id="catalog-grid">
          ${window.Dom.raw(window.PetCard.grid(pets, {
            emptyOptions: {
              title: 'No encontramos mascotas con esos filtros',
              message: 'Prueba ampliar la búsqueda: hay muchos compañeros esperando una familia.',
              action: 'clear-filters',
              actionLabel: 'Limpiar filtros'
            }
          }))}
        </div>
      </div>`;
  }

  /* --------------------------------------------------------------------------
   * Vista
   * ------------------------------------------------------------------------ */
  function view(params) {
    /* Los parámetros de la URL tienen prioridad (permite enlazar a una
       búsqueda concreta desde cualquier parte de la app). */
    if (params && params.query && params.query.especie) {
      window.State.setFilters({ species: params.query.especie });
    }

    var filters = window.State.get().filters;
    var counts = window.Repository.speciesCounts();

    /* La vista devuelve el esqueleto de inmediato. Los datos se cargan en
       `mount()`, que se ejecuta cuando el HTML ya está en el DOM: así nunca se
       consulta un nodo que aún no existe. */
    return window.Dom.h`
      <div id="catalog-root">
        ${window.Dom.raw(header(counts.todos, window.Repository.listShelters().length))}

        <div class="reveal" style="--i:1;margin-bottom:var(--s-5)">
          ${window.Dom.raw(window.Cards.searchBox({ value: filters.search }))}
        </div>

        <div class="reveal" style="--i:2;margin-bottom:var(--s-4)">
          ${window.Dom.raw(window.Cards.speciesChips(counts, filters.species))}
        </div>

        <div id="catalog-body">
          ${window.Dom.raw(window.Dom.skeletonGrid(8))}
        </div>
      </div>`;
  }

  /* La barra de ordenación de escritorio se muestra solo en pantallas grandes */
  function syncDesktopSort() {
    var desktop = window.Dom.qs('[data-desktop-sort]');
    if (!desktop) { return; }
    desktop.style.display = window.matchMedia('(min-width: 768px)').matches ? 'flex' : 'none';
  }

  /* --------------------------------------------------------------------------
   * Montaje e interacción
   * ------------------------------------------------------------------------ */
  function mount(root, params) {
    if (!root || !document.getElementById('catalog-body')) { return; }

    var timer = null;

    function repaint() {
      var filters = window.State.get().filters;

      return window.Repository.listPets(filters).then(function (pets) {
        var body = document.getElementById('catalog-body');
        if (!body) { return; }

        body.innerHTML = results(pets, window.State.get().filters, window.Repository.speciesCounts());
        window.Icon.inject(body);
        window.Media.hydrateImages(body);
        syncDesktopSort();

        /* Mantenemos el buscador sincronizado sin perder el foco */
        var input = window.Dom.qs('[data-search-input]', root);
        if (input && input.value !== filters.search) { input.value = filters.search; }

        var count = document.getElementById('catalog-count');
        if (count) { count.textContent = window.Format.plural(pets.length, 'mascota'); }

        var chipsRoot = window.Dom.qs('.chips', root);
        if (chipsRoot) {
          chipsRoot.outerHTML = window.Cards.speciesChips(window.Repository.speciesCounts(), filters.species);
        }
      }).catch(function (error) {
        if (window.console) { window.console.error('[Adopta] Catálogo: error al pintar', error); }
        var body = document.getElementById('catalog-body');
        if (body) {
          body.innerHTML = window.PetCard.emptyState({
            icon: 'info',
            title: 'No pudimos cargar el catálogo',
            message: 'Recarga la página para intentarlo de nuevo.',
            action: 'clear-filters',
            actionLabel: 'Reintentar'
          });
          window.Icon.inject(body);
        }
      });
    }

    /* --- Buscador --- */
    window.Search.wire(root, {      onInput: function (value) {
        window.clearTimeout(timer);
        timer = window.setTimeout(function () {
          window.State.setFilters({ search: value });
          repaint();
        }, 220);
      },
      onSubmit: function (value) {
        window.clearTimeout(timer);
        if (value && value.length > 1) { window.State.registerSearch(value); }
        window.State.setFilters({ search: value });
        repaint();
      }
    });

    /* --- Un único listener delegado para todos los controles --- */
    function onClick(event) {
      var speciesChip = event.target.closest('[data-filter-species]');
      if (speciesChip) {
        window.State.setFilters({ species: speciesChip.getAttribute('data-filter-species') });
        repaint();
        return;
      }

      var statusRemove = event.target.closest('[data-remove-filter]');
      if (statusRemove) {
        var kind = statusRemove.getAttribute('data-remove-filter');
        var patch = {};
        patch[kind === 'search' ? 'search' : kind] = '';
        window.State.setFilters(patch);
        repaint();
        return;
      }

      var clear = event.target.closest('[data-action="clear-filters"]');
      if (clear) {
        window.State.resetFilters();
        var input = window.Dom.qs('[data-search-input]', root);
        if (input) { input.value = ''; }
        repaint();
        return;
      }

      var toggle = event.target.closest('[data-action="toggle-filters"]');
      if (toggle) {
        var panel = document.getElementById('catalog-filters');
        if (!panel) { return; }
        var open = panel.hasAttribute('hidden');
        if (open) { panel.removeAttribute('hidden'); } else { panel.setAttribute('hidden', ''); }
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        return;
      }
    }

    function onChange(event) {
      var select = event.target.closest('[data-filter]');
      if (!select) { return; }
      var patch = {};
      patch[select.getAttribute('data-filter')] = select.value;
      window.State.setFilters(patch);
      repaint();
    }

    root.addEventListener('click', onClick);
    root.addEventListener('change', onChange);
    root.addEventListener('change', syncDesktopSort);

    /* Al cambiar de tamaño de pantalla se reajusta la barra de ordenación */
    function onResize() { syncDesktopSort(); }
    window.addEventListener('resize', onResize);

    /* Los favoritos marcan tarjetas: basta con refrescar las clases */
    var unsubscribe = window.State.subscribe(function (state, event) {
      if (event && event.type === 'favorites:toggle') {
        var button = window.Dom.qs('[data-fav="' + event.petId + '"]');
        if (button) {
          button.setAttribute('aria-pressed', event.added ? 'true' : 'false');
        }
      }
      if (event && event.type === 'demo:reset') { window.Router.resolve(); }
    });

    window.Views.onLeave(function () {
      root.removeEventListener('click', onClick);
      root.removeEventListener('change', onChange);
      root.removeEventListener('change', syncDesktopSort);
      window.removeEventListener('resize', onResize);
      window.clearTimeout(timer);
      unsubscribe();
    });

    /* Primera carga de datos: el HTML ya está en el DOM en este punto */
    repaint();
  }

  window.Views = window.Views || {};
  window.Views.pets = { render: view, mount: mount };
})();

    /* --- Galería: cambio de foto principal --- */
    function onClick(event) {
      var thumb = event.target.closest('[data-photo]');
      if (thumb && pet) {
        var index = Number(thumb.getAttribute('data-photo'));
        var photo = pet.photos[index];
        var main = document.getElementById('gallery-main-img');
        if (main && photo) {
          main.style.opacity = '0';
          window.setTimeout(function () {
            main.src = window.Media.photoUrl(photo, 1000);
            main.srcset = window.Media.srcset(photo, 1000);
            main.style.opacity = '';
          }, 140);
        }
        window.Dom.qsa('[data-photo]', root).forEach(function (node) {
          node.classList.toggle('is-active', node === thumb);
        });
        return;
      }

      /* --- Compartir: Web Share API con respaldo de copiado --- */
      var share = event.target.closest('[data-action="share"]');
      if (share) {
        var url = window.location.href;
        if (navigator.share) {
          navigator.share({
            title: 'Adopta · ' + (pet ? pet.name : 'Mascota'),
            text: pet ? 'Conoce a ' + pet.name + ', ' + pet.breed + ' en adopción.' : '',

        } else if (navigator.clipboard) {
          navigator.clipboard.writeText(url).then(function () {
            window.Toast.success('Enlace copiado al portapapeles', 'Listo para compartir');
          });
        } else {
          window.Toast.info('Copia el enlace de la barra de direcciones para compartir.');
        }
      }
    }

    root.addEventListener('click', onClick);
    window.Views.onLeave(function () { root.removeEventListener('click', onClick); });

  window.Views['pet-detail'] = { render: view, mount: mount };
