/* ==== js/pages/requests.js ==== */
/* ============================================================================
 * requests.js — Seguimiento de solicitudes de adopción
 * ----------------------------------------------------------------------------
 * Lista todas las solicitudes con su estado, línea de tiempo del proceso, nota
 * del refugio y acciones disponibles (ver ficha, cancelar). Incluye el estado
 * vacío solicitado: "Aún no has enviado ninguna solicitud".
 * ========================================================================== */
(function () {
  'use strict';

  var FILTER_KEY = 'requestsFilter';

  function header(groups) {
    return window.Dom.h`
      <div class="catalog__head reveal" style="--i:0">
        <div class="catalog__title">
          <h1>Mis solicitudes</h1>
          <span class="catalog__count">${window.Format.plural(groups.todas, 'solicitud')}</span>
        </div>
        <p style="margin-top:var(--s-2);font-size:var(--fs-md)">
          Sigue aquí cada paso: desde que el refugio recibe tu solicitud hasta la visita para conocer a tu compañero.
        </p>
      </div>`;
  }

  /* Resumen del proceso con contadores por estado */
  function summary(groups) {
    return window.Dom.h`
      <div class="stats reveal" style="--i:1;margin-bottom:var(--s-6)">
        ${window.Dom.raw(window.Cards.statCard(groups.pendiente, 'Pendientes'))}
        ${window.Dom.raw(window.Cards.statCard(groups.revision, 'En revisión'))}
        ${window.Dom.raw(window.Cards.statCard(groups.aprobada, 'Aprobadas'))}
      </div>`;
  }

  function emptyState(hasAny) {
    if (hasAny) {
      return window.Dom.h`
        <div class="empty">
          <span class="empty__art">${window.Dom.raw(window.Icon.render('filter'))}</span>
          <h3>No hay solicitudes con ese estado</h3>
          <p>Prueba con otro filtro para ver el resto de tu historial.</p>
          <div class="empty__actions">
            <button class="btn btn--ghost" type="button" data-filter-status="todas">
              Ver todas las solicitudes
            </button>
          </div>
        </div>`;
    }

    return window.Dom.h`
      <div class="empty">
        <span class="empty__art">${window.Dom.raw(window.Icon.render('clipboard'))}</span>
        <h3>Aún no has enviado ninguna solicitud</h3>
        <p>
          Cuando encuentres a tu compañero, envía una solicitud desde su ficha y podrás seguir
          aquí todo el proceso: revisión, entrevista y aprobación.
        </p>
        <div class="empty__actions">
          <a class="btn btn--primary" href="#/mascotas">
            ${window.Dom.raw(window.Icon.render('pawSolid'))} Explorar mascotas
          </a>
          <a class="btn btn--ghost" href="#/cuenta">Ver mis favoritos</a>
        </div>
      </div>`;
  }

  function list(requests, allRequests) {
    if (!requests.length) { return emptyState(allRequests.length > 0); }

    return window.Dom.h`
      <div class="req-list">
        ${window.Dom.raw(requests.map(function (request) {
          return window.Cards.requestCard(request);
        }).join(''))}
      </div>`;
  }

  function body(filter) {
    var all = window.State.get().requests;
    var groups = window.State.requestsByStatus();
    var requests = filter === 'todas'
      ? all
      : all.filter(function (request) { return request.status === filter; });

    return window.Dom.h`
      <div id="requests-body">
        ${window.Dom.raw(window.Cards.statusChips(groups, filter))}
        <div style="margin-top:var(--s-5)">
          ${window.Dom.raw(list(requests, all))}
        </div>
      </div>`;
  }

  /* --------------------------------------------------------------------------
   * Vista
   * ------------------------------------------------------------------------ */
  function view() {
    var groups = window.State.requestsByStatus();
    var filter = window.Storage.get(FILTER_KEY, 'todas');
    window.A11y.setTitle('Mis solicitudes');

    return window.Dom.h`
      <div id="requests-root">
        ${window.Dom.raw(header(groups))}
        ${window.Dom.raw(summary(groups))}
        ${window.Dom.raw(body(filter))}
        ${window.Dom.raw(window.Cards.demoNote(
          'Las solicitudes de esta demo viven en tu navegador. Al conectar un backend, este historial se sincronizará con el refugio.',
          'info'
        ))}
      </div>`;
  }

  /* --------------------------------------------------------------------------
   * Montaje
   * ------------------------------------------------------------------------ */
  function mount(root) {
    if (!root) { return; }

    function repaint() {
      var filter = window.Storage.get(FILTER_KEY, 'todas');
      var host = document.getElementById('requests-root');
      if (!host) { return; }
      var groups = window.State.requestsByStatus();
      host.innerHTML = header(groups) + summary(groups) + body(filter) +
        window.Cards.demoNote('Las solicitudes de esta demo viven en tu navegador. Al conectar un backend, este historial se sincronizará con el refugio.', 'info');
      window.Icon.inject(host);
      window.Media.hydrateImages(host);
    }

    function onClick(event) {
      var statusChip = event.target.closest('[data-filter-status]');
      if (statusChip) {
        var status = statusChip.getAttribute('data-filter-status');
        window.Storage.set(FILTER_KEY, status);
        repaint();
        return;
      }

      var cancelButton = event.target.closest('[data-cancel-request]');
      if (cancelButton) {
        var id = cancelButton.getAttribute('data-cancel-request');
        window.Modal.confirm(
          'Al cancelar, el refugio dejará de revisar tu solicitud. Podrás volver a enviarla cuando quieras.',
          { title: '¿Cancelar esta solicitud?', confirmLabel: 'Sí, cancelar', cancelLabel: 'Mantener', danger: true }
        ).then(function (confirmed) {
          if (!confirmed) { return; }
          window.State.cancelRequest(id);
          window.App.refreshNavigation();
          repaint();
          window.Toast.info('La solicitud quedó cancelada', 'Solicitud actualizada');
        });
      }
    }

    root.addEventListener('click', onClick);

    var unsubscribe = window.State.subscribe(function (state, event) {
      if (!event) { return; }
      if (event.type === 'requests:create' || event.type === 'requests:cancel') { repaint(); }
      if (event.type === 'demo:reset') { window.Router.resolve(); }
    });

    window.Views.onLeave(function () {
      root.removeEventListener('click', onClick);
      unsubscribe();
    });
  }

  window.Views = window.Views || {};
  window.Views.requests = { render: view, mount: mount };
})();

/* ==== js/pages/account.js ==== */
/* ============================================================================
 * account.js — Cuenta del adoptante
 * ----------------------------------------------------------------------------
 * Perfil editable (con foto), estadísticas, favoritos, historial de adopciones,
 * preferencias de notificación, gestión de datos locales y cierre de sesión.
 * ========================================================================== */
(function () {
  'use strict';

  /* --------------------------------------------------------------------------
   * Utilidades de perfil
   * ------------------------------------------------------------------------ */

  /* Redimensiona la imagen elegida a 256×256 (recorte centrado) para no llenar
   * localStorage con fotos de varios megas. */
  function resizeAvatar(file) {
    return new Promise(function (resolve, reject) {
      if (!file || !/^image\//.test(file.type)) {
        reject(new Error('El archivo debe ser una imagen.'));
        return;
      }

      var reader = new FileReader();
      reader.onerror = function () { reject(new Error('No pudimos leer la imagen.')); };
      reader.onload = function () {
        var image = new Image();
        image.onerror = function () { reject(new Error('La imagen está dañada.')); };
        image.onload = function () {
          var size = 256;
          var canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          var context = canvas.getContext('2d');

          var side = Math.min(image.width, image.height);
          var sx = (image.width - side) / 2;
          var sy = (image.height - side) / 2;

          context.drawImage(image, sx, sy, side, side, 0, 0, size, size);
          try {
            resolve(canvas.toDataURL('image/jpeg', 0.85));
          } catch (error) {
            reject(new Error('El navegador bloqueó el procesado de la imagen.'));
          }
        };
        image.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function avatarMarkup(user, size) {
    var cls = 'avatar' + (size ? ' avatar--' + size : '');
    if (user.avatar) {
      return window.Dom.h`<span class="${cls}"><img src="${user.avatar}" alt=""></span>`;
    }
    return window.Dom.h`<span class="${cls}">${window.Format.initials(user.name)}</span>`;
  }

  /* --------------------------------------------------------------------------
   * Bloques de la vista
   * ------------------------------------------------------------------------ */
  function profileCard(user) {
    return window.Dom.h`
      <section class="profile-card reveal" style="--i:0">
        <span class="avatar-ring">
          ${window.Dom.raw(avatarMarkup(user, 'xl'))}
        </span>

  function openProfileEditor() {

      body: window.Dom.h`

            <div class="grow">

              <div class="row" style="gap:var(--s-2);flex-wrap:wrap">
                <label class="btn btn--ghost btn--sm" style="cursor:pointer">
                  ${window.Dom.raw(window.Icon.render('camera'))} Subir foto
                  <input type="file" accept="image/*" id="avatar-input" class="sr-only">
                </label>
                <button class="btn btn--sm btn--ghost" type="button" data-action="remove-avatar">
                  ${window.Dom.raw(window.Icon.render('trash'))} Quitar
                </button>
              </div>
              <p class="field__hint" style="margin-top:6px">Se recorta en cuadrado y se guarda en tu navegador.</p>
            </div>
          </div>

          <div class="field" data-field="name">
            <label class="field__label" for="p-name">Nombre completo <span class="req">*</span></label>
            <input class="input" id="p-name" name="name" value="${user.name}">
            <span class="field__error">${window.Dom.raw(window.Icon.render('info'))}<span data-error-text></span></span>
          </div>

          <div class="field" data-field="email">
            <label class="field__label" for="p-email">Correo electrónico <span class="req">*</span></label>
            <input class="input" id="p-email" name="email" type="email" value="${user.email}">
            <span class="field__error">${window.Dom.raw(window.Icon.render('info'))}<span data-error-text></span></span>
          </div>

          <div class="field" data-field="phone">
            <label class="field__label" for="p-phone">Teléfono</label>
            <input class="input" id="p-phone" name="phone" type="tel" value="${user.phone || ''}">
            <span class="field__hint">Opcional, pero facilita la coordinación de la visita.</span>
          </div>

          <div class="field" data-field="city">
            <label class="field__label" for="p-city">Ciudad</label>
            <input class="input" id="p-city" name="city" value="${user.city || ''}">
          </div>

          <div class="field">
            <label class="field__label" for="p-bio">Sobre mí</label>
            <textarea class="textarea" id="p-bio" name="bio" maxlength="240"
                      placeholder="Cuéntale al refugio cómo sería la vida de tu compañero contigo…">${user.bio || ''}</textarea>
          </div>
        </form>`,
      footer: window.Dom.h`
        <button class="btn btn--ghost" type="button" data-modal-close>Cancelar</button>
        <button class="btn btn--primary grow" type="button" data-save-profile>Guardar cambios</button>`,
      onMount: function (dialog, close) {
        var draftAvatar = user.avatar;

        /* Subida de foto */
        var fileInput = window.Dom.qs('#avatar-input', dialog);
        fileInput.addEventListener('change', function () {
          var file = fileInput.files && fileInput.files[0];
          if (!file) { return; }
          resizeAvatar(file).then(function (dataUrl) {
            draftAvatar = dataUrl;
            var preview = window.Dom.qs('#avatar-preview', dialog);
            if (preview) { preview.innerHTML = window.Dom.h`<span class="avatar avatar--lg"><img src="${dataUrl}" alt=""></span>`; }
            window.Toast.success('Foto lista para guardar', 'Imagen actualizada');
          }).catch(function (error) {
            window.Toast.error(error.message, 'No pudimos usar esa imagen');
          });
        });

        window.Dom.qs('[data-action="remove-avatar"]', dialog).addEventListener('click', function () {
          draftAvatar = null;
          var preview = window.Dom.qs('#avatar-preview', dialog);
          var nameInput = window.Dom.qs('#p-name', dialog);
          if (preview) {
            preview.innerHTML = window.Dom.h`<span class="avatar avatar--lg">${window.Format.initials(nameInput.value)}</span>`;
          }
        });

        /* Guardado con validación */
        window.Dom.qs('[data-save-profile]', dialog).addEventListener('click', function () {
          var name = window.Dom.qs('#p-name', dialog).value.trim();
          var email = window.Dom.qs('#p-email', dialog).value.trim();
          var phone = window.Dom.qs('#p-phone', dialog).value.trim();
          var city = window.Dom.qs('#p-city', dialog).value.trim();
          var bio = window.Dom.qs('#p-bio', dialog).value.trim();
          var errors = {};

          if (name.length < 3) { errors.name = 'Escribe tu nombre completo.'; }
          if (!window.Format.isEmail(email)) { errors.email = 'Revisa el formato del correo.'; }
          if (phone && !window.Format.isPhone(phone)) { errors.phone = 'El teléfono debe tener al menos 9 dígitos.'; }

          window.Dom.qsa('.field', dialog).forEach(function (field) { field.classList.remove('has-error'); });
          if (Object.keys(errors).length) {
            Object.keys(errors).forEach(function (key) {
              var field = window.Dom.qs('[data-field="' + key + '"]', dialog);
              if (!field) { return; }
              field.classList.add('has-error');
              var text = window.Dom.qs('[data-error-text]', field);
              if (text) { text.textContent = errors[key]; }
            });
            window.Toast.error('Revisa los campos marcados', 'No pudimos guardar');
            return;
          }

          window.State.updateUser({ name: name, email: email, phone: phone, city: city, bio: bio, avatar: draftAvatar });
          window.App.refreshNavigation();
          close();
          window.Router.resolve();
          window.Toast.success('Tu perfil se actualizó correctamente', 'Cambios guardados');
        });
      }
    });
  }

  /* --------------------------------------------------------------------------
   * Montaje
   * ------------------------------------------------------------------------ */
  function mount(root) {
    if (!root) { return; }

    function repaint() {
      window.Router.resolve();
    }

    function onClick(event) {
      var action = event.target.closest('[data-action]');
      var favButton = event.target.closest('[data-fav]');

      /* Quitar de favoritos desde la lista */
      if (favButton) {
        var petId = favButton.getAttribute('data-fav');
        window.State.toggleFavorite(petId);
        window.App.refreshNavigation();
        window.Toast.heart('Mascota actualizada en tus favoritos');
        window.setTimeout(repaint, 180);
        return;
      }

      if (!action) { return; }
      var name = action.getAttribute('data-action');

      if (name === 'edit-profile') {
        openProfileEditor();
        return;
      }

      if (name === 'help') {
        openHelp();
        return;
      }

      if (name === 'logout') {
        window.Modal.confirm(
          'Saldrás de tu cuenta en este dispositivo. Tus favoritos y solicitudes se conservan.',
          { title: '¿Cerrar sesión?', confirmLabel: 'Cerrar sesión', cancelLabel: 'Cancelar', danger: true }
        ).then(function (confirmed) {
          if (!confirmed) { return; }
          window.Toast.info('Sesión cerrada. Vuelve pronto para seguir adoptando.');
        });
        return;
      }

      if (name === 'export-data') {
        var dump = window.Storage.exportAll();
        var blob = new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var link = document.createElement('a');
        link.href = url;
        link.download = 'adopta-datos.json';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        window.Toast.success('Descargamos tus datos en JSON', 'Exportación lista');
        return;
      }

      if (name === 'reset-demo') {
        window.Modal.confirm(
          'Se borrarán tu perfil editado, tus favoritos y tus solicitudes, y volverán los datos de ejemplo.',
          { title: '¿Restablecer la demo?', confirmLabel: 'Sí, restablecer', danger: true }
        ).then(function (confirmed) {
          if (!confirmed) { return; }
          window.State.resetDemo();
          window.App.refreshNavigation();
          window.Router.resolve();
          window.Toast.info('Datos de demostración restablecidos', 'Demo reiniciada');
        });
      }
    }

    /* Interruptores de preferencias y tema */
    function onChange(event) {
      var input = event.target.closest('[data-pref]');
      if (!input) { return; }
      var key = input.getAttribute('data-pref');

      if (key === 'darkMode') {
        window.State.setTheme(input.checked ? 'dark' : 'light');
        window.Topbar.updateThemeButton();
        return;
      }

      var patch = {};
      patch[key] = input.checked;
      window.State.updatePreferences(patch);
      window.Toast.show('Preferencia guardada', { variant: 'success', duration: 1800 });
    }

    root.addEventListener('click', onClick);
    root.addEventListener('change', onChange);

    window.Views.onLeave(function () {
      root.removeEventListener('click', onClick);
      root.removeEventListener('change', onChange);
    });
  }

  window.Views = window.Views || {};
  window.Views.account = { render: view, mount: mount };
})();

/* ==== js/app.js ==== */
/* ============================================================================
 * app.js — Arranque, enrutado global y comportamientos compartidos
 * ----------------------------------------------------------------------------
 * Responsabilidades:
 *   1. Registrar las rutas y montar las vistas
 *   2. Interceptar las acciones globales (favoritos, adopción, navegación)
 *   3. Gestionar la pantalla de carga, el scroll y el foco entre vistas
 *   4. Atajos de teclado, sincronización entre pestañas y registro del service
 *      worker opcional
 * ========================================================================== */
(function () {
  'use strict';

  var bootTime = Date.now();
  var SPLASH_MIN_MS = 1600;    /* tiempo mínimo visible de la pantalla de carga */
  var SPLASH_MAX_MS = 3000;    /* tiempo máximo solicitado en el diseño */

  /* ==========================================================================
     1. RUTAS
     ========================================================================== */
  function registerRoutes() {
    function page(name) {
      return function (params) {
        var view = window.Views[name];
        var mountScope = { teardown: null };

        /* Se limpia la vista anterior antes de construir la nueva */
        var result = view.render(params);

        /* El montaje se difiere hasta que el HTML esté en el DOM */
        window.App.pendingMount = { name: name, params: params, scope: mountScope };
        return result;
      };
    }

    window.Router.register('/', page('home'));
    window.Router.register('/mascotas', page('pets'));
    window.Router.register('/mascotas/:id', page('pet-detail'));
    window.Router.register('/solicitudes', page('requests'));
    window.Router.register('/cuenta', page('account'));

    window.Router.fallback(function () {
      window.A11y.setTitle('Página no encontrada');
      return window.Dom.h`
        <div class="empty" style="margin-top:var(--s-10)">
          <span class="empty__art">${window.Dom.raw(window.Icon.render('search'))}</span>
          <h3>Esta página no existe</h3>
          <p>El enlace puede estar roto o la sección cambió de dirección. Te llevamos de vuelta.</p>
          <div class="empty__actions">
            <a class="btn btn--primary" href="#/">${window.Dom.raw(window.Icon.render('home'))} Ir al inicio</a>
            <a class="btn btn--ghost" href="#/mascotas">Ver mascotas</a>
          </div>
        </div>`;
    });
  }

  /* ==========================================================================
     2. CICLO DE VIDA ENTRE VISTAS
     ========================================================================== */

  /* Se ejecuta tras cada pintado del router (ver router.js → afterPaint).
   * El montaje pendiente se lee siempre desde `window.App.pendingMount`, porque
   * lo registra el envoltorio de ruta y se consume en la microtarea siguiente. */
  function afterRender() {
    var pending = window.App.pendingMount;

    /* Foco y anuncio: cada cambio de vista se comunica a lectores de pantalla */
    var heading = window.Dom.qs('h1, h2, h3', window.Dom.qs('#vista'));
    window.A11y.focus(heading || window.Dom.qs('#vista'));

    /* Montaje de la vista: aquí se registran los listeners concretos */
    if (pending) {
      var view = window.Views[pending.name];
      var root = window.Dom.qs('#vista');
      var scope = pending.scope;

      window.App.pendingMount = null;

      /* Se limpia el montaje anterior antes de montar el nuevo */
      if (scope && typeof scope.teardown === 'function') {
        try { scope.teardown(); } catch (error) { /* noop */ }
      }

      if (view && typeof view.mount === 'function') {
        /* La vista registra sus limpiezas en este contenedor aislado */
        window.Views.setScope(scope);
        try {
          view.mount(root, pending.params);
        } catch (error) {
          if (window.console) { window.console.error('[Adopta] Error al montar la vista', error); }
        }
      }
    }

    /* Navegación activa, títulos y contadores siempre sincronizados */
    window.Nav.render();
  }

  function setLoading(isLoading) {
    /* Reservado para un indicador global de carga. Hoy las vistas usan
       esqueletos propios, así que solo se documenta el punto de extensión. */
    if (window.console && isLoading === undefined) { return; }
  }

  /* ==========================================================================
     3. ACCIONES GLOBALES (delegación en el documento)
     ========================================================================== */
  function wireGlobalActions() {
    document.addEventListener('click', function (event) {
      /* --- Favoritos: funciona en tarjetas, galería, listas y cuenta --- */
      var favButton = event.target.closest('[data-fav]');
      if (favButton) {
        var petId = favButton.getAttribute('data-fav');
        var added = window.State.toggleFavorite(petId);
        var pet = window.Repository._sync.getPet(petId);
        var name = pet ? pet.name : 'la mascota';

        /* Feedback inmediato y accesible */
        favButton.classList.toggle('is-active', added);
        favButton.classList.add('is-pop');
        favButton.setAttribute('aria-pressed', added ? 'true' : 'false');
        favButton.setAttribute('aria-label', added
          ? 'Quitar ' + name + ' de favoritos'
          : 'Guardar ' + name + ' en favoritos');
        favButton.innerHTML = window.Icon.render(added ? 'heartSolid' : 'heart');
        window.setTimeout(function () { favButton.classList.remove('is-pop'); }, 460);

        window.Toast.heart(added
          ? name + ' está en tus favoritos'
          : name + ' salió de tus favoritos');

        window.Nav.refreshBadges();
        window.A11y.announce(added ? name + ' guardada en favoritos' : name + ' eliminada de favoritos');
        return;
      }

      /* --- Abrir el flujo de adopción --- */
      var adoptButton = event.target.closest('[data-action="adopt"]');
      if (adoptButton) {
        event.preventDefault();
        var targetPet = window.Repository._sync.getPet(adoptButton.getAttribute('data-pet'));
        if (!targetPet) { return; }
        if (window.State.getRequestForPet(targetPet.id)) {
          window.Toast.info('Ya tienes una solicitud en curso para ' + targetPet.name, 'Solicitud existente');
          return;
        }
        window.AdoptionForm.open(targetPet);
        return;
      }

      /* --- Navegación interna (evita recargar la página) --- */
      var navLink = event.target.closest('[data-nav]');
      if (navLink && navLink.tagName === 'A') {
        var href = navLink.getAttribute('href') || '';
        if (href.indexOf('#/') === 0) {
          event.preventDefault();
          window.Router.navigate(href.slice(1));
          return;
        }
      }

      /* --- Volver a la vista anterior --- */
      var backLink = event.target.closest('[data-action="back"]');
      if (backLink) {
        event.preventDefault();
        if (document.referrer && document.referrer.indexOf(window.location.origin) === 0) {
          window.history.back();
        } else {
          window.Router.navigate('/mascotas');
        }
        return;
      }

      /* --- Limpiar filtros desde el estado vacío de Inicio --- */
      var clearHome = event.target.closest('[data-action="clear-filters-home"]');
      if (clearHome) {
        window.State.resetFilters();
        window.Router.navigate('/', { force: true });
        return;
      }

      /* --- Funciones aún no disponibles (app móvil, etc.) --- */
      var soon = event.target.closest('[data-action="coming-soon"]');
      if (soon) {
        var label = soon.getAttribute('data-label') || 'Esta función';
        window.Toast.info(label + ' llegará muy pronto. Mientras tanto, sigue explorando desde el navegador.');
      }
    });

    /* Enlaces del encabezado y la barra inferior: navegación suave */
    document.addEventListener('click', function (event) {
      var hashLink = event.target.closest('a[href^="#/"]');
      if (!hashLink) { return; }
      /* El router escucha hashchange: basta con cerrar overlays abiertos */
      if (window.Modal.isOpen()) { window.Modal.closeAll(); }
    });
  }

  /* ==========================================================================
     4. ATAJOS DE TECLADO
     ========================================================================== */
  function wireShortcuts() {
    document.addEventListener('keydown', function (event) {
      /* Escape cierra modales (el <dialog> nativo ya lo hace) y sugerencias */
      if (event.key === 'Escape' && !window.Modal.isOpen()) {
        var suggest = window.Dom.qs('.suggest');
        if (suggest && suggest.parentNode) { suggest.parentNode.removeChild(suggest); }
        return;
      }

      /* "/" enfoca el buscador de la vista, como en muchos catálogos */
      if (event.key === '/' && !/input|textarea|select/i.test(event.target.tagName)) {
        var search = window.Dom.qs('[data-search-input]');
        if (search) {
          event.preventDefault();
          search.focus();
          search.select();
        }
        return;
      }

      /* Atajos con Alt: navegación rápida sin ratón */
      if (!event.altKey || event.ctrlKey || event.metaKey) { return; }
      var map = { h: '/', m: '/mascotas', s: '/solicitudes', c: '/cuenta' };
      var target = map[event.key.toLowerCase()];
      if (target) {
        event.preventDefault();
        window.Router.navigate(target);
      }
    });
  }

  /* ==========================================================================
     5. SINCRONIZACIÓN ENTRE PESTAÑAS
     ========================================================================== */
  function wireCrossTabSync() {
    window.addEventListener('storage', function (event) {
      if (!event.key || event.key.indexOf(window.Storage.namespace) !== 0) { return; }
      window.Toast.info('Actualizamos los datos: cambiaste algo en otra pestaña', 'Sincronizando');
      /* Recarga la vista para reflejar el estado más reciente del almacenamiento */
      window.Router.resolve();
      window.Nav.render();
    });
  }

  /* ==========================================================================
     6. PANTALLA DE CARGA
     ========================================================================== */
  function hideSplash() {
    var splash = document.getElementById('splash');
    if (!splash || splash.classList.contains('is-hidden')) { return; }
    splash.classList.add('is-hidden');
    window.setTimeout(function () {
      if (splash.parentNode) { splash.parentNode.removeChild(splash); }
    }, 520);
  }

  function setupSplash() {
    var splash = document.getElementById('splash');
    if (!splash) { return; }

    var elapsed = Date.now() - bootTime;
    var wait = Math.max(0, SPLASH_MIN_MS - elapsed);

    window.setTimeout(hideSplash, Math.min(wait, SPLASH_MAX_MS));

    /* El usuario puede saltarla con un clic, una tecla o un toque */
    var skip = function () { hideSplash(); };
    splash.addEventListener('click', skip);
    document.addEventListener('keydown', skip, { once: true });
  }

  /* ==========================================================================
     7. ARRANQUE
     ========================================================================== */
  function boot() {
    /* Marca de arranque: útil para pruebas automáticas y depuración */
    window.__BOOT = {
      at: new Date().toISOString(),
      splashVisible: !!document.getElementById('splash') &&
        !document.getElementById('splash').classList.contains('is-hidden')
    };

    /* Navegación y encabezado */
    window.Nav.render();
    window.Topbar.init();

    /* Estado inicial anunciado en consola: útil para depurar la demo */
    if (window.console) {
      var pets = window.Repository.speciesCounts().todos;
      window.console.info(
        '%c Adopta %c demo lista · ' + pets + ' mascotas · estado en localStorage (' + window.Storage.namespace + ') ',
        'background:#FF6B35;color:#fff;border-radius:4px 0 0 4px;padding:2px 6px;font-weight:700',
        'background:#2D2A28;color:#FFF4EE;border-radius:0 4px 4px 0;padding:2px 6px'
      );
    }

    registerRoutes();
    wireGlobalActions();
    wireShortcuts();
    wireCrossTabSync();

    /* Suscripción global: mantiene la navegación coherente con el estado */
    window.State.subscribe(function (state, event) {
      if (!event) { return; }
      if (event.type === 'favorites:toggle' || event.type === 'requests:create' ||
          event.type === 'requests:cancel' || event.type === 'user:update') {
        window.Nav.refreshBadges();
        window.Nav.refreshAvatar();
      }
      if (event.type === 'theme:change') { window.Topbar.updateThemeButton(); }
    });

    /* Primera resolución de ruta y retirada de la pantalla de carga */
    window.Router.start().then(function () {
      setupSplash();
    }).catch(function (error) {
      if (window.console) { window.console.error('[Adopta] Fallo al iniciar el router', error); }
      setupSplash();
    });

    /* Precarga de las imágenes más probables: hace que el catálogo se sienta
       instantáneo en la segunda visita. */
    window.Media.preload(
      window.Repository._sync.featuredPets(4).map(function (pet) { return pet.cover; }),
      600
    );
  }

  /* API pública para el resto de módulos */
  window.App = {
    boot: boot,
    afterRender: afterRender,
    setLoading: setLoading,
    refreshNavigation: function () {
      window.Nav.refreshBadges();
      window.Nav.refreshAvatar();
    },
    pendingMount: null,
    version: '1.0.0'
  };

  /* Arranque cuando el DOM esté listo (los scripts van al final del body) */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

</script>
